<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حراء | استبدال فيديو الدرس</title><style>body{max-width:760px;margin:50px auto;padding:24px;background:#fbf7ee;color:#102a4c;font:20px/1.8 serif}button,select{padding:12px;margin:10px 0;font:inherit}dialog{border:1px solid #c4943a;border-radius:20px;padding:28px}label{display:block}pre{font:18px/1.6 serif}</style><h1>حراء | استبدال فيديو الدرس</h1><p>للمشرف العام فقط. يحفظ معرّف الفيديو وأسئلته وصلاحياته والملف القديم، دون حذف.</p><label>الدرس<select id="lesson"><option value="13f33c28-cb24-4413-819e-2c97275da0ea">NN T1 L01 التحية</option><option value="6c6b270e-879c-4128-8cc0-7c1eecee70f3">NN T1 L02 الألوان</option><option value="2c6cca7c-9a3a-4816-883c-03dfbab9bf74">NN T1 L03 المشاعر</option><option value="6953514f-504f-494b-a7d6-ae2d64ea2281">NN T1 L04 أرقام</option><option value="a1b0156c-31d6-400c-badb-142b63435dad">NN T1 L05 أشكال</option><option value="0a9e632a-09a7-4498-b68c-80a0f0e0e9ba">NN T1 L06 الأسرة</option><option value="8c552527-9f7b-4175-ae4f-91a5f3c5f6a1">NN T1 L07 الجسم</option><option value="6cdee414-81ac-441a-9750-5cb2c5a30e54">NN T1 L08 الطعام</option><option value="ccb37702-74cc-4835-981a-7a13d43e9863">NN T1 L09 المهن</option><option value="5cdcf35b-4af4-4e68-b7f4-263f1b9d5191">NN T1 L10 أيام الأسبوع</option><option value="f256647c-943f-4377-bd7a-8ff5598d73e0">NN T2 L01 الأرنب</option><option value="4103d2c9-3910-4a78-84d9-82346d7958a0">NN T2 L02 البطة</option><option value="48a40abf-15d8-4e7d-87c9-8f20359d9fae">NN T2 L03 التمساح</option><option value="e7c36c82-401a-4e59-bdf5-f187c924e1fa">NN T2 L04 الثعلب</option><option value="62b1838c-da4f-4015-87bc-01e9a8626f09">NN T2 L05 الجمل</option><option value="81b7ea7e-305b-47bf-81ec-abf7c4977e5e">L12 الذال</option><option value="6b1ee71e-0e8b-4b5a-99ee-c62fa3433723">L14 الراء</option><option value="31a8f8d4-6cb0-4640-bb15-128191207255">L15 الزاي</option><option value="38d8e006-7d8a-4c9b-a6ee-cabdd6aa225c">L16 مراجعة</option><option value="6ed62514-da38-46c7-898e-6b4326e301d0">L17 السين</option><option value="f11c6566-475b-40e3-9df5-e18baf773ac9">L09</option><option value="a327e779-fa99-48a7-b5cf-480e416ddb9b">L10</option><option value="b9255a2a-7d42-4cdb-b4fc-bec0e0648baf">L11</option><option value="b8216e4b-9b5d-4b5f-a1b0-60ce6084c266">L18</option><option value="2a6dcd80-2f03-4da6-b94a-df570bf353eb">L19</option></select></label><button id="start">فحص مواد الدرس المحدد</button><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script>window.HIRAA_CONFIG = { supabaseUrl: "https://vsbktjbwjykgtkkqfblj.supabase.co", supabaseKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzYmt0amJ3anlrZ3Rra3FmYmxqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NDc2MTYsImV4cCI6MjEwOTEyMzYxNn0.ZR43uZNPdpnw8vhEf5Qr2ThHjRTZC2seCICDjiMfeW8" };
/* Hira scoped video replacement. Keeps original id, challenge, access and both media objects. */
(function () {
  'use strict';
  document.getElementById('start').onclick=()=>open(document.getElementById('lesson').value);
  async function open(lesson) {
    const cfg=window.HIRAA_CONFIG;if(!cfg)return;
    const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey);
    const {data:auth}=await sb.auth.getSession();const uid=auth?.session?.user?.id;if(!uid)return;
    const {data:profile,error:pe}=await sb.from('profiles').select('role').eq('id',uid).single();if(pe||profile.role!=='super_admin')return;
    const {data:rows,error}=await sb.from('lesson_resources').select('*').eq('lesson_id',lesson).eq('kind','video');if(error||rows.length<2){alert('يلزم الفيديو الحالي والفيديو الجديد المرفوع.');return;}
    const d=document.createElement('dialog');d.style.maxWidth='720px';d.style.width='90%';
    const title=document.createElement('h2');title.textContent='استبدال الفيديو مع حفظ التحدّي';d.append(title);
    const hint=document.createElement('p');hint.textContent='يبقى معرّف الفيديو الحالي وأسئلته وصلاحياته كما هي. تصبح المادة الجديدة نسخة احتياطية للمعلم من الملف القديم. لا يحذف أي ملف.';d.append(hint);
    const selects=[];
    for(const label of ['الفيديو الحالي ذو التحدّي','الفيديو الجديد الذي تمت مراجعته']){
      const l=document.createElement('label');l.textContent=label;const s=document.createElement('select');s.style.width='100%';
      rows.forEach(r=>{const o=document.createElement('option');o.value=r.id;o.textContent=r.id.slice(0,8)+' | '+r.title_ar+' | '+r.storage_path?.split('/').pop();s.append(o);});l.append(s);d.append(l);selects.push(s);
    }
    selects[1].selectedIndex=1;
    const status=document.createElement('pre');status.style.whiteSpace='pre-wrap';d.append(status);
    const go=document.createElement('button');go.type='button';go.className='btn btn-primary';go.textContent='تحقق واستبدل';d.append(go);
    const close=document.createElement('button');close.type='button';close.className='btn';close.textContent='إغلاق';close.onclick=()=>d.remove();d.append(close);document.body.append(d);d.showModal();
    go.onclick=async()=>{
      go.disabled=true;let original,newer,switched=false;
      try{
        if(selects[0].value===selects[1].value)throw Error('اختر مادتين مختلفتين');
        const fresh=await sb.from('lesson_resources').select('*').in('id',selects.map(s=>s.value)).eq('lesson_id',lesson);if(fresh.error)throw fresh.error;
        original=fresh.data.find(r=>r.id===selects[0].value);newer=fresh.data.find(r=>r.id===selects[1].value);
        if(!original?.meta?.challenge||newer?.meta?.challenge||original.kind!=='video'||newer.kind!=='video'||!original.storage_path||!newer.storage_path||original.url||newer.url||original.storage_path===newer.storage_path)throw Error('حالة المواد لا تطابق الاستبدال الآمن');
        for(const r of [original,newer]){const parts=r.storage_path.split('/');const name=parts.pop();const check=await sb.storage.from('lesson-files').list(parts.join('/'),{search:name});if(check.error||!check.data.some(x=>x.name===name))throw Error('تعذّر التحقق من الملف: '+name);}
        if(!confirm('الفيديو الحالي: '+original.storage_path+'\nالفيديو البديل: '+newer.storage_path+'\nسيحفظ القديم في مادة ملف للمعلم، دون حذف. هل تم التحقق من تشغيل البديل؟')){go.disabled=false;return;}
        const stamp=new Date().toISOString();
        const meta=Object.assign({},original.meta,{replacement_backup:{storage_path:original.storage_path,replacement_resource_id:newer.id,at:stamp}});
        const u=await sb.from('lesson_resources').update({storage_path:newer.storage_path,meta}).eq('id',original.id).eq('storage_path',original.storage_path).select('*').single();if(u.error)throw u.error;switched=true;
        const archive=await sb.from('lesson_resources').update({kind:'file',title_ar:'نسخة احتياطية قبل استبدال الفيديو',storage_path:original.storage_path,audience:'teacher',is_public:false,meta:{video_backup_for:original.id,replaced_at:stamp}}).eq('id',newer.id).eq('storage_path',newer.storage_path).select('*').single();if(archive.error)throw archive.error;
        const verify=await sb.from('lesson_resources').select('*').in('id',[original.id,newer.id]);if(verify.error)throw verify.error;
        const current=verify.data.find(r=>r.id===original.id),backup=verify.data.find(r=>r.id===newer.id);
        if(current.storage_path!==newer.storage_path||current.meta.challenge!==original.meta.challenge||current.audience!==original.audience||current.is_public!==original.is_public||backup.kind!=='file'||backup.storage_path!==original.storage_path||backup.audience!=='teacher'||backup.is_public)throw Error('تحقق من الحالة قبل المتابعة');
        status.textContent='تم الاستبدال وحفظ الأسئلة والصلاحيات والنسخة الاحتياطية. حدّث الصفحة ثم اختبر الفيديو والتحدّي والشرائح.';go.textContent='تم';
      }catch(e){
        if(switched&&original){const restoreNew=await sb.from('lesson_resources').update({kind:newer.kind,title_ar:newer.title_ar,storage_path:newer.storage_path,audience:newer.audience,is_public:newer.is_public,meta:newer.meta}).eq('id',newer.id);const rollback=await sb.from('lesson_resources').update({storage_path:original.storage_path,meta:original.meta}).eq('id',original.id);status.textContent=(rollback.error||restoreNew.error?'يلزم فحص يدوي: ':'أعيد الفيديو الأصلي: ')+(e.message||String(e));}
        else status.textContent=e.message||String(e);
        go.disabled=false;
      }
    };
  }
})();
</script></html>
