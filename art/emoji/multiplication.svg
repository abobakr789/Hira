<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360"><rect x="45" y="30" width="310" height="300" rx="20" fill="#e9f2fb" stroke="#6889a8" stroke-width="9"/><text x="200" y="110" font-size="42" font-family="Arial" text-anchor="middle" fill="#233e60">2 × 3 = 6</text><text x="200" y="190" font-size="42" font-family="Arial" text-anchor="middle" fill="#233e60">3 × 4 = 12</text><text x="200" y="270" font-size="42" font-family="Arial" text-anchor="middle" fill="#233e60">4 × 5 = 20</text></svg>