:root[data-theme="dark"] {
  --paper: #0F1620; --stone: #16202C; --stone-2: #1D2937; --ink: #E8ECEF; --muted: #9AA6B3;
  --line: #26323F; --hira: #2EC4C4; --hira-deep: #8FE3E3; --hira-soft: #0F2E2E;
  --dawn: #F9B20B; --dawn-soft: #2B2516; --night: #0A0F16; --on-hira: #0F1620; --danger: #FF8A80;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 80px); }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-ui); font-size: calc(17px * var(--fs-scale, 1)); line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--paper);
}
img, svg { max-width: 100%; }
a { color: var(--hira); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid var(--dawn); outline-offset: 2px; border-radius: 4px;
}
h1, h2, h3 { line-height: 1.35; margin: 0 0 .5em; font-weight: 700; }
h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); }
h2 { font-size: clamp(1.4rem, 2.6vw, 1.8rem); }
h3 { font-size: 1.15rem; }
p { margin: 0 0 1em; max-width: 68ch; }
.muted { color: var(--muted); }
.wrap { width: min(1180px, 100% - 40px); margin-inline: auto; }
main#main:focus, main#main:focus-visible { outline: none; }
.skip { position: absolute; inset-inline-start: -999px; }
.skip:focus { inset-inline-start: 12px; top: 12px; z-index: 50; background: var(--paper); padding: 8px 14px; }

/* Header */
.site-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: saturate(1.2) blur(10px);
  border-bottom: 1px solid var(--line);
}
.header-row { display: flex; align-items: center; gap: 28px; min-height: 76px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand-logo { height: 64px; width: auto; display: block; }
.m-stone { fill: var(--hira); }
.m-light { fill: var(--dawn); }
.main-nav { display: flex; gap: 6px; flex: 1; }
.main-nav a { color: var(--ink); text-decoration: none; padding: 8px 14px; border-radius: 999px; font-weight: 500; }
.main-nav a:hover { background: var(--stone); }
.main-nav a.active { background: var(--hira-soft); color: var(--hira-deep); }
.auth-slot { display: flex; align-items: center; gap: 10px; }
.user-chip { font-size: .9rem; color: var(--muted); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: inherit; font-weight: 600; font-size: .95rem; cursor: pointer;
  padding: 10px 20px; border-radius: 999px; border: 1.5px solid transparent; text-decoration: none;
}
.btn-primary { background: var(--hira); color: var(--on-hira); }
.btn-primary:hover { background: var(--hira-deep); }
.btn-ghost { border-color: var(--line); color: var(--ink); background: transparent; }
.btn-ghost:hover { border-color: var(--hira); color: var(--hira); }
.btn-dawn { background: var(--dawn); color: #241A05; }
.hero .btn-dawn:hover { filter: brightness(1.06); }
.btn-small { padding: 6px 14px; font-size: .85rem; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }

/* Hero — the one bold moment */
.hero { background: var(--night); color: #F3F1EA; overflow: hidden; position: relative; }
.hero-grid { display: grid; grid-template-columns: 1.05fr .95fr; align-items: end; gap: 24px; min-height: min(78vh, 640px); }
.hero-copy { padding: 72px 0 80px; position: relative; z-index: 2; }
.hero .hero-word {
  font-family: var(--font-text); font-weight: 700; font-size: clamp(5rem, 15vw, 11rem);
  line-height: .9; margin: 0 0 18px; color: var(--dawn);
  text-shadow: 0 0 60px color-mix(in srgb, var(--dawn) 45%, transparent);
}
.hero h1 { color: #FFFFFF; font-size: clamp(1.6rem, 3.2vw, 2.3rem); font-weight: 600; max-width: 22ch; }
.hero p { color: #C9D1DA; font-size: 1.08rem; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.hero .btn-ghost { color: #F3F1EA; border-color: #3A4A63; }
.hero .btn-ghost:hover { border-color: var(--dawn); color: var(--dawn); }
.hero-art { align-self: stretch; display: flex; align-items: flex-end; }
.hero-art svg { width: 100%; height: auto; display: block; }
.cave-glow { animation: glow 2.6s ease-out both; transform-origin: 50% 100%; }
.light-beam { animation: beam 3.2s ease-out .4s both; }
@keyframes glow { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
@keyframes beam { from { opacity: 0; } to { opacity: .55; } }
@media (prefers-reduced-motion: reduce) {
  .cave-glow, .light-beam { animation: none; }
}

/* Sections */
.section { padding: 76px 0; }
.section-alt { background: var(--stone); }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 32px; flex-wrap: wrap; }
.section-head p { margin: 0; color: var(--muted); }

/* Audience tabs (Alef-style stakeholder tabs) */
.aud-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
.aud-tab {
  font: inherit; font-weight: 600; padding: 10px 22px; border-radius: 999px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
}
.aud-tab[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.aud-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
.aud-point h3 { display: flex; align-items: center; gap: 10px; }
.aud-point h3 svg { width: 26px; height: 26px; flex: none; color: var(--hira); }
.aud-point p { color: var(--muted); margin: 0; }

/* Grade ladder */
.stage { margin-bottom: 34px; }
.stage-title { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.stage-title h3 { margin: 0; }
.stage-title span { color: var(--muted); font-size: .9rem; }
.grade-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.grade-tile {
  display: block; text-decoration: none; color: var(--ink);
  background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--radius-s);
  padding: 16px 18px; position: relative;
}
.grade-tile:hover { border-color: var(--hira); }
.grade-tile .y { font-size: 1.35rem; font-weight: 700; display: block; }
.grade-tile .g { font-size: .85rem; color: var(--muted); }
.grade-tile .status { display: block; margin-top: 10px; font-size: .8rem; font-weight: 600; }
.grade-tile.ready { border-color: var(--hira); }
.grade-tile.ready .status { color: var(--hira); }
.grade-tile.soon .status { color: var(--muted); }

/* Page head */
.page-head { background: var(--stone); padding: 44px 0 0; border-bottom: 1px solid var(--line); }
.crumbs { font-size: .9rem; color: var(--muted); margin-bottom: 10px; }
.crumbs a { color: var(--muted); }
.page-head h1 { margin-bottom: 6px; }
.head-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 500; padding: 4px 12px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); color: var(--muted); }
.pill.axis { background: var(--hira-soft); border-color: transparent; color: var(--hira-deep); }
.pill.warn { background: var(--dawn-soft); border-color: transparent; color: var(--ink); }

/* Track switch + term tabs */
.controls { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: end; margin-top: 26px; }
.seg { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.seg button, .seg a {
  font: inherit; font-weight: 600; font-size: .92rem; border: 0; background: transparent; color: var(--muted);
  padding: 8px 18px; border-radius: 999px; cursor: pointer; text-decoration: none;
}
.seg [aria-pressed="true"], .seg [aria-current="true"] { background: var(--hira); color: var(--on-hira); }
.term-tabs { display: flex; gap: 4px; }
.term-tab {
  font: inherit; font-weight: 600; border: 0; background: transparent; color: var(--muted); cursor: pointer;
  padding: 12px 20px; border-bottom: 3px solid transparent;
}
.term-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--dawn); }

/* Units & lessons */
.layout-2 { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 40px; align-items: start; }
.unit { margin-bottom: 40px; }
.unit-head { display: flex; align-items: baseline; gap: 14px; border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 4px; }
.unit-head .n { color: var(--dawn); font-family: var(--font-text); font-size: 1.6rem; font-weight: 700; }
.unit-head h2 { margin: 0; font-size: 1.35rem; }
.unit-head .en { color: var(--muted); font-size: .9rem; margin-inline-start: auto; direction: ltr; }
.lesson-row {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 14px; align-items: center;
  padding: 14px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink);
}
.lesson-row:hover { background: var(--stone); }
.lesson-row .idx { color: var(--muted); font-weight: 600; text-align: center; }
.lesson-row .t { font-weight: 600; display: block; }
.lesson-row .te { color: var(--muted); font-size: .85rem; direction: ltr; text-align: end; display: block; }
.lesson-row .meta { display: flex; gap: 6px; align-items: center; }
.res-dots { display: flex; gap: 4px; }
.res-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.res-dot.on { background: var(--hira); }

.side-card { background: var(--stone); border-radius: var(--radius-l); padding: 24px; position: sticky; top: 96px; }
.side-card h3 { margin-bottom: 14px; }
.outcome-group { margin-bottom: 16px; }
.outcome-group h4 { margin: 0 0 6px; font-size: .9rem; color: var(--hira-deep); }
.outcome { font-size: .88rem; margin: 0 0 8px; color: var(--ink); }
.outcome code, .code { font-family: var(--font-ui); direction: ltr; unicode-bidi: isolate; font-size: .78rem; color: var(--muted); background: var(--paper); padding: 1px 6px; border-radius: 4px; }

/* Lesson page */
.lesson-tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 26px; scrollbar-width: thin; }
.lesson-tab {
  font: inherit; font-weight: 600; white-space: nowrap; cursor: pointer; border: 0; background: transparent;
  color: var(--muted); padding: 12px 18px; border-bottom: 3px solid transparent;
}
.lesson-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--dawn); }
.panel { padding: 36px 0 60px; }
.res-list { display: grid; gap: 12px; }
.res-item {
  display: flex; gap: 14px; align-items: center; padding: 16px 18px; border: 1.5px solid var(--line);
  border-radius: var(--radius-s); text-decoration: none; color: var(--ink);
}
.res-item:hover { border-color: var(--hira); }
.res-item .kind { font-size: .8rem; color: var(--muted); display: block; }
.res-item svg { width: 28px; height: 28px; color: var(--hira); flex: none; }
.video-frame { aspect-ratio: 16/9; width: 100%; border: 0; border-radius: var(--radius-s); background: var(--stone); }
.empty {
  border: 1.5px dashed var(--line); border-radius: var(--radius-l); padding: 34px; text-align: center; color: var(--muted);
}
.empty strong { display: block; color: var(--ink); margin-bottom: 4px; }

.evidence { border-inline-start: 4px solid var(--dawn); padding: 6px 22px; margin: 0 0 26px; }
.evidence .txt { font-family: var(--font-text); font-size: 1.6rem; line-height: 2.1; margin: 0 0 8px; }
.evidence .src { font-size: .88rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.quran-ref { font-family: var(--font-text); font-size: 1.8rem; }

.identity-card { background: var(--hira-soft); border-radius: var(--radius-l); padding: 24px 26px; margin-bottom: 16px; }
.identity-card .pillar { font-size: .85rem; font-weight: 600; color: var(--hira-deep); }
.identity-card p { margin: 6px 0 0; font-size: 1.05rem; }
.identity-card .en { direction: ltr; text-align: left; color: var(--muted); font-size: .92rem; }

/* Forms */
.form-card { max-width: 440px; margin: 60px auto; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-l); padding: 34px; }
.field { display: grid; gap: 6px; margin-bottom: 16px; }
.field label { font-weight: 600; font-size: .92rem; }
.field input, .field select, .field textarea {
  font: inherit; padding: 10px 14px; border-radius: var(--radius-s); border: 1.5px solid var(--line);
  background: var(--paper); color: var(--ink);
}
.field input[dir="ltr"] { text-align: left; }
.form-error { color: var(--danger); font-size: .9rem; min-height: 1.4em; }
.check { display: flex; gap: 8px; align-items: center; font-size: .92rem; }

/* Admin */
.admin-table { width: 100%; border-collapse: collapse; font-size: .92rem; }
.table-wrap { overflow-x: auto; }
.admin-table th, .admin-table td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; }
.admin-table th { color: var(--muted); font-weight: 600; font-size: .82rem; }
.admin-filters { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 22px; align-items: end; }
.admin-filters .field { margin: 0; }
dialog { border: 0; border-radius: var(--radius-l); padding: 28px; width: min(520px, 100% - 32px); background: var(--paper); color: var(--ink); }
dialog::backdrop { background: rgba(10, 15, 22, .55); }
.dialog-actions { display: flex; gap: 10px; justify-content: flex-start; margin-top: 8px; }

/* About */
.prose { max-width: 70ch; }
.prose p { font-size: 1.05rem; }

/* Footer */
.site-footer { border-top: 1px solid var(--line); padding: 34px 0; margin-top: 40px; }
.footer-row { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.footer-row p { margin: 4px 0 0; }

.toast {
  position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); inset-inline-start: 50%; transform: translateX(50%);
  background: var(--ink); color: var(--paper); padding: 12px 22px; border-radius: 999px; font-weight: 500;
  opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60;
}
.toast.show { opacity: 1; }
.loading { padding: 80px 0; text-align: center; color: var(--muted); }

@media (max-width: 900px) {
  .hero-grid { grid-template-columns: 1fr; min-height: 0; }
  .hero-copy { padding: 48px 0 10px; }
  .hero-art { max-width: 520px; margin-inline: auto; }
  .aud-panel { grid-template-columns: 1fr; }
  .layout-2 { grid-template-columns: 1fr; }
  .side-card { position: static; }
}
@media (max-width: 640px) {
  .header-row { gap: 12px; flex-wrap: wrap; padding: 8px 0; }
  .main-nav { order: 3; flex-basis: 100%; overflow-x: auto; }
  .brand-logo { height: 46px; }
  .unit-head .en { display: none; }
  .lesson-row { grid-template-columns: 28px 1fr; }
  .lesson-row .meta { grid-column: 2; }
}

/* Domain filter chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 30px; }
.chips-label { font-weight: 600; color: var(--muted); font-size: .9rem; margin-inline-end: 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink);
  font-size: .9rem; font-weight: 500; padding: 7px 14px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--paper);
}
.chip span { font-size: .78rem; color: var(--muted); background: var(--stone); padding: 0 7px; border-radius: 999px; }
.chip:hover { border-color: var(--hira); }
.chip[aria-current="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip[aria-current="true"] span { background: transparent; color: var(--paper); }
.chip::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--dc, var(--line)); }
.chip:first-of-type::before { display: none; }
.d1 { --dc: #008080; } .d2 { --dc: #3B6FB6; } .d3 { --dc: #C2185B; }
.d4 { --dc: #E08A00; } .d5 { --dc: #6A4CA8; } .d6 { --dc: #2E7D32; }
.pill.axis[class*=" d"] { box-shadow: inset -3px 0 0 var(--dc, transparent); }

/* Brand word: "حراء" always in the logo-like typeface */
.hira-word { font-family: var(--font-brand); font-weight: 600; color: var(--hira); letter-spacing: 0; }
.hero .hira-word { color: var(--dawn); }
.hero h1 { max-width: 26ch; line-height: 1.5; }
.hero-copy p { max-width: 60ch; }
.contact-btn { white-space: nowrap; }
.footer-tagline { font-size: 1.1rem; font-weight: 600; margin: 0 0 4px; }
.footer-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.footer-side p { margin: 0; }
.contact-card { max-width: 560px; margin: 0 auto; }
.field textarea { resize: vertical; min-height: 140px; }
.hp { position: absolute; inset-inline-start: -9999px; height: 0; overflow: hidden; }
.msgs { border: 1.5px solid var(--line); border-radius: var(--radius-l); padding: 16px 20px; margin-bottom: 28px; }
.msgs summary { cursor: pointer; display: flex; gap: 10px; align-items: center; }
.msg { border-top: 1px solid var(--line); padding: 14px 0; }
.msg.unread { border-inline-start: 4px solid var(--dawn); padding-inline-start: 12px; }
.msg p { margin: 6px 0 10px; white-space: pre-wrap; }
@media (max-width: 640px) { .footer-side { align-items: flex-start; } }

.contact-direct { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 900px; margin: 0 auto 26px; }
.contact-item { display: flex; align-items: center; gap: 14px; padding: 18px 20px; border: 1.5px solid var(--line); border-radius: var(--radius-l); text-decoration: none; color: var(--ink); background: var(--paper); }
.contact-item:hover { border-color: var(--hira); }
.contact-item svg { width: 30px; height: 30px; color: var(--hira); flex: none; }
.ci-label { display: block; font-size: .85rem; color: var(--muted); }
.ci-value { display: block; font-weight: 600; font-size: 1.05rem; unicode-bidi: isolate; overflow-wrap: anywhere; }
.contact-or { text-align: center; margin: 0 auto 14px; }
@media (max-width: 760px) { .contact-direct { grid-template-columns: 1fr; } }

/* Lesson locking */
.lock-ic { width: 15px; height: 15px; vertical-align: -2px; }
.lesson-row.locked .t { color: var(--muted); }
.lock-pill { background: var(--stone); color: var(--muted); }
.locked-box svg { width: 34px; height: 34px; display: block; margin: 0 auto 8px; color: var(--muted); }
.res-group { margin: 26px 0 12px; display: flex; gap: 10px; align-items: center; }
.res-group:first-child { margin-top: 0; }
.lock-mode { display: flex; gap: 16px; align-items: flex-start; padding: 18px 20px; border-radius: var(--radius-l); background: var(--stone); }
.lock-mode.on { background: var(--dawn-soft); }
.lock-mode p { margin: 4px 0 0; }
.switch { position: relative; width: 50px; height: 28px; flex: none; margin-top: 2px; }
.switch input { opacity: 0; width: 100%; height: 100%; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch input:checked + span { background: var(--hira); }
.switch input:checked + span::after { transform: translateX(-22px); }
.switch input:focus-visible + span { outline: 3px solid var(--dawn); outline-offset: 2px; }
.t-row .t { text-decoration: none; color: inherit; font-weight: 600; }
.t-row.locked { opacity: .85; }

/* Accounts */
.school-badge { display: inline-block; background: var(--hira-soft); color: var(--hira-deep); font-weight: 600; padding: 4px 14px; border-radius: 999px; margin: 0 0 10px; }
.notice { background: var(--dawn-soft); border-radius: var(--radius-s); padding: 14px 18px; margin: 16px 0; }
.notice p { margin: 6px 0 0; }
.chk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 16px; }
.print-area { display: none; }
@media print {
  body > *:not(.print-area) { display: none !important; }
  body::before { display: none; }
  .print-area { display: grid !important; grid-template-columns: 1fr 1fr; gap: 10mm; padding: 6mm; }
  .card-login { break-inside: avoid; border: 1.5px dashed #888; border-radius: 10px; padding: 10px 12px; font-family: var(--font-ui); color: #000; }
  .cl-head { display: flex; justify-content: space-between; border-bottom: 1px solid #ccc; padding-bottom: 4px; margin-bottom: 8px; font-size: 12px; }
  .cl-body { display: flex; gap: 12px; align-items: center; }
  .cl-info { font-size: 12px; line-height: 1.8; }
  .cl-name { font-size: 15px; font-weight: 700; }
  .cl-foot { font-size: 10px; color: #555; margin-top: 6px; text-align: center; }
}

.t-meta { flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.sched input { font: inherit; font-size: .82rem; padding: 4px 8px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--ink); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.sched-pill { margin-inline-start: 8px; font-size: .75rem; }

.q-opt.right { border-color: #2E9E5B; background: #E9F7EE; } .q-opt.wrong { border-color: #D64545; background: #FDE2E1; }

@media print {
  .paper { font-family: var(--font-ui); color: #000; font-size: 12pt; padding: 12mm 14mm; }
  .paper-name { border: 1px solid #999; border-radius: 6px; padding: 6px 10px; margin: 8px 0 12px; }
  .paper-qs { padding-inline-start: 20px; } .paper-qs > li { break-inside: avoid; margin-bottom: 12px; }
  .paper-stem { font-weight: 700; margin: 0 0 4px; }

}

/* staff management */
.staff-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.staff-card { max-width: none; margin: 0; }
.staff-card h3 { margin-top: 0; }
.invite-box input { width: 100%; font: inherit; font-size: .9rem; padding: 10px 12px; border-radius: var(--radius-s); border: 1.5px solid var(--line); background: var(--stone); color: var(--ink); }
.invite-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.wa-share { border-color: #25D366; }
.tcls-grid { display: grid; gap: 10px; max-height: 50vh; overflow: auto; }
.tcls-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tcls-g { min-width: 70px; font-weight: 700; color: var(--muted); }
.chip.tc { cursor: pointer; font: inherit; }
.chip.tc[aria-pressed="true"] { background: var(--hira); color: var(--on-hira); border-color: var(--hira); }
@media (max-width: 860px) { .staff-cards { grid-template-columns: 1fr; } }

/* grade page: tests tab */
.tests-tab { display: inline-flex; align-items: center; gap: 6px; }
.tests-tab svg { width: 15px; height: 15px; }
.tp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.tp-term h3 { margin: 0 0 10px; font-size: 1.05rem; }
.tp-card { border: 1.5px solid var(--line); border-radius: var(--radius-l); padding: 14px 16px; margin-bottom: 12px; display: grid; gap: 10px; background: var(--paper); }
.tp-card.post { border-inline-start: 5px solid var(--hira); } .tp-card.diagnostic { border-inline-start: 5px solid var(--dawn); }
.tp-head { display: grid; gap: 2px; } .tp-head .muted { font-size: .85rem; }
.tp-status { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: .92rem; }
.tp-status svg, .tp-lock svg { width: 15px; height: 15px; }
.tp-status.locked { color: var(--muted); } .tp-status.open { color: var(--hira-deep); } .tp-status.done { color: #1B6B3A; }
.tp-card .btn { justify-self: start; }
.tp-classes { display: flex; flex-wrap: wrap; gap: 6px; }
.tp-lock { font: inherit; font-size: .85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--stone); color: var(--muted); cursor: pointer; }
.tp-lock.on { background: var(--hira); border-color: var(--hira); color: var(--on-hira); }
.tp-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.tp-intro p { margin: 0 0 18px; display: flex; gap: 6px; align-items: center; }
.tp-intro svg { width: 16px; height: 16px; flex: none; }
@media (max-width: 860px) { .tp-grid { grid-template-columns: 1fr; } }

/* lesson locking on the grade page */
.ctl-bar { display: grid; gap: 10px; background: var(--dawn-soft); border: 1.5px solid var(--dawn); border-radius: var(--radius-l); padding: 14px 16px; margin-bottom: 22px; }
.ctl-bar svg { width: 14px; height: 14px; vertical-align: -2px; }
.ctl-who { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ctl-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.unit-head .unit-lk { margin-inline-start: auto; }
.unit-lk svg, .lk svg { width: 14px; height: 14px; }
.ctl-row { cursor: default; }
.lk { font: inherit; font-size: .82rem; font-weight: 700; display: inline-flex; gap: 5px; align-items: center; padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--stone); color: var(--muted); cursor: pointer; }

.term-tab svg { width: 13px; height: 13px; vertical-align: -1px; }
.locked-note { display: flex; gap: 8px; align-items: center; } .locked-note svg { width: 16px; height: 16px; flex: none; }

/* ===== competitions ===== */
.comp-head { background: linear-gradient(135deg, var(--hira-soft), var(--dawn-soft)); }
.comp-cats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 26px; }
.comp-cats.small { grid-template-columns: repeat(5, 1fr); margin: 0; }
.comp-cat { font: inherit; display: grid; gap: 4px; justify-items: center; text-align: center; text-decoration: none; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--radius-l); padding: 16px 10px; cursor: pointer; }
.comp-cat .ic { font-size: 1.9rem; } .comp-cat .muted { font-size: .82rem; }
.comp-cat:hover { border-color: var(--hira); } .comp-cat.on { border-color: var(--hira); background: var(--hira-soft); box-shadow: 0 0 0 2px var(--hira) inset; }
.comp-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.comp-card { display: grid; gap: 8px; text-decoration: none; color: var(--ink); border: 1.5px solid var(--line); border-radius: var(--radius-l); padding: 18px; background: var(--paper); transition: transform .15s, box-shadow .15s; }
.comp-card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,.07); border-color: var(--hira); }
.comp-card h3 { margin: 0; font-size: 1.2rem; } .comp-card p { margin: 0; font-size: .9rem; }
.cc-top { display: flex; gap: 8px; align-items: center; } .cc-ic { font-size: 1.4rem; } .cc-cat { font-size: .85rem; color: var(--muted); font-weight: 600; }
.cc-ph { margin-inline-start: auto; font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--stone); color: var(--muted); }
.ph-registration { background: #DDF3E4; color: #1B6B3A; } .ph-submission { background: var(--dawn-soft); color: #7A5600; } .ph-results { background: var(--hira); color: var(--on-hira); }
.cc-dates { color: var(--muted); } .cc-me { justify-self: start; font-weight: 700; font-size: .85rem; color: var(--hira-deep); }
.cp-title { display: flex; gap: 14px; align-items: center; } .cp-ic { font-size: 2.6rem; } .cp-title h1 { margin: 0; } .cp-title p { margin: 4px 0 0; }
.cp-steps { list-style: none; padding: 0; margin: 20px 0 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; counter-reset: st; }
.cp-steps li { counter-increment: st; position: relative; background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--radius-s); padding: 10px 12px 10px 12px; display: grid; gap: 2px; }
.cp-steps li::before { content: counter(st); position: absolute; inset-inline-end: 10px; top: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--stone); color: var(--muted); font-size: .75rem; font-weight: 700; display: grid; place-items: center; }
.cp-steps li small { color: var(--muted); font-size: .78rem; }
.cp-steps li.done::before { background: var(--hira); color: var(--on-hira); content: "✓"; }
.cp-steps li.cur { border-color: var(--dawn); box-shadow: 0 0 0 2px var(--dawn) inset; } .cp-steps li.cur::before { background: var(--dawn); color: #241A05; content: counter(st); }
.comp-layout { align-items: start; }
.cp-intro { font-size: 1.08rem; }
.cp-main h2 { font-size: 1.2rem; margin: 26px 0 10px; }
.crit-bars { display: grid; gap: 8px; max-width: 620px; }
.cb { display: grid; grid-template-columns: 220px 1fr 40px; gap: 10px; align-items: center; }
.cb-bar { height: 10px; border-radius: 999px; background: var(--stone); overflow: hidden; } .cb-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--hira), var(--dawn)); border-radius: 999px; }
.cb.total { border-top: 1px solid var(--line); padding-top: 6px; font-weight: 700; }
.cp-rules { padding-inline-start: 20px; display: grid; gap: 6px; }
.cp-panel { position: sticky; top: 90px; display: grid; gap: 12px; justify-items: start; border: 2px solid var(--dawn); background: var(--dawn-soft); border-radius: var(--radius-l); padding: 20px; }
.cp-panel.approved { border-color: var(--hira); background: var(--hira-soft); }
.cp-panel p { margin: 0; } .cp-levels { flex-wrap: wrap; border-radius: var(--radius-s); }
.cp-result { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; } .cp-award { font-weight: 800; color: #7A5600; background: var(--paper); padding: 4px 12px; border-radius: 999px; }
.comp-stats { display: flex; gap: 18px; margin-bottom: 14px; flex-wrap: wrap; } .comp-stats b { font-size: 1.3rem; color: var(--hira-deep); }
.judge-list { display: grid; gap: 14px; }
.judge-card { border: 1.5px solid var(--line); border-radius: var(--radius-l); padding: 16px; display: grid; gap: 10px; background: var(--paper); }
.judge-card.saved { border-color: #2E9E5B; }
.crit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.crit { display: grid; gap: 4px; font-size: .9rem; } .crit input { font: inherit; padding: 8px 10px; border-radius: var(--radius-s); border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); max-width: 120px; }
.judge-foot { display: flex; justify-content: space-between; align-items: center; } .jtotal b { font-size: 1.2rem; color: var(--hira-deep); }
.winners { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.win-lv { border: 1.5px solid var(--dawn); border-radius: var(--radius-l); padding: 14px; background: var(--dawn-soft); } .win-lv h3 { margin: 0 0 8px; font-size: 1rem; }
.win { display: grid; grid-template-columns: 30px 1fr auto; gap: 6px; align-items: center; padding: 4px 0; } .medal { font-size: 1.3rem; }
.comp-form { display: grid; gap: 18px; max-width: 980px; }
.cf-block { border: 1.5px solid var(--line); border-radius: var(--radius-l); padding: 18px; background: var(--paper); }
.cf-block h3 { margin: 0 0 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.lv-row { display: grid; grid-template-columns: 170px 1fr; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.lv-row .lv-req { grid-column: 1 / -1; } .lv-row [data-ldel] { justify-self: end; grid-column: 2; }
.lv-row input, .cr-row input, .tq input { font: inherit; padding: 8px 12px; border-radius: var(--radius-s); border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); }
.lv-grades { display: flex; flex-wrap: wrap; gap: 4px; } .qs-g.sm { padding: 6px 0; width: 34px; font-size: .85rem; }
.cr-row { display: grid; grid-template-columns: 1fr 90px auto; gap: 8px; margin-bottom: 8px; }
.crit-sum { font-size: .85rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #FDE2E1; color: #9B1C1C; } .crit-sum.ok { background: #DDF3E4; color: #1B6B3A; }
.tq { border: 1px solid var(--line); border-radius: var(--radius-s); padding: 10px; margin-bottom: 10px; display: grid; gap: 8px; }
.tq-h { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.cf-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
@media (max-width: 980px) { .comp-cats { grid-template-columns: repeat(3, 1fr); } .comp-cats.small { grid-template-columns: repeat(3, 1fr); } .cp-steps { grid-template-columns: repeat(2, 1fr); } .cb { grid-template-columns: 140px 1fr 36px; } .cp-panel { position: static; } }
@media print {
  .cert { width: 297mm; height: 210mm; box-sizing: border-box; padding: 10mm; break-after: page; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .cert-in { height: 100%; box-sizing: border-box; border: 6px double #C79100; border-radius: 10px; text-align: center; display: grid; align-content: center; gap: 4mm; font-family: var(--font-ui); color: #142033; background: radial-gradient(circle at top, #FEF8E6, #fff 60%); }

  .cert p { margin: 0; font-size: 13pt; } .cert-date { color: #555; }
  .cert-sign { display: flex; justify-content: space-around; margin-top: 8mm; font-size: 11pt; }
}

.comp-form { margin-inline: auto; }
.user-chip { white-space: nowrap; }
@media (max-width: 1280px) { .user-chip { display: none; } }

.comp-sec { font-size: 1.15rem; margin: 6px 0 12px; }
.cp-final { font-weight: 800; color: var(--hira-deep); display: grid; gap: 2px; } .cp-final small { font-weight: 400; color: var(--muted); }
.fam-row td { background: var(--dawn-soft); }
.lv-row.fam { background: var(--dawn-soft); border-radius: var(--radius-s); padding-inline: 8px; }
.lv-add { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.copy-src { margin-top: 12px; } .copy-src summary { cursor: pointer; color: var(--hira-deep); font-weight: 600; }
.copy-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; } .copy-list .chip { cursor: pointer; font: inherit; }
.cf-en summary { cursor: pointer; list-style: none; } .cf-en summary::-webkit-details-marker { display: none; }
.cf-en input, .cf-en textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 8px 12px; border-radius: var(--radius-s); border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); }
.en-lv { display: grid; grid-template-columns: 180px 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
[data-eci].en-lv { grid-template-columns: 180px 1fr; }
tr.is-finalist td { background: var(--hira-soft); }
@media (max-width: 760px) { .en-lv { grid-template-columns: 1fr; } }

/* independent learners */
.signup-cta { display: grid; gap: 4px; justify-items: start; margin-top: 18px; padding: 14px 16px; border-radius: var(--radius-l); background: var(--dawn-soft); border: 1.5px solid var(--dawn); }
.wide-card { max-width: 720px; }
.role-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
.role-card { display: grid; gap: 6px; justify-items: center; text-align: center; text-decoration: none; color: var(--ink); border: 2px solid var(--line); border-radius: var(--radius-l); padding: 22px 16px; background: var(--paper); }
.role-card:hover { border-color: var(--hira); background: var(--hira-soft); } .role-card .ic { font-size: 2.4rem; } .role-card strong { font-size: 1.15rem; }
.indep-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 16px; }
.indep-card { display: grid; gap: 6px; text-decoration: none; color: var(--ink); border: 1.5px solid var(--line); border-radius: var(--radius-l); padding: 18px; background: var(--paper); }
.indep-card:hover { border-color: var(--hira); } .indep-card .ic { font-size: 1.8rem; }
.mini-bar { height: 8px; border-radius: 999px; background: var(--stone); overflow: hidden; } .mini-bar i { display: block; height: 100%; background: var(--hira); }
.add-child .qs-body { display: grid; gap: 8px; margin-top: 12px; }
.linklike { font: inherit; background: none; border: 0; padding: 0; color: var(--hira-deep); text-decoration: underline; cursor: pointer; }
@media (max-width: 640px) { .role-cards { grid-template-columns: 1fr; } }

      { title: "الحلقة الأولى", sub: "Grade 1 – Grade 4", years: [1, 2, 3, 4] },
      { title: "الحلقة الثانية", sub: "Grade 5 – Grade 8", years: [5, 6, 7, 8] },
      { title: "الحلقة الثالثة", sub: "Grade 9 – Grade 12", years: [9, 10, 11, 12] }
    ];
  }
  async function readyYears(subject) {
    const { data, error } = await sb.from("units").select("year_group, track").eq("subject_id", SUBJECTS[subject].id);
    if (error) toast("تعذّر تحميل الصفوف: " + error.message);
    const map = {};
    (data || []).forEach((u) => { (map[u.year_group] = map[u.year_group] || new Set()).add(u.track); });
    return map;
  }
  function gradeLadder(ready, subject) {
    const only = isStudent() && state.myGrades && state.myGrades.length ? new Set(state.myGrades) : null;
    return stageGroups().filter((s) => !only || s.years.some((y) => only.has(y))).map((s) => `
      <div class="stage">
        <div class="stage-title"><h3>${s.title}</h3><span dir="ltr">${s.sub}</span></div>
        <div class="grade-row">
          ${s.years.filter((y) => !only || only.has(y)).map((y) => {
            const tr = ready[y];
            const ok = !!tr;
            const g = `الصف ${ORD_GRADE[y] || y}`;
            const status = ok ? "المحتوى متاح" : "قيد الإعداد";
            return `<a class="grade-tile ${ok ? "ready" : "soon"}" href="#/year/${y}?subject=${subject}">
              <span class="y" dir="ltr">Grade ${y}</span>
              <span class="g">${g}</span>
              <span class="status">${status}</span></a>`;
          }).join("")}
        </div>
      </div>`).join("");
  }

  async function pageYear(year, params) {
    setNav("grades");
    if (isStudent() && state.myGrades && state.myGrades.length && !state.myGrades.includes(Number(year))) {
      const g = state.myGrades[0];
      h(`<div class="wrap"><div class="form-card empty"><strong>${LANG === "en" ? "This content is for another grade" : "هذا المحتوى لصفٍّ آخر"}</strong>
        ${LANG === "en" ? "You can open the lessons of your own grade." : "تستطيع فتح دروس صفّك."}
        <a class="btn btn-primary" style="margin-top:12px" href="#/year/${g}?track=${state.myTrack || "native"}">${LANG === "en" ? "Go to my grade" : "اذهب إلى دروس صفّي"} · Grade ${g}</a></div></div>`);
      return;
    }
    const track = params.get("track") === "non_native" ? "non_native" : params.get("track") === "native" ? "native" : (isStudent() && state.myTrack) || "native";
    const testsView = params.get("term") === "tests";
    const term = ["1", "2", "3"].includes(params.get("term")) ? Number(params.get("term")) : 1;
    const subject = subjOf(params);
    const sid = SUBJECTS[subject].id;
    const domain = Number(params.get("domain")) || 0;
    loading();

    const [unitsRes, outRes, axesRes, domRes] = await Promise.all([
      sb.from("units")
        .select("id, term, sort_order, title_ar, title_en, lessons(id, code, sort_order, title_ar, title_en, axis_code, book_pages, lesson_resources(kind))")
        .eq("year_group", year).eq("track", track).eq("subject_id", sid).order("term").order("sort_order"),
      sb.from("learning_outcomes").select("code, statement_ar, sort_order, fw_standards(axis_code)").eq("year_group", year).eq("subject_id", sid).order("sort_order"),
      state.axes.length ? Promise.resolve({ data: state.axes }) : sb.from("fw_axes").select("code, name_ar, domain_id"),
      state.domains ? Promise.resolve({ data: state.domains }) : sb.from("fw_domains").select("id, name_ar, subject_id").order("id")
    ]);
    state.domains = domRes.data || [];
    if (unitsRes.error) { h(`<div class="wrap loading">تعذّر تحميل المنهج: ${esc(unitsRes.error.message)}</div>`); return; }
    state.axes = axesRes.data || [];
    const axisName = (c) => (state.axes.find((a) => a.code === c) || {}).name_ar || "";

    const units = unitsRes.data || [];
    const locks = await studentLocks();
    // teacher control: classes of this grade/track/subject and their unlocks
    let ctlClasses = [], ctl = null, ctlOpen = new Set(), ctlSched = {};
    if (isStaff()) {
      const me = state.session.user.id;
      const { data: allc } = await sb.from("classes").select("id, name, lock_lessons, class_teachers(teacher_id)")
        .eq("year_group", year).eq("track", track).eq("subject_id", sid).order("name");
      ctlClasses = state.profile.role === "teacher" ? (allc || []).filter((c) => (c.class_teachers || []).some((x) => x.teacher_id === me)) : (allc || []);
      ctl = ctlClasses.find((c) => c.id === params.get("ctl")) || ctlClasses[0] || null;
      if (ctl) {
        const { data: un } = await sb.from("class_lesson_unlocks").select("lesson_id, unlock_at").eq("class_id", ctl.id);
        (un || []).forEach((x) => { if (new Date(x.unlock_at).getTime() <= Date.now()) ctlOpen.add(x.lesson_id); else ctlSched[x.lesson_id] = x.unlock_at; });
      }
    }
    const lessonOpenFor = (l) => ctl ? (!ctl.lock_lessons || ctlOpen.has(l.id)) : !isLocked(locks, l.id, year, sid);
    const termOpen = { 1: 0, 2: 0, 3: 0 };
    units.forEach((u) => (u.lessons || []).forEach((l) => { if (lessonOpenFor(l)) termOpen[u.term]++; }));
    const termUnits = units.filter((u) => u.term === term);
    const counts = { 1: 0, 2: 0, 3: 0 };
    units.forEach((u) => { counts[u.term] += (u.lessons || []).length; });
    const nn = track === "non_native" || LANG === "en";
    const href = (t, tr, d) => `#/year/${year}?subject=${subject}&track=${tr}&term=${t}${(d === undefined ? domain : d) ? "&domain=" + (d === undefined ? domain : d) : ""}${ctl && tr === track ? "&ctl=" + ctl.id : ""}`;
    const domainOf = (c) => (state.axes.find((a) => a.code === c) || {}).domain_id;
    const termLessons = termUnits.flatMap((u) => u.lessons || []);
    const dCounts = {};
    termLessons.forEach((l) => { const d = domainOf(l.axis_code); if (d) dCounts[d] = (dCounts[d] || 0) + 1; });
    const subjDomains = state.domains.filter((d) => d.subject_id === sid && dCounts[d.id]);
    const chipsHtml = subjDomains.length ? `<nav class="chips" aria-label="تصفية حسب المجال">
      <span class="chips-label">المجال:</span>
      <a class="chip" href="${href(term, track, 0)}" aria-current="${!domain}">الكل <span>${termLessons.length}</span></a>
      ${subjDomains.map((d) => `<a class="chip d${d.id}" href="${href(term, track, d.id)}" aria-current="${domain === d.id}">${esc(d.name_ar)} <span>${dCounts[d.id]}</span></a>`).join("")}
    </nav>` : "";

    let unitNo = units.filter((u) => u.term < term).length;
    const unitsHtml = termUnits.length ? termUnits.map((u) => {
      unitNo += 1;
      const allLessons = (u.lessons || []).sort((a, b) => a.sort_order - b.sort_order);
      const lessons = domain ? allLessons.filter((l) => domainOf(l.axis_code) === domain) : allLessons;
      if (!lessons.length) return "";
      const uOpen = allLessons.filter((l) => lessonOpenFor(l)).length;
      return `<div class="unit">
        <div class="unit-head"><span class="n">${unitNo}</span><h2>${esc(nn && u.title_en ? u.title_en : u.title_ar)}</h2>
          <span class="en">${esc(nn ? u.title_ar : (u.title_en || ""))}</span>
          ${ctl && ctl.lock_lessons ? `<button class="btn btn-ghost btn-small unit-lk" data-unit="${u.id}" data-allopen="${uOpen === allLessons.length}">${uOpen === allLessons.length ? lockIcon + " قفل الوحدة" : unlockIcon + " فتح الوحدة"}</button>` : ""}</div>
        ${ctl && ctl.lock_lessons ? lessons.map((l) => {
          const on = ctlOpen.has(l.id), when = ctlSched[l.id];
          return `<div class="lesson-row ctl-row ${on ? "" : "locked"}">
            <span class="idx">${allLessons.indexOf(l) + 1}</span>
            <span><a class="t" href="#/lesson/${esc(l.code)}" ${nn ? 'dir="ltr" style="text-align:right"' : ""}>${esc(nn && l.title_en ? l.title_en : l.title_ar)}</a>
              ${when ? `<span class="pill warn sched-pill">يُفتح ${new Date(when).toLocaleDateString("ar-AE", { weekday: "long", day: "numeric", month: "long" })}</span>` : ""}</span>
            <span class="meta"><span class="pill axis d${domainOf(l.axis_code) || 0}">${esc(axisName(l.axis_code))}</span>
              <button class="lk ${on ? "on" : ""}" data-lk="${l.id}" data-on="${on}" aria-label="${on ? "قفل الدرس" : "فتح الدرس"}">${on ? unlockIcon + " مفتوح" : lockIcon + " مقفل"}</button></span>
          </div>`; }).join("") : lessons.map((l, i) => {
          const kinds = new Set((l.lesson_resources || []).map((r) => r.kind));
          const dot = (k) => `<span class="res-dot ${kinds.has(k) ? "on" : ""}" title="${KIND[k]}"></span>`;
          const locked = isLocked(locks, l.id, year, sid);
          return `<a class="lesson-row ${locked ? "locked" : ""}" href="#/lesson/${esc(l.code)}" ${locked ? 'title="مقفل: يفتحه معلمك"' : ""}>
            <span class="idx">${allLessons.indexOf(l) + 1}</span>
            <span><span class="t" ${nn ? 'dir="ltr" style="text-align:right"' : ""}>${esc(nn && l.title_en ? l.title_en : l.title_ar)}</span>
              ${nn ? `<span class="muted" style="font-size:.85rem">${esc(l.title_ar)}</span>` : ""}</span>
            <span class="meta"><span class="pill axis d${domainOf(l.axis_code) || 0}">${esc(axisName(l.axis_code))}</span>
              ${locked ? `<span class="pill lock-pill">${lockIcon} مقفل</span>` : `<span class="res-dots" aria-label="المواد المتاحة">${dot("slides")}${dot("worksheet")}${dot("video")}</span>`}</span>
          </a>`;
        }).join("")}
      </div>`;
    }).join("") : `<div class="empty"><strong>لم يُضف منهج ${SUBJECTS[subject].name} لـ${TERMS[term]} في هذا المسار بعد</strong>سيظهر هنا فور إدخاله.</div>`;

    const termAll = termLessons.length, termOpenN = termOpen[term];
    const ctlBar = !isStaff() ? "" : !ctlClasses.length ? `<div class="ctl-bar"><span class="muted">${lockIcon} لا فصول لك في هذا الصف والمسار، فتعرض الصفحة كل الدروس. أنشئ فصلًا أو اطلب إسنادك إليه لتتحكم في فتح الدروس.</span></div>`
      : `<div class="ctl-bar">
        <div class="ctl-who"><span class="muted">التحكم لفصل:</span> ${ctlClasses.map((c) => `<a class="chip" href="#/year/${year}?subject=${subject}&track=${track}&term=${term}&ctl=${c.id}" aria-current="${ctl && c.id === ctl.id}">${esc(c.name)}</a>`).join("")}</div>
        ${ctl.lock_lessons ? `<div class="ctl-state"><strong>${termOpenN} من ${termAll}</strong> <span class="muted">درسًا مفتوحًا لطلاب ${esc(ctl.name)} في ${TERMS[term]}</span></div>
          <div class="ctl-actions"><button class="btn btn-primary btn-small" id="ctlOpenTerm">${unlockIcon} فتح كل دروس ${TERMS[term]}</button>
            <button class="btn btn-ghost btn-small" id="ctlLockTerm">${lockIcon} قفل الكل</button></div>`
          : `<div class="ctl-state"><strong>القفل متوقف لهذا الفصل:</strong> <span class="muted">كل الدروس مفتوحة لطلاب ${esc(ctl.name)}.</span> <button class="btn btn-dawn btn-small" id="ctlEnable">${lockIcon} تفعيل القفل</button></div>`}
      </div>`;
    const unitsBlock = unitsHtml.trim() ? unitsHtml : `<div class="empty"><strong>لا توجد دروس في هذا المجال في ${TERMS[term]}</strong><a href="${href(term, track, 0)}">عرض كل الدروس</a></div>`;
    const outcomes = outRes.data || [];
    const byAxis = {};
    outcomes.forEach((o) => { const a = o.fw_standards ? o.fw_standards.axis_code : "-"; (byAxis[a] = byAxis[a] || []).push(o); });
    const outcomesHtml = outcomes.length ? Object.keys(byAxis).map((a) => `
      <div class="outcome-group"><h4>${esc(axisName(a))}</h4>
      ${byAxis[a].map((o) => `<p class="outcome">${esc(o.statement_ar)} <code>${esc(o.code)}</code></p>`).join("")}</div>`).join("")
      : '<p class="muted">لم تُدخل نواتج هذا الصف بعد.</p>';

    h(`
    <section class="page-head"><div class="wrap">
      <div class="crumbs"><a href="#/">الرئيسية</a> / <a href="#/grades?subject=${subject}">${SUBJECTS[subject].name}</a></div>
      <h1><span dir="ltr">Grade ${year}</span> · ${SUBJECTS[subject].name}</h1>
      <p class="muted">الصف ${ORD_GRADE[year] || year}${outcomes.length ? ` · ${outcomes.length} ناتج تعلم من الإطار الوطني` : ""}</p>
      <div class="controls">
        <div class="seg" role="group" aria-label="المسار">
          <a href="${testsView ? `#/year/${year}?subject=${subject}&track=native&term=tests` : href(term, "native")}" aria-current="${track === "native"}">${TRACKS.native}</a>
          <a href="${testsView ? `#/year/${year}?subject=${subject}&track=non_native&term=tests` : href(term, "non_native")}" aria-current="${track === "non_native"}">${TRACKS.non_native}</a>
        </div>
        <div class="term-tabs" role="tablist">
          ${[1, 2, 3].map((t) => `<a class="term-tab" role="tab" href="${href(t, track, 0)}" aria-selected="${!testsView && t === term}" style="text-decoration:none">${(isStudent() || ctl) && counts[t] && !termOpen[t] ? lockIcon + " " : ""}${TERMS[t]} <span class="muted">(${counts[t]})</span></a>`).join("")}
          <a class="term-tab tests-tab" role="tab" href="#/year/${year}?subject=${subject}&track=${track}&term=tests" aria-selected="${testsView}" style="text-decoration:none">${lockIcon} ${LANG === "en" ? "Tests" : "الاختبارات"}</a>
        </div>
      </div>
    </div></section>
    ${testsView ? `<section class="section" style="padding-top:36px"><div class="wrap" id="testsPane"><div class="loading">جارٍ التحميل…</div></div></section>`
      : `<section class="section" style="padding-top:44px"><div class="wrap layout-2">
      <div>${ctlBar}${isStudent() && termAll && !termOpenN ? `<div class="notice locked-note">${lockIcon} ${LANG === "en" ? "Lessons of this term open one by one when your teacher starts them." : "دروس هذا الفصل الدراسي تُفتح تباعًا حين يبدؤها معلمك."}</div>` : ""}${chipsHtml}${unitsBlock}</div>
      <aside class="side-card"><h3>نواتج التعلم للصف</h3>${outcomesHtml}</aside>
    </div></section>`}`);
    if (testsView) renderTestsPane(Number(year), sid, track);
    if (!ctl) return;
    const meId = state.session.user.id, again = () => pageYear(year, params);
    const openIds = async (ids) => { if (!ids.length) return true; const r = await sb.from("class_lesson_unlocks").upsert(ids.map((id) => ({ class_id: ctl.id, lesson_id: id, unlocked_by: meId, unlock_at: new Date().toISOString() })), { onConflict: "class_id,lesson_id" }); if (r.error) { toast("تعذّر الحفظ: " + r.error.message); return false; } return true; };
    const lockIds = async (ids) => { if (!ids.length) return true; const r = await sb.from("class_lesson_unlocks").delete().eq("class_id", ctl.id).in("lesson_id", ids); if (r.error) { toast("تعذّر الحفظ: " + r.error.message); return false; } return true; };
    main.querySelectorAll("[data-lk]").forEach((b) => b.addEventListener("click", async () => {
      b.disabled = true; const on = b.dataset.on === "true";
      if (await (on ? lockIds([b.dataset.lk]) : openIds([b.dataset.lk]))) { toast(on ? "قُفل الدرس" : "فُتح الدرس لطلاب " + ctl.name); again(); } else b.disabled = false;
    }));
    main.querySelectorAll("[data-unit]").forEach((b) => b.addEventListener("click", async () => {
      const u = units.find((x) => x.id === b.dataset.unit); const ids = (u.lessons || []).map((l) => l.id);
      b.disabled = true; const allOpen = b.dataset.allopen === "true";
      if (await (allOpen ? lockIds(ids) : openIds(ids))) { toast(allOpen ? "قُفلت الوحدة" : "فُتحت الوحدة لطلاب " + ctl.name); again(); } else b.disabled = false;
    }));
    const ot = document.getElementById("ctlOpenTerm"); if (ot) ot.onclick = async () => { ot.disabled = true; if (await openIds(termLessons.map((l) => l.id))) { toast("فُتحت كل دروس " + TERMS[term]); again(); } };
    const lt = document.getElementById("ctlLockTerm"); if (lt) lt.onclick = async () => { if (!confirm("قفل كل دروس " + TERMS[term] + " لطلاب " + ctl.name + "؟")) return; lt.disabled = true; if (await lockIds(termLessons.map((l) => l.id))) { toast("قُفلت الدروس"); again(); } };
    const en = document.getElementById("ctlEnable"); if (en) en.onclick = async () => { const r = await sb.from("classes").update({ lock_lessons: true }).eq("id", ctl.id); if (r.error) toast("تعذّر: " + r.error.message); else { toast("فُعّل القفل"); again(); } };
  }

  /* ---------- grade page: tests tab ---------- */
  async function renderTestsPane(year, sid, track) {
    const pane = document.getElementById("testsPane"); if (!pane) return;
    const en = LANG === "en" || track === "non_native";
    const T = (ar, e) => (LANG === "en" ? e : ar);
    const { data: tests } = await sb.from("assessments").select("id, kind, term, title_ar, title_en, track")
      .eq("year_group", year).eq("subject_id", sid).eq("track", track).in("kind", ["diagnostic", "post"]).eq("is_published", true).order("term");
    const list = tests || [];
    if (!list.length) { pane.innerHTML = `<div class="empty"><strong>${T("لا توجد اختبارات لهذا الصف والمسار بعد", "No tests for this grade yet")}</strong></div>`; return; }
    const byTerm = { 1: [], 2: [], 3: [] }; list.forEach((t) => byTerm[t.term] && byTerm[t.term].push(t));
    const KIND = (k) => k === "post" ? T("الاختبار البعدي", "Post-test") : T("الاختبار التشخيصي", "Diagnostic test");
    const WHEN = (k) => k === "post" ? T("في نهاية الفصل الدراسي", "At the end of the term") : T("في بداية الفصل الدراسي", "At the start of the term");
    let rowFor;
    if (!state.session) {
      rowFor = (t) => `<div class="tp-status locked">${lockIcon} ${T("للطلاب المسجلين", "For signed-in students")}</div>`;
    } else if (isStudent()) {
      const me = state.session.user.id;
      const [{ data: cs }, { data: att }] = await Promise.all([
        sb.from("class_students").select("class_id, classes(year_group, track, subject_id, class_assessments(assessment_id))").eq("student_id", me),
        sb.from("attempts").select("assessment_id, score, max_score, submitted_at").eq("student_id", me).not("submitted_at", "is", null)
      ]);
      const open = new Set(); (cs || []).forEach((r) => ((r.classes && r.classes.class_assessments) || []).forEach((x) => open.add(x.assessment_id)));
      const done = {}; (att || []).forEach((a) => { done[a.assessment_id] = a; });
      rowFor = (t) => done[t.id]
        ? `<div class="tp-status done">✓ ${T("أنجزته", "Done")} · <b>${done[t.id].score}/${done[t.id].max_score}</b></div><a class="btn btn-ghost btn-small" href="#/result/${t.id}">${T("خريطة إتقاني", "My mastery map")}</a>`
        : open.has(t.id) ? `<div class="tp-status open">${unlockIcon} ${T("متاح الآن", "Open now")}</div><a class="btn btn-dawn btn-small" href="#/test/${t.id}">${T("ابدأ الاختبار", "Start the test")}</a>`
        : `<div class="tp-status locked">${lockIcon} ${T("مقفل · يفتحه معلمك عندما يحين وقته", "Locked · your teacher will open it")}</div>`;
    } else {
      // staff: classes of this grade/track/subject they can manage
      const me = state.session.user.id;
      const { data: all } = await sb.from("classes").select("id, name, school_id, class_teachers(teacher_id), class_assessments(assessment_id)")
        .eq("year_group", year).eq("track", track).eq("subject_id", sid).order("name");
      const mine = state.profile.role === "teacher" ? (all || []).filter((c) => (c.class_teachers || []).some((x) => x.teacher_id === me)) : (all || []);
      rowFor = (t) => `<div class="tp-classes">${mine.length ? mine.map((c) => { const on = (c.class_assessments || []).some((x) => x.assessment_id === t.id);
          return `<button class="tp-lock ${on ? "on" : ""}" data-cl="${c.id}" data-t="${t.id}" data-on="${on}" title="${on ? "اضغط للقفل" : "اضغط للفتح"}">${on ? unlockIcon : lockIcon} ${esc(c.name)}</button>`; }).join("")
          : `<span class="muted">${T("لا فصول لك في هذا الصف والمسار", "You have no classes in this grade")}</span>`}</div>
        <div class="tp-actions"><a class="btn btn-ghost btn-small" href="#/preview/${t.id}${mine[0] ? "?class=" + mine[0].id : ""}">${T("معاينة", "Preview")}</a>
          ${mine[0] ? `<a class="btn btn-ghost btn-small" href="#/results?class=${mine[0].id}&test=${t.id}">${T("النتائج", "Results")}</a>` : ""}</div>`;
    }
    pane.innerHTML = `
      <div class="tp-intro">${isStaff() ? `<p class="muted">${lockIcon} كل اختبار مقفل افتراضيًا. اضغط على اسم الفصل لفتح الاختبار لطلابه، واضغط مرة أخرى لقفله. لا يراه الطلاب إلا بعد فتحه.</p>`
        : isStudent() ? `<p class="muted">${T("تفتح الاختبارات بأمر معلمك. الاختبار التشخيصي في بداية الفصل الدراسي، والبعدي في نهايته.", "Your teacher opens each test when it is time.")}</p>` : ""}</div>
      <div class="tp-grid">${[1, 2, 3].map((tm) => `<div class="tp-term"><h3>${TERMS[tm]}</h3>
        ${byTerm[tm].map((t) => `<div class="tp-card ${t.kind}"><div class="tp-head"><strong>${KIND(t.kind)}</strong><span class="muted">${WHEN(t.kind)}</span></div>${rowFor(t)}</div>`).join("") || '<p class="muted">—</p>'}
      </div>`).join("")}</div>`;
    pane.querySelectorAll(".tp-lock").forEach((b) => b.addEventListener("click", async () => {
      b.disabled = true;
      const on = b.dataset.on === "true";
      const r = on ? await sb.from("class_assessments").delete().eq("class_id", b.dataset.cl).eq("assessment_id", b.dataset.t)
                   : await sb.from("class_assessments").insert({ class_id: b.dataset.cl, assessment_id: b.dataset.t, opened_by: state.session.user.id });
      if (r.error) { toast("تعذّر الحفظ: " + r.error.message); b.disabled = false; return; }
      toast(on ? "قُفل الاختبار" : "فُتح الاختبار للطلاب");
      renderTestsPane(year, sid, track);
    }));
  }

  async function pageLesson(code) {
    setNav("grades");
    loading();
    const { data: l, error } = await sb.from("lessons")
      .select(`id, code, title_ar, title_en, axis_code, book_pages, overview_ar,
        units(term, title_ar, title_en, year_group, track, subject_id),
        lesson_resources(id, kind, part, title_ar, url, storage_path, sort_order, audience),
        evidences(kind, text_ar, translation_en, surah_no, ayah_from, ayah_to, source, hadith_grade, is_verified, sort_order),
        lesson_identity_links(connection_ar, connection_en, identity_tags(name_ar, pillar)),
        lesson_outcomes(learning_outcomes(id, code, statement_ar, sort_order)),
        success_criteria(part, statement_ar, statement_en, sort_order)`)
      .eq("code", code).maybeSingle();
    if (error || !l) { h(`<div class="wrap loading">لم يُعثر على هذا الدرس.</div>`); return; }
    if (!state.axes.length) { const r = await sb.from("fw_axes").select("code, name_ar, domain_id"); state.axes = r.data || []; }
    const axisName = (state.axes.find((a) => a.code === l.axis_code) || {}).name_ar || "";
    const u = l.units || {};
    const nn = u.track === "non_native";
    const subject = SUBJECT_BY_ID[u.subject_id] || "islamic";
    const res = (l.lesson_resources || []).sort((a, b) => (a.part || 0) - (b.part || 0) || a.sort_order - b.sort_order);
    const lockedForMe = isLocked(await studentLocks(), l.id, u.year_group, u.subject_id);
    if (isStudent() && !lockedForMe) sb.rpc("record_lesson_view", { p_lesson: l.id }).then(() => {});
    const lockedMsg = `<div class="empty locked-box">${lockIcon}<strong>هذا الدرس مقفل حاليًا</strong>سيفتحه معلمك عندما يحين موعده.</div>`;

    const resItems = (items) => `<div class="res-list">${items.map((r) => {
        const ic = r.kind === "slides" ? icon.slides : r.kind === "video" ? icon.video : r.kind === "link" ? icon.link : icon.doc;
        const stored = !r.url && r.storage_path;
        const emb = r.kind === "slides" && !stored ? slideEmbed(r.url) : null;
        const canPresent = stored && ["pdf", "ppt", "pptx"].includes(extOf(r.storage_path));
        return `<div class="res-row"><a class="res-item" href="${stored ? "#" : esc(r.url)}" ${stored ? `data-file="${esc(r.storage_path)}"` : 'target="_blank" rel="noopener"'}>${ic}
          <span><strong>${esc(r.title_ar)}</strong><span class="kind">${KIND[r.kind]}${r.part ? ` · الجزء ${r.part}` : ""}</span></span></a>
          ${emb ? `<button class="btn btn-dawn btn-small present-btn" data-present="${esc(emb)}" data-title="${esc(r.title_ar)}">عرض في الصف</button>` : ""}
          ${canPresent ? `<button class="btn btn-dawn btn-small present-btn" data-file="${esc(r.storage_path)}" data-mode="present" data-present="" data-title="${esc(r.title_ar)}">عرض في الصف</button>` : ""}</div>`;
      }).join("")}</div>`;
    const resList = (kinds, emptyMsg, tLabel, sLabel) => {
      if (lockedForMe) return lockedMsg;
      const items = res.filter((r) => kinds.includes(r.kind));
      if (!items.length) return `<div class="empty"><strong>${emptyMsg}</strong>${state.session ? "" : "بعض المواد تظهر بعد تسجيل الدخول."}</div>`;
      const forT = items.filter((r) => r.audience === "teacher"), forS = items.filter((r) => r.audience !== "teacher");
      if (!forT.length) return resItems(forS);
      return `<h3 class="res-group">${tLabel} <span class="pill warn">لا تظهر للطلاب</span></h3>${resItems(forT)}
        <h3 class="res-group">${sLabel}</h3>${forS.length ? resItems(forS) : '<p class="muted">لم تُضف مواد للطالب بعد.</p>'}`;
    };
    const videos = res.filter((r) => r.kind === "video");
    const videoHtml = lockedForMe ? lockedMsg : videos.length ? videos.map((v) => {
      const e = youtubeEmbed(v.url);
      return `<h3>${esc(v.title_ar)}</h3>` + (e
        ? `<iframe class="video-frame" src="${e}" title="${esc(v.title_ar)}" allowfullscreen loading="lazy"></iframe>`
        : `<a class="res-item" href="${esc(v.url)}" target="_blank" rel="noopener">${icon.video}<strong>شاهد الفيديو</strong></a>`);
    }).join('<div style="height:24px"></div>') : `<div class="empty"><strong>لم يُضف فيديو لهذا الدرس بعد</strong></div>`;

    const ev = (l.evidences || []).sort((a, b) => a.sort_order - b.sort_order);
    const evHtml = ev.length ? ev.map((e) => e.kind === "quran"
      ? `<div class="evidence"><p class="quran-ref">${esc(e.text_ar)}</p>
          <div class="src"><span>الآيات ${e.ayah_from}–${e.ayah_to}</span>${e.is_verified ? '<span class="pill axis">موثّق</span>' : ""}
          <a href="https://quran.com/${e.surah_no}" target="_blank" rel="noopener">اقرأ السورة واستمع إليها</a></div></div>`
      : `<div class="evidence"><p class="txt">${esc(e.text_ar)}</p>
          ${e.translation_en ? `<p dir="ltr" class="muted">${esc(e.translation_en)}</p>` : ""}
          <div class="src"><span>${esc(e.source || "")}</span>${e.hadith_grade ? `<span>· ${esc(e.hadith_grade)}</span>` : ""}

        <p>${esc(x.connection_ar)}</p>${nn && x.connection_en ? `<p class="en">${esc(x.connection_en)}</p>` : ""}</div>`).join("")
      : `<div class="empty"><strong>لم يُضف ربط بالهوية الوطنية لهذا الدرس بعد</strong></div>`;

    const outs = (l.lesson_outcomes || []).map((x) => x.learning_outcomes).filter(Boolean).sort((a, b) => a.sort_order - b.sort_order);
    const sc = (l.success_criteria || []).sort((a, b) => (a.part || 0) - (b.part || 0) || a.sort_order - b.sort_order);
    const outHtml = `
      <h3>نواتج التعلم من الإطار الوطني</h3>

      <h3 style="margin-top:28px">معايير النجاح</h3>
      ${sc.length ? `<ol>${sc.map((s) => `<li>${esc(s.statement_ar)}${s.statement_en ? `<br><span dir="ltr" class="muted">${esc(s.statement_en)}</span>` : ""}</li>`).join("")}</ol>`
        : '<div class="empty"><strong>لم تُكتب معايير النجاح بعد</strong>تُضاف مع شرائح الدرس.</div>'}`;

    // exit ticket
    const { data: tk } = await sb.from("assessments").select("id, title_ar, title_en, assessment_questions(question_id)").eq("kind", "lesson_quiz").eq("lesson_id", l.id).limit(1);
    const ticket = (tk || [])[0];
    let myTicket = null;
    if (ticket && isStudent()) {
      const { data: ma } = await sb.from("attempts").select("score, max_score, submitted_at").eq("assessment_id", ticket.id).eq("student_id", state.session.user.id).not("submitted_at", "is", null).order("submitted_at", { ascending: false }).limit(1);
      myTicket = (ma || [])[0] || null;

    const quizHtml = lockedForMe ? lockedMsg : !state.session
      ? `<div class="empty"><strong>تذكرة الخروج للطلاب المسجلين</strong><a class="btn btn-primary" style="margin-top:12px" href="#/login">تسجيل الدخول</a></div>`
      : isStaff() ? `<div class="ticket-box"><h3>تذكرة الخروج</h3>
          <p class="muted">${ticket && nq ? `فيها ${nq} ${nq === 1 ? "سؤال" : "أسئلة"}. يجيب عنها الطالب في آخر الحصة، وتُحدَّث خريطة إتقانه تلقائيًا.` : "لم تُعدّ تذكرة خروج لهذا الدرس بعد."}${nq && nq < 3 ? " يُفضّل أن تكون 3 أسئلة." : ""}</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" id="editTicket">${ticket && nq ? "تحرير التذكرة" : "إنشاء تذكرة خروج"}</button>
          ${ticket && nq ? `<a class="btn btn-ghost" href="#/preview/${ticket.id}">معاينة مع الإجابات</a>` : ""}</div></div>`
      : ticket && nq ? `<div class="ticket-box"><h3>${nn ? "Exit ticket" : "تذكرة الخروج"}</h3>
          <p class="muted">${nn ? `${nq} quick question(s) to check what you learned today.` : `${nq} ${nq === 1 ? "سؤال سريع" : "أسئلة سريعة"} لتعرف ماذا تعلمت اليوم.`}</p>
          ${myTicket ? `<p>${nn ? "Last result" : "نتيجتك الأخيرة"}: <b>${myTicket.score}/${myTicket.max_score}</b></p>` : ""}
          <a class="btn btn-dawn" href="#/test/${ticket.id}">${myTicket ? (nn ? "Try again" : "أعد المحاولة") : (nn ? "Start" : "ابدأ")}</a>
          ${myTicket ? `<a class="btn btn-ghost" href="#/result/${ticket.id}">${nn ? "My mastery map" : "خريطة إتقاني"}</a>` : ""}</div>`
      : `<div class="empty"><strong>${nn ? "No exit ticket for this lesson yet" : "لا توجد تذكرة خروج لهذا الدرس بعد"}</strong></div>`;

      ? `<div class="empty"><strong>التسميع للطلاب المسجلين</strong><a class="btn btn-primary" style="margin-top:12px" href="#/login">تسجيل الدخول</a></div>`
      : isStudent() ? (lockedForMe ? lockedMsg : `<div class="rec-box">
          <h3>${nn ? "Record your recitation" : "سجّل تسميعك"}</h3>
          <p class="muted">${nn ? "Recite the surah or hadith of this lesson and send it to your teacher. You can listen before sending." : "سمّع السورة أو الحديث المقرر في هذا الدرس، واستمع لتسجيلك قبل إرساله لمعلمك."}</p>
          <div class="rec-ctrl"><button class="rec-btn" id="recBtn" aria-label="${nn ? "Start recording" : "ابدأ التسجيل"}"><span></span></button>
            <span class="rec-time" id="recTime">0:00</span></div>
          <audio id="recPlay" controls hidden></audio>
          <div class="rec-actions" id="recActions" hidden><button class="btn btn-primary" id="recSend">${nn ? "Send to my teacher" : "أرسل لمعلمي"}</button>
            <button class="btn btn-ghost" id="recAgain">${nn ? "Record again" : "سجّل من جديد"}</button></div>
          <div id="recList"></div></div>`)
      : `<div class="empty"><strong>تسميعات الطلاب</strong>تصل تسميعات طلاب فصولك إلى صفحة «التسميع» في لوحة الفصل.<a class="btn btn-ghost" style="margin-top:12px" href="#/recitations">صفحة التسميع</a></div>`;

    const TABS = [
      ["slides", "الشرائح", resList(["slides"], "لم تُضف شرائح هذا الدرس بعد", "شرائح المعلم", "شرائح الطالب")],
      ["work", "أوراق العمل", resList(["worksheet", "group_pack", "file", "interactive", "link"], "لم تُضف أوراق عمل لهذا الدرس بعد", "مواد المعلم", "مواد الطالب")],
      ["video", "الفيديو", videoHtml],
      ...(subject === "islamic" || ev.length ? [["evidence", subject === "islamic" ? "الأدلة من القرآن والسنة" : "الشواهد", evHtml]] : []),
      ["identity", "الهوية الوطنية", idHtml],
      ["outcomes", "نواتج التعلم", outHtml],
      ["quiz", "تذكرة الخروج", quizHtml],
      ["recite", "التسميع", recHtml]
    ];

    h(`
    <section class="page-head"><div class="wrap">
      <div class="crumbs"><a href="#/">الرئيسية</a> / <a href="#/grades?subject=${subject}">${SUBJECTS[subject].name}</a> / <a href="#/year/${u.year_group}?subject=${subject}&track=${u.track}&term=${u.term}"><span dir="ltr">Grade ${u.year_group}</span> · ${TRACKS[u.track]}</a> / ${TERMS[u.term]}</div>
      ${nn && l.title_en ? `<h1 dir="ltr" style="text-align:right">${esc(l.title_en)}</h1><p class="muted" style="font-size:1.15rem">${esc(l.title_ar)}</p>`
        : `<h1>${esc(l.title_ar)}</h1>${l.title_en ? `<p class="muted" dir="ltr" style="text-align:right">${esc(l.title_en)}</p>` : ""}`}
      <div class="head-meta">

  /* ---------- recitation recorder (student) ---------- */
  async function recorder(l, nn) {
    const btn = document.getElementById("recBtn"); if (!btn) return;
    const time = document.getElementById("recTime"), play = document.getElementById("recPlay"), acts = document.getElementById("recActions");
    let rec = null, chunks = [], blob = null, t0 = 0, tmr = null, stream = null;
    const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/aac"].find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "";
    const stop = () => { if (rec && rec.state === "recording") rec.stop(); clearInterval(tmr); btn.classList.remove("on"); if (stream) stream.getTracks().forEach((t) => t.stop()); };
    btn.onclick = async () => {
      if (rec && rec.state === "recording") { stop(); return; }
      if (!window.MediaRecorder) { toast(nn ? "Recording is not supported in this browser" : "المتصفح لا يدعم التسجيل الصوتي"); return; }
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
      catch (e) { toast(nn ? "Please allow microphone access" : "اسمح للموقع باستخدام الميكروفون"); return; }
      chunks = []; rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
      rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
      rec.onstop = () => { blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" }); play.src = URL.createObjectURL(blob); play.hidden = false; acts.hidden = false; };
      rec.start(); btn.classList.add("on"); play.hidden = true; acts.hidden = true; t0 = Date.now();
      tmr = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); time.textContent = fmt(s); if (s >= 300) stop(); }, 250);
    };
    document.getElementById("recAgain").onclick = () => { blob = null; play.hidden = true; acts.hidden = true; time.textContent = "0:00"; };
    document.getElementById("recSend").onclick = async (e) => {
      if (!blob) return; e.target.disabled = true;
      const ext = (blob.type.includes("mp4") || blob.type.includes("aac")) ? "m4a" : "webm";
      const path = `${state.session.user.id}/${Date.now()}.${ext}`;
      const up = await sb.storage.from("recitations").upload(path, blob, { contentType: blob.type.split(";")[0] });
      if (up.error) { toast((nn ? "Upload failed: " : "تعذّر الرفع: ") + up.error.message); e.target.disabled = false; return; }
      const ins = await sb.from("recitations").insert({ student_id: state.session.user.id, school_id: state.profile.school_id, lesson_id: l.id,
        title: (nn ? "Recitation: " : "تسميع: ") + (nn && l.title_en ? l.title_en : l.title_ar), audio_path: path, duration_sec: Math.round((Date.now() - t0) / 1000) });
      if (ins.error) { toast("تعذّر الحفظ: " + ins.error.message); e.target.disabled = false; return; }
      toast(nn ? "Sent to your teacher" : "أُرسل التسميع لمعلمك"); blob = null; play.hidden = true; acts.hidden = true; time.textContent = "0:00"; e.target.disabled = false; listMine();
    };
    const listMine = async () => {
      const { data } = await sb.from("recitations").select("id, status, teacher_note, created_at").eq("student_id", state.session.user.id).eq("lesson_id", l.id).order("created_at", { ascending: false });
      const ST = { submitted: nn ? "Waiting for review" : "بانتظار التقييم", mastered: nn ? "Mastered" : "أتقن", redo: nn ? "Please record again" : "أعد التسميع" };
      const LV = { submitted: "developing", mastered: "mastered", redo: "needs_support" };
      document.getElementById("recList").innerHTML = (data || []).length ? `<h3 class="res-group">${nn ? "My recitations" : "تسميعاتي"}</h3>${data.map((r) => `<div class="m-item ${LV[r.status]}"><div class="m-head"><span class="lv ${LV[r.status]}">${ST[r.status]}</span><span class="muted">${new Date(r.created_at).toLocaleDateString("ar-AE")}</span></div>${r.teacher_note ? `<p>${esc(r.teacher_note)}</p>` : ""}</div>`).join("")}` : "";
    };
    listMine();
  }

  async function pageMy() {
    setNav("");
    if (!state.session) { location.hash = "#/login"; return; }
    const p = state.profile || {};
    if (state.profile && state.profile.role === "parent") return pageParent();
    if (!isStudent()) { location.hash = isStaff() ? "#/teacher" : "#/"; return; }
    const { data } = await sb.from("class_students").select("classes(id, name, year_group, track, subject_id)").eq("student_id", state.session.user.id);
    const cls = (data || []).map((r) => r.classes).filter(Boolean);
    const testsBy = {}; const todayBy = {};
    if (cls.length) {
      const cids = cls.map((c) => c.id);
      const [{ data: full }, { data: myViews }] = await Promise.all([
        sb.from("classes").select("id, lock_lessons, class_lesson_unlocks(lesson_id, unlock_at)").in("id", cids),
        sb.from("lesson_views").select("lesson_id").eq("student_id", state.session.user.id)
      ]);
      const seen = new Set((myViews || []).map((v) => v.lesson_id));
      const wantIds = []; const pick = {};
      for (const c of cls) {
        const f = (full || []).find((x) => x.id === c.id);
        if (f && f.lock_lessons) {
          const open = (f.class_lesson_unlocks || []).filter((k) => new Date(k.unlock_at).getTime() <= Date.now()).sort((a, b) => new Date(b.unlock_at) - new Date(a.unlock_at))[0];
          if (open) { pick[c.id] = open.lesson_id; wantIds.push(open.lesson_id); }
        } else {
          const { data: us } = await sb.from("units").select("term, sort_order, lessons(id, sort_order)").eq("year_group", c.year_group).eq("subject_id", c.subject_id).eq("track", c.track).order("term").order("sort_order");
          const ordered = (us || []).flatMap((u) => (u.lessons || []).sort((a, b) => a.sort_order - b.sort_order));
          const nxt = ordered.find((l) => !seen.has(l.id)) || ordered[ordered.length - 1];
          if (nxt) { pick[c.id] = nxt.id; wantIds.push(nxt.id); }
        }
      }
      if (wantIds.length) {
        const { data: li } = await sb.from("lessons").select("id, code, title_ar, title_en").in("id", wantIds);
        cls.forEach((c) => { const l = (li || []).find((x) => x.id === pick[c.id]); if (l) todayBy[c.id] = { ...l, seen: seen.has(l.id) }; });
      }
    }
    if (cls.length) {
      const [{ data: tests }, { data: mine }, { data: opened }] = await Promise.all([
        sb.from("assessments").select("id, kind, term, year_group, subject_id, track, title_ar, title_en").in("kind", ["diagnostic", "post"]).eq("is_published", true)
          .in("year_group", [...new Set(cls.map((c) => c.year_group))]).order("term"),
        sb.from("attempts").select("assessment_id, score, max_score, submitted_at").eq("student_id", state.session.user.id),
        sb.from("class_assessments").select("class_id, assessment_id").in("class_id", cls.map((c) => c.id))
      ]);
      const isOpen = new Set((opened || []).map((x) => x.class_id + "|" + x.assessment_id));
      const done = {}; (mine || []).forEach((a) => { if (a.submitted_at) done[a.assessment_id] = a; });
      cls.forEach((c) => { testsBy[c.id] = (tests || []).filter((t) => t.year_group === c.year_group && t.subject_id === c.subject_id && t.track === c.track)
        .map((t) => ({ ...t, done: done[t.id] })).filter((t) => t.done || isOpen.has(c.id + "|" + t.id)); });
    }
    h(`<section class="page-head"><div class="wrap" style="padding-bottom:30px">
        <h1>أهلًا ${esc(p.full_name_ar || "")}</h1><p class="muted">اختر مادتك لتبدأ.</p></div></section>
      <section class="section" style="padding-top:34px"><div class="wrap"><div class="grade-row">
        ${cls.map((c) => todayBy[c.id] ? `<a class="today-card" href="#/lesson/${esc(todayBy[c.id].code)}">
            <span class="today-tag">${c.track === "non_native" ? "Today's lesson" : "درس اليوم"} · ${SUBJECTS[SUBJECT_BY_ID[c.subject_id]].name}</span>
            <strong ${c.track === "non_native" && todayBy[c.id].title_en ? 'dir="ltr"' : ""}>${esc(c.track === "non_native" && todayBy[c.id].title_en ? todayBy[c.id].title_en : todayBy[c.id].title_ar)}</strong>
            <span class="btn btn-dawn btn-small">${todayBy[c.id].seen ? (c.track === "non_native" ? "Open again" : "افتحه مرة أخرى") : (c.track === "non_native" ? "Start the lesson" : "ابدأ الدرس")}</span></a>` : "").join("")}
        ${cls.length ? cls.map((c) => `<a class="grade-tile ready" href="#/year/${c.year_group}?subject=${SUBJECT_BY_ID[c.subject_id]}&track=${c.track}">
          <span class="y">${SUBJECTS[SUBJECT_BY_ID[c.subject_id]].name}</span><span class="g">Grade ${c.year_group} · ${esc(c.name)}</span></a>
          ${(testsBy[c.id] || []).map((t) => t.done
            ? `<a class="test-card done" href="#/result/${t.id}"><strong>${esc(tTitle(t))}</strong><span>${t.track === "non_native" ? "Done" : "أنجزته"} · ${t.done.score}/${t.done.max_score} · ${t.track === "non_native" ? "View my mastery map" : "اعرض خريطة إتقاني"}</span></a>`
            : `<a class="test-card ${t.kind}" href="#/test/${t.id}"><strong>${esc(tTitle(t))}</strong><span>${t.track === "non_native" ? "Start the test" : "ابدأ الاختبار"}</span></a>`).join("")}`).join("")
          : ""}
      </div>${!cls.length ? '<div id="indepHome"></div>' : ""}</div></section>`);
    if (!cls.length) independentHome();
  }

  async function independentHome() {
    const box = document.getElementById("indepHome"); if (!box) return;

      sb.from("units").select("term, sort_order, lessons(id, code, title_ar, title_en, sort_order)").eq("year_group", g).eq("track", tr).eq("subject_id", 1).order("term").order("sort_order"),

      <div class="tp-grid">${[1, 2, 3].map((t) => `<div class="tp-term"><h3>${CT(TERMS[t], "Term " + t)}</h3>${(tests || []).filter((x) => x.term === t).map((x) => `<div class="tp-card ${x.kind}"><div class="tp-head"><strong>${x.kind === "post" ? CT("الاختبار البعدي", "Post-test") : CT("الاختبار التشخيصي", "Diagnostic test")}</strong></div>
        ${done[x.id] ? `<div class="tp-status done">✓ ${done[x.id].score}/${done[x.id].max_score}</div><a class="btn btn-ghost btn-small" href="#/result/${x.id}">${CT("خريطة إتقاني", "My mastery map")}</a>` : `<a class="btn btn-dawn btn-small" href="#/test/${x.id}">${CT("ابدأ الاختبار", "Start the test")}</a>`}</div>`).join("") || "—"}</div>`).join("")}</div>`;

    </div></section>

        <div class="field"><label for="rk">النوع</label><select id="rk">
          ${Object.keys(KIND).map((k) => `<option value="${k}">${KIND[k]}</option>`).join("")}</select></div>
        <div class="field"><label for="rp">الجزء</label><select id="rp"><option value="">الدرس كله</option><option value="1">الجزء الأول</option><option value="2">الجزء الثاني</option></select></div>
        <div class="field"><label for="ra">لمن هذه المادة؟</label><select id="ra">

          <option value="teacher">للمعلم فقط (شرائح المعلم، دليل، إجابات نموذجية)</option>
