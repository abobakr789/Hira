}

  --paper: #0F1620; --stone: #16202C; --stone-2: #1D2937; --ink: #E8ECEF; --muted: #9AA6B3;
  --line: #26323F; --hira: #2EC4C4; --hira-deep: #8FE3E3; --hira-soft: #0F2E2E;
  --dawn: #F9B20B; --dawn-soft: #2B2516; --night: #0A0F16; --on-hira: #0F1620; --danger: #FF8A80;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 80px); }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-ui); font-size: 17px; line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--paper);
}
img, svg { max-width: 100%; }
a { color: var(--hira); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid var(--dawn); outline-offset: 2px; border-radius: 4px;
}
h1, h2, h3 { line-height: 1.35; margin: 0 0 .5em; font-weight: 700; }
h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); }
h2 { font-size: clamp(1.4rem, 2.6vw, 1.8rem); }
h3 { font-size: 1.15rem; }
p { margin: 0 0 1em; max-width: 68ch; }
.muted { color: var(--muted); }
.wrap { width: min(1180px, 100% - 40px); margin-inline: auto; }
main:focus { outline: none; }
.skip { position: absolute; inset-inline-start: -999px; }
.skip:focus { inset-inline-start: 12px; top: 12px; z-index: 50; background: var(--paper); padding: 8px 14px; }

/* Header */
.site-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: saturate(1.2) blur(10px);
  border-bottom: 1px solid var(--line);
}
.header-row { display: flex; align-items: center; gap: 28px; min-height: 76px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand-logo { height: 64px; width: auto; display: block; }
.m-stone { fill: var(--hira); }
.m-light { fill: var(--dawn); }
.main-nav { display: flex; gap: 6px; flex: 1; }
.main-nav a { color: var(--ink); text-decoration: none; padding: 8px 14px; border-radius: 999px; font-weight: 500; }
.main-nav a:hover { background: var(--stone); }
.main-nav a.active { background: var(--hira-soft); color: var(--hira-deep); }
.auth-slot { display: flex; align-items: center; gap: 10px; }
.user-chip { font-size: .9rem; color: var(--muted); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: inherit; font-weight: 600; font-size: .95rem; cursor: pointer;
  padding: 10px 20px; border-radius: 999px; border: 1.5px solid transparent; text-decoration: none;
}
.btn-primary { background: var(--hira); color: var(--on-hira); }
.btn-primary:hover { background: var(--hira-deep); }
.btn-ghost { border-color: var(--line); color: var(--ink); background: transparent; }
.btn-ghost:hover { border-color: var(--hira); color: var(--hira); }
.btn-dawn { background: var(--dawn); color: #241A05; }
.hero .btn-dawn:hover { filter: brightness(1.06); }
.btn-small { padding: 6px 14px; font-size: .85rem; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }

/* Hero — the one bold moment */
.hero { background: var(--night); color: #F3F1EA; overflow: hidden; position: relative; }
.hero-grid { display: grid; grid-template-columns: 1.05fr .95fr; align-items: end; gap: 24px; min-height: min(78vh, 640px); }
.hero-copy { padding: 72px 0 80px; position: relative; z-index: 2; }
.hero .hero-word {
  font-family: var(--font-text); font-weight: 700; font-size: clamp(5rem, 15vw, 11rem);
  line-height: .9; margin: 0 0 18px; color: var(--dawn);
  text-shadow: 0 0 60px color-mix(in srgb, var(--dawn) 45%, transparent);
}
.hero h1 { color: #FFFFFF; font-size: clamp(1.6rem, 3.2vw, 2.3rem); font-weight: 600; max-width: 22ch; }
.hero p { color: #C9D1DA; font-size: 1.08rem; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.hero .btn-ghost { color: #F3F1EA; border-color: #3A4A63; }
.hero .btn-ghost:hover { border-color: var(--dawn); color: var(--dawn); }
.hero-art { align-self: stretch; display: flex; align-items: flex-end; }
.hero-art svg { width: 100%; height: auto; display: block; }
.cave-glow { animation: glow 2.6s ease-out both; transform-origin: 50% 100%; }
.light-beam { animation: beam 3.2s ease-out .4s both; }
@keyframes glow { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
@keyframes beam { from { opacity: 0; } to { opacity: .55; } }
@media (prefers-reduced-motion: reduce) {
  .cave-glow, .light-beam { animation: none; }
}

/* Sections */
.section { padding: 76px 0; }
.section-alt { background: var(--stone); }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 32px; flex-wrap: wrap; }
.section-head p { margin: 0; color: var(--muted); }

/* Audience tabs (Alef-style stakeholder tabs) */
.aud-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
.aud-tab {
  font: inherit; font-weight: 600; padding: 10px 22px; border-radius: 999px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
}
.aud-tab[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.aud-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
.aud-point h3 { display: flex; align-items: center; gap: 10px; }
.aud-point h3 svg { width: 26px; height: 26px; flex: none; color: var(--hira); }
.aud-point p { color: var(--muted); margin: 0; }

/* Grade ladder */
.stage { margin-bottom: 34px; }
.stage-title { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.stage-title h3 { margin: 0; }
.stage-title span { color: var(--muted); font-size: .9rem; }
.grade-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.grade-tile {
  display: block; text-decoration: none; color: var(--ink);
  background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--radius-s);
  padding: 16px 18px; position: relative;
}
.grade-tile:hover { border-color: var(--hira); }
.grade-tile .y { font-size: 1.35rem; font-weight: 700; display: block; }
.grade-tile .g { font-size: .85rem; color: var(--muted); }
.grade-tile .status { display: block; margin-top: 10px; font-size: .8rem; font-weight: 600; }
.grade-tile.ready { border-color: var(--hira); }
.grade-tile.ready .status { color: var(--hira); }
.grade-tile.soon .status { color: var(--muted); }

/* Page head */
.page-head { background: var(--stone); padding: 44px 0 0; border-bottom: 1px solid var(--line); }
.crumbs { font-size: .9rem; color: var(--muted); margin-bottom: 10px; }
.crumbs a { color: var(--muted); }
.page-head h1 { margin-bottom: 6px; }
.head-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 500; padding: 4px 12px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); color: var(--muted); }
.pill.axis { background: var(--hira-soft); border-color: transparent; color: var(--hira-deep); }
.pill.warn { background: var(--dawn-soft); border-color: transparent; color: var(--ink); }

/* Track switch + term tabs */
.controls { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: end; margin-top: 26px; }
.seg { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.seg button, .seg a {
  font: inherit; font-weight: 600; font-size: .92rem; border: 0; background: transparent; color: var(--muted);
  padding: 8px 18px; border-radius: 999px; cursor: pointer; text-decoration: none;
}
.seg [aria-pressed="true"], .seg [aria-current="true"] { background: var(--hira); color: var(--on-hira); }
.term-tabs { display: flex; gap: 4px; }
.term-tab {
  font: inherit; font-weight: 600; border: 0; background: transparent; color: var(--muted); cursor: pointer;
  padding: 12px 20px; border-bottom: 3px solid transparent;
}
.term-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--dawn); }

/* Units & lessons */
.layout-2 { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 40px; align-items: start; }
.unit { margin-bottom: 40px; }
.unit-head { display: flex; align-items: baseline; gap: 14px; border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 4px; }
.unit-head .n { color: var(--dawn); font-family: var(--font-text); font-size: 1.6rem; font-weight: 700; }
.unit-head h2 { margin: 0; font-size: 1.35rem; }
.unit-head .en { color: var(--muted); font-size: .9rem; margin-inline-start: auto; direction: ltr; }
.lesson-row {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 14px; align-items: center;
  padding: 14px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink);
}
.lesson-row:hover { background: var(--stone); }
.lesson-row .idx { color: var(--muted); font-weight: 600; text-align: center; }
.lesson-row .t { font-weight: 600; display: block; }
.lesson-row .te { color: var(--muted); font-size: .85rem; direction: ltr; text-align: end; display: block; }
.lesson-row .meta { display: flex; gap: 6px; align-items: center; }
.res-dots { display: flex; gap: 4px; }
.res-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.res-dot.on { background: var(--hira); }

.side-card { background: var(--stone); border-radius: var(--radius-l); padding: 24px; position: sticky; top: 96px; }
.side-card h3 { margin-bottom: 14px; }
.outcome-group { margin-bottom: 16px; }
.outcome-group h4 { margin: 0 0 6px; font-size: .9rem; color: var(--hira-deep); }
.outcome { font-size: .88rem; margin: 0 0 8px; color: var(--ink); }
.outcome code, .code { font-family: var(--font-ui); direction: ltr; unicode-bidi: isolate; font-size: .78rem; color: var(--muted); background: var(--paper); padding: 1px 6px; border-radius: 4px; }

/* Lesson page */
.lesson-tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 26px; scrollbar-width: thin; }
.lesson-tab {
  font: inherit; font-weight: 600; white-space: nowrap; cursor: pointer; border: 0; background: transparent;
  color: var(--muted); padding: 12px 18px; border-bottom: 3px solid transparent;
}
.lesson-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--dawn); }
.panel { padding: 36px 0 60px; }
.res-list { display: grid; gap: 12px; }
.res-item {
  display: flex; gap: 14px; align-items: center; padding: 16px 18px; border: 1.5px solid var(--line);
  border-radius: var(--radius-s); text-decoration: none; color: var(--ink);
}
.res-item:hover { border-color: var(--hira); }
.res-item .kind { font-size: .8rem; color: var(--muted); display: block; }
.res-item svg { width: 28px; height: 28px; color: var(--hira); flex: none; }
.video-frame { aspect-ratio: 16/9; width: 100%; border: 0; border-radius: var(--radius-s); background: var(--stone); }
.empty {
  border: 1.5px dashed var(--line); border-radius: var(--radius-l); padding: 34px; text-align: center; color: var(--muted);
}
.empty strong { display: block; color: var(--ink); margin-bottom: 4px; }

.evidence { border-inline-start: 4px solid var(--dawn); padding: 6px 22px; margin: 0 0 26px; }
.evidence .txt { font-family: var(--font-text); font-size: 1.6rem; line-height: 2.1; margin: 0 0 8px; }
.evidence .src { font-size: .88rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.quran-ref { font-family: var(--font-text); font-size: 1.8rem; }

.identity-card { background: var(--hira-soft); border-radius: var(--radius-l); padding: 24px 26px; margin-bottom: 16px; }
.identity-card .pillar { font-size: .85rem; font-weight: 600; color: var(--hira-deep); }
.identity-card p { margin: 6px 0 0; font-size: 1.05rem; }
.identity-card .en { direction: ltr; text-align: left; color: var(--muted); font-size: .92rem; }

/* Forms */
.form-card { max-width: 440px; margin: 60px auto; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-l); padding: 34px; }
.field { display: grid; gap: 6px; margin-bottom: 16px; }
.field label { font-weight: 600; font-size: .92rem; }
.field input, .field select, .field textarea {
  font: inherit; padding: 10px 14px; border-radius: var(--radius-s); border: 1.5px solid var(--line);
  background: var(--paper); color: var(--ink);
}
.field input[dir="ltr"] { text-align: left; }
.form-error { color: var(--danger); font-size: .9rem; min-height: 1.4em; }
.check { display: flex; gap: 8px; align-items: center; font-size: .92rem; }

/* Admin */
.admin-table { width: 100%; border-collapse: collapse; font-size: .92rem; }
.table-wrap { overflow-x: auto; }
.admin-table th, .admin-table td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; }
.admin-table th { color: var(--muted); font-weight: 600; font-size: .82rem; }
.admin-filters { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 22px; align-items: end; }
.admin-filters .field { margin: 0; }
dialog { border: 0; border-radius: var(--radius-l); padding: 28px; width: min(520px, 100% - 32px); background: var(--paper); color: var(--ink); }
dialog::backdrop { background: rgba(10, 15, 22, .55); }
.dialog-actions { display: flex; gap: 10px; justify-content: flex-start; margin-top: 8px; }

/* About */
.prose { max-width: 70ch; }
.prose p { font-size: 1.05rem; }

/* Footer */
.site-footer { border-top: 1px solid var(--line); padding: 34px 0; margin-top: 40px; }
.footer-row { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.footer-row p { margin: 4px 0 0; }

.toast {
  position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); inset-inline-start: 50%; transform: translateX(50%);
  background: var(--ink); color: var(--paper); padding: 12px 22px; border-radius: 999px; font-weight: 500;
  opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60;
}
.toast.show { opacity: 1; }
.loading { padding: 80px 0; text-align: center; color: var(--muted); }

@media (max-width: 900px) {
  .hero-grid { grid-template-columns: 1fr; min-height: 0; }
  .hero-copy { padding: 48px 0 10px; }
  .hero-art { max-width: 520px; margin-inline: auto; }
  .aud-panel { grid-template-columns: 1fr; }
  .layout-2 { grid-template-columns: 1fr; }
  .side-card { position: static; }
}
@media (max-width: 640px) {
  .header-row { gap: 12px; flex-wrap: wrap; padding: 8px 0; }
  .main-nav { order: 3; flex-basis: 100%; overflow-x: auto; }
  .brand-logo { height: 46px; }
  .unit-head .en { display: none; }
  .lesson-row { grid-template-columns: 28px 1fr; }
  .lesson-row .meta { grid-column: 2; }
}

/* Domain filter chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 30px; }
.chips-label { font-weight: 600; color: var(--muted); font-size: .9rem; margin-inline-end: 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink);
  font-size: .9rem; font-weight: 500; padding: 7px 14px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--paper);
}
.chip span { font-size: .78rem; color: var(--muted); background: var(--stone); padding: 0 7px; border-radius: 999px; }
.chip:hover { border-color: var(--hira); }
.chip[aria-current="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip[aria-current="true"] span { background: transparent; color: var(--paper); }
.chip::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--dc, var(--line)); }
.chip:first-of-type::before { display: none; }
.d1 { --dc: #008080; } .d2 { --dc: #3B6FB6; } .d3 { --dc: #C2185B; }
.d4 { --dc: #E08A00; } .d5 { --dc: #6A4CA8; } .d6 { --dc: #2E7D32; }
.pill.axis[class*=" d"] { box-shadow: inset -3px 0 0 var(--dc, transparent); }

</style>

      else if (u.hostname.includes("youtube.com")) id = u.searchParams.get("v") || (u.pathname.startsWith("/shorts/") ? u.pathname.split("/")[2] : null);
      return id ? "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(id) : null;
    } catch (e) { return null; }
  };

  async function pageYear(year, params) {
    setNav("grades");
    const track = params.get("track") === "non_native" ? "non_native" : "native";
    const term = ["1", "2", "3"].includes(params.get("term")) ? Number(params.get("term")) : 1;
    const subject = subjOf(params);
    const sid = SUBJECTS[subject].id;
    const domain = Number(params.get("domain")) || 0;
    loading();

    const [unitsRes, outRes, axesRes, domRes] = await Promise.all([
      sb.from("units")
        .select("id, term, sort_order, title_ar, title_en, lessons(id, code, sort_order, title_ar, title_en, axis_code, book_pages, lesson_resources(kind))")
        .eq("year_group", year).eq("track", track).eq("subject_id", sid).order("term").order("sort_order"),
      sb.from("learning_outcomes").select("code, statement_ar, sort_order, fw_standards(axis_code)").eq("year_group", year).eq("subject_id", sid).order("sort_order"),
      state.axes.length ? Promise.resolve({ data: state.axes }) : sb.from("fw_axes").select("code, name_ar, domain_id"),
      state.domains ? Promise.resolve({ data: state.domains }) : sb.from("fw_domains").select("id, name_ar, subject_id").order("id")
    ]);
    state.domains = domRes.data || [];
    if (unitsRes.error) { h(`<div class="wrap loading">تعذّر تحميل المنهج: ${esc(unitsRes.error.message)}</div>`); return; }
    state.axes = axesRes.data || [];
    const axisName = (c) => (state.axes.find((a) => a.code === c) || {}).name_ar || "";

    const units = unitsRes.data || [];
    const termUnits = units.filter((u) => u.term === term);
    const counts = { 1: 0, 2: 0, 3: 0 };
    units.forEach((u) => { counts[u.term] += (u.lessons || []).length; });
    const nn = track === "non_native";
    const href = (t, tr, d) => `#/year/${year}?subject=${subject}&track=${tr}&term=${t}${(d === undefined ? domain : d) ? "&domain=" + (d === undefined ? domain : d) : ""}`;
    const domainOf = (c) => (state.axes.find((a) => a.code === c) || {}).domain_id;
    const termLessons = termUnits.flatMap((u) => u.lessons || []);
    const dCounts = {};
    termLessons.forEach((l) => { const d = domainOf(l.axis_code); if (d) dCounts[d] = (dCounts[d] || 0) + 1; });
    const subjDomains = state.domains.filter((d) => d.subject_id === sid && dCounts[d.id]);
    const chipsHtml = subjDomains.length ? `<nav class="chips" aria-label="تصفية حسب المجال">
      <span class="chips-label">المجال:</span>
      <a class="chip" href="${href(term, track, 0)}" aria-current="${!domain}">الكل <span>${termLessons.length}</span></a>
      ${subjDomains.map((d) => `<a class="chip d${d.id}" href="${href(term, track, d.id)}" aria-current="${domain === d.id}">${esc(d.name_ar)} <span>${dCounts[d.id]}</span></a>`).join("")}
    </nav>` : "";

    let unitNo = units.filter((u) => u.term < term).length;
    const unitsHtml = termUnits.length ? termUnits.map((u) => {
      unitNo += 1;
      const allLessons = (u.lessons || []).sort((a, b) => a.sort_order - b.sort_order);
      const lessons = domain ? allLessons.filter((l) => domainOf(l.axis_code) === domain) : allLessons;
      if (!lessons.length) return "";
      return `<div class="unit">
        <div class="unit-head"><span class="n">${unitNo}</span><h2>${esc(nn && u.title_en ? u.title_en : u.title_ar)}</h2>
          <span class="en">${esc(nn ? u.title_ar : (u.title_en || ""))}</span></div>
        ${lessons.map((l, i) => {
          const kinds = new Set((l.lesson_resources || []).map((r) => r.kind));
          const dot = (k) => `<span class="res-dot ${kinds.has(k) ? "on" : ""}" title="${KIND[k]}"></span>`;
          return `<a class="lesson-row" href="#/lesson/${esc(l.code)}">
            <span class="idx">${allLessons.indexOf(l) + 1}</span>
            <span><span class="t" ${nn ? 'dir="ltr" style="text-align:right"' : ""}>${esc(nn && l.title_en ? l.title_en : l.title_ar)}</span>
              ${nn ? `<span class="muted" style="font-size:.85rem">${esc(l.title_ar)}</span>` : ""}</span>
            <span class="meta"><span class="pill axis d${domainOf(l.axis_code) || 0}">${esc(axisName(l.axis_code))}</span>
              <span class="res-dots" aria-label="المواد المتاحة">${dot("slides")}${dot("worksheet")}${dot("video")}</span></span>
          </a>`;
        }).join("")}
      </div>`;
    }).join("") : `<div class="empty"><strong>لم يُضف منهج ${SUBJECTS[subject].name} لـ${TERMS[term]} في هذا المسار بعد</strong>سيظهر هنا فور إدخاله.</div>`;

    const unitsBlock = unitsHtml.trim() ? unitsHtml : `<div class="empty"><strong>لا توجد دروس في هذا المجال في ${TERMS[term]}</strong><a href="${href(term, track, 0)}">عرض كل الدروس</a></div>`;
    const outcomes = outRes.data || [];
    const byAxis = {};
    outcomes.forEach((o) => { const a = o.fw_standards ? o.fw_standards.axis_code : "-"; (byAxis[a] = byAxis[a] || []).push(o); });
    const outcomesHtml = outcomes.length ? Object.keys(byAxis).map((a) => `
      <div class="outcome-group"><h4>${esc(axisName(a))}</h4>
      ${byAxis[a].map((o) => `<p class="outcome">${esc(o.statement_ar)} <code>${esc(o.code)}</code></p>`).join("")}</div>`).join("")
      : '<p class="muted">لم تُدخل نواتج هذا الصف بعد.</p>';

    h(`
    <section class="page-head"><div class="wrap">
      <div class="crumbs"><a href="#/">الرئيسية</a> / <a href="#/grades?subject=${subject}">${SUBJECTS[subject].name}</a></div>
      <h1><span dir="ltr">Grade ${year}</span> · ${SUBJECTS[subject].name}</h1>
      <p class="muted">الصف ${ORD_GRADE[year] || year}${outcomes.length ? ` · ${outcomes.length} ناتج تعلم من الإطار الوطني` : ""}</p>
      <div class="controls">
        <div class="seg" role="group" aria-label="المسار">
          <a href="${href(term, "native")}" aria-current="${!nn}">${TRACKS.native}</a>
          <a href="${href(term, "non_native")}" aria-current="${nn}">${TRACKS.non_native}</a>
        </div>
        <div class="term-tabs" role="tablist">
          ${[1, 2, 3].map((t) => `<a class="term-tab" role="tab" href="${href(t, track, 0)}" aria-selected="${t === term}" style="text-decoration:none">${TERMS[t]} <span class="muted">(${counts[t]})</span></a>`).join("")}
        </div>
      </div>
    </div></section>
    <section class="section" style="padding-top:44px"><div class="wrap layout-2">
      <div>${chipsHtml}${unitsBlock}</div>
      <aside class="side-card"><h3>نواتج التعلم للصف</h3>${outcomesHtml}</aside>
    </div></section>`);
  }

    const outs = (l.lesson_outcomes || []).map((x) => x.learning_outcomes).filter(Boolean).sort((a, b) => a.sort_order - b.sort_order);
    const sc = (l.success_criteria || []).sort((a, b) => (a.part || 0) - (b.part || 0) || a.sort_order - b.sort_order);
    const outHtml = `
      <h3>نواتج التعلم من الإطار الوطني</h3>
      ${outs.length ? outs.map((o) => `<p class="outcome">${esc(o.statement_ar)} <code>${esc(o.code)}</code></p>`).join("") : '<p class="muted">لا توجد نواتج مرتبطة.</p>'}
      <h3 style="margin-top:28px">معايير النجاح</h3>
      ${sc.length ? `<ol>${sc.map((s) => `<li>${esc(s.statement_ar)}${s.statement_en ? `<br><span dir="ltr" class="muted">${esc(s.statement_en)}</span>` : ""}</li>`).join("")}</ol>`
        : '<div class="empty"><strong>لم تُكتب معايير النجاح بعد</strong>تُضاف مع شرائح الدرس.</div>'}`;

    const quizHtml = state.session
      ? `<div class="empty"><strong>لا يوجد اختبار منشور لهذا الدرس بعد</strong>سيظهر هنا عند إضافته.</div>`
      : `<div class="empty"><strong>الاختبارات للطلاب المسجلين</strong><a class="btn btn-primary" style="margin-top:12px" href="#/login">تسجيل الدخول</a></div>`;

    const TABS = [
      ["slides", "الشرائح", resList(["slides"], "لم تُضف شرائح هذا الدرس بعد")],
      ["work", "أوراق العمل", resList(["worksheet", "group_pack", "file", "interactive", "link"], "لم تُضف أوراق عمل لهذا الدرس بعد")],
      ["video", "الفيديو", videoHtml],
      ...(subject === "islamic" || ev.length ? [["evidence", subject === "islamic" ? "الأدلة من القرآن والسنة" : "الشواهد", evHtml]] : []),
      ["identity", "الهوية الوطنية", idHtml],
      ["outcomes", "نواتج التعلم", outHtml],
      ["quiz", "الاختبار", quizHtml]
    ];

    h(`
    <section class="page-head"><div class="wrap">
      <div class="crumbs"><a href="#/">الرئيسية</a> / <a href="#/grades?subject=${subject}">${SUBJECTS[subject].name}</a> / <a href="#/year/${u.year_group}?subject=${subject}&track=${u.track}&term=${u.term}"><span dir="ltr">Grade ${u.year_group}</span> · ${TRACKS[u.track]}</a> / ${TERMS[u.term]}</div>
      ${nn && l.title_en ? `<h1 dir="ltr" style="text-align:right">${esc(l.title_en)}</h1><p class="muted" style="font-size:1.15rem">${esc(l.title_ar)}</p>`
        : `<h1>${esc(l.title_ar)}</h1>${l.title_en ? `<p class="muted" dir="ltr" style="text-align:right">${esc(l.title_en)}</p>` : ""}`}
      <div class="head-meta">
        <span class="pill axis">${esc(axisName)}</span>
        <span class="pill">وحدة: ${esc(nn && u.title_en ? u.title_en : u.title_ar)}</span>
        ${l.book_pages ? `<span class="pill">الكتاب: ص ${esc(l.book_pages)}</span>` : ""}
        <span class="pill">${TRACK_SHORT[u.track]}</span>
      </div>
      <div class="lesson-tabs" role="tablist" aria-label="أقسام الدرس">
        ${TABS.map(([k, t], i) => `<button class="lesson-tab" role="tab" id="tab-${k}" aria-controls="panel" aria-selected="${i === 0}" data-k="${k}">${t}</button>`).join("")}
      </div>
    </div></section>
    <section class="wrap panel" id="panel" role="tabpanel"></section>`);

    const panel = document.getElementById("panel");
    const show = (k) => {
      const tab = TABS.find((t) => t[0] === k) || TABS[0];
      panel.innerHTML = tab[2];
      panel.setAttribute("aria-labelledby", "tab-" + tab[0]);
      document.querySelectorAll(".lesson-tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.k === tab[0])));
    };
    document.querySelectorAll(".lesson-tab").forEach((b) => b.addEventListener("click", () => show(b.dataset.k)));
    show("slides");
  }

  function pageLogin() {
    setNav("");
    if (state.session) { location.hash = isSuper() ? "#/admin" : "#/"; return; }
    h(`<div class="wrap"><div class="form-card">
      <h1 style="font-size:1.6rem">تسجيل الدخول</h1>
      <p class="muted">للمعلمين وإدارات المدارس والمشرفين. يدخل الطلاب من رابط مدرستهم.</p>
      <form id="loginForm" novalidate>
        <div class="field"><label for="em">البريد الإلكتروني</label><input id="em" type="email" dir="ltr" autocomplete="email" required></div>
        <div class="field"><label for="pw">كلمة المرور</label><input id="pw" type="password" dir="ltr" autocomplete="current-password" required minlength="8"></div>
        <p class="form-error" id="err"></p>
        <button class="btn btn-primary" type="submit" style="width:100%" id="submitBtn">دخول</button>
      </form>
      <p style="margin-top:18px;font-size:.92rem" class="muted">أول مرة؟ <a href="#" id="toggleMode">أنشئ حسابك</a></p>
    </div></div>`);
    let mode = "in";
    const btn = document.getElementById("submitBtn"), err = document.getElementById("err");
    document.getElementById("toggleMode").onclick = (e) => {
      e.preventDefault();
      mode = mode === "in" ? "up" : "in";
      btn.textContent = mode === "in" ? "دخول" : "إنشاء الحساب";
      e.target.textContent = mode === "in" ? "أنشئ حسابك" : "لديّ حساب";
      document.getElementById("pw").autocomplete = mode === "in" ? "current-password" : "new-password";
      err.textContent = "";
    };
    document.getElementById("loginForm").onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById("em").value.trim(), password = document.getElementById("pw").value;
      if (!email || password.length < 8) { err.textContent = "أدخل البريد الإلكتروني وكلمة مرور من 8 أحرف على الأقل."; return; }
      btn.disabled = true; err.textContent = "";
      const r = mode === "in" ? await sb.auth.signInWithPassword({ email, password }) : await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname + "#/login" } });
      btn.disabled = false;
      if (r.error) {
        err.textContent = /Invalid login/i.test(r.error.message) ? "البريد الإلكتروني أو كلمة المرور غير صحيحة." : r.error.message;
        return;
      }
      if (mode === "up" && !r.data.session) { err.textContent = ""; toast("أرسلنا رابط التفعيل إلى بريدك. افتحه ثم سجّل الدخول."); return; }
      await loadProfile();
      toast("تم تسجيل الدخول");
      location.hash = isSuper() ? "#/admin" : "#/";
    };
  }

  async function pageAdmin(params) {
    setNav("admin");
    if (!state.session) { location.hash = "#/login"; return; }
    if (!isSuper()) { h('<div class="wrap loading">لوحة التحكم متاحة للمشرف العام فقط.</div>'); return; }
    const year = Number(params.get("year") || 1);
    const track = params.get("track") === "non_native" ? "non_native" : "native";
    const subject = subjOf(params);
    loading();
    const { data: units, error } = await sb.from("units")
      .select("id, term, sort_order, title_ar, is_published, lessons(id, code, sort_order, title_ar, title_en, is_published, lesson_resources(id, kind, part, title_ar, url, is_public))")
      .eq("year_group", year).eq("track", track).eq("subject_id", SUBJECTS[subject].id).order("term").order("sort_order");
    if (error) { h(`<div class="wrap loading">${esc(error.message)}</div>`); return; }

    const rows = (units || []).flatMap((u) => (u.lessons || []).sort((a, b) => a.sort_order - b.sort_order).map((l) => ({ u, l })));
    h(`
    <section class="page-head"><div class="wrap" style="padding-bottom:30px">
      <div class="crumbs">لوحة التحكم</div>
      <h1>إدارة المحتوى</h1>
      <p class="muted">أضف شرائح الدروس وأوراق العمل والفيديوهات بروابطها (Google Drive أو OneDrive أو YouTube)، وتحكّم في نشر الدروس.</p>
    </div></section>
    <section class="section" style="padding-top:34px"><div class="wrap">
      <form class="admin-filters" id="filters">
        <div class="field"><label for="fs">المادة</label><select id="fs">${Object.keys(SUBJECTS).map((k) => `<option value="${k}" ${k === subject ? "selected" : ""}>${SUBJECTS[k].name}</option>`).join("")}</select></div>
        <div class="field"><label for="fy">الصف</label><select id="fy">${Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}" ${i + 1 === year ? "selected" : ""}>Grade ${i + 1}</option>`).join("")}</select></div>
        <div class="field"><label for="ft">المسار</label><select id="ft"><option value="native" ${track === "native" ? "selected" : ""}>${TRACKS.native}</option><option value="non_native" ${track === "non_native" ? "selected" : ""}>${TRACKS.non_native}</option></select></div>
        <button class="btn btn-ghost" type="submit">عرض</button>
      </form>
      ${rows.length ? `<div class="table-wrap"><table class="admin-table">
        <thead><tr><th>الفصل</th><th>الدرس</th><th>المواد</th><th>منشور</th><th></th></tr></thead>
        <tbody>${rows.map(({ u, l }) => `
          <tr>
            <td>${u.term}</td>
            <td><a href="#/lesson/${esc(l.code)}">${esc(l.title_ar)}</a><br><span class="code">${esc(l.code)}</span></td>
            <td>${(l.lesson_resources || []).map((r) => `<div>${KIND[r.kind]}${r.part ? " ج" + r.part : ""}: <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title_ar)}</a>${r.is_public ? "" : ' <span class="muted">(للمسجلين)</span>'} <button class="btn btn-ghost btn-small" data-del="${r.id}">حذف</button></div>`).join("") || '<span class="muted">لا شيء بعد</span>'}</td>
            <td><label class="check"><input type="checkbox" data-pub="${l.id}" ${l.is_published ? "checked" : ""}> منشور</label></td>
            <td><button class="btn btn-primary btn-small" data-add="${l.id}" data-title="${esc(l.title_ar)}">إضافة مادة</button></td>
          </tr>`).join("")}</tbody></table></div>`
        : '<div class="empty"><strong>لا توجد دروس لـ${SUBJECTS[subject].name} في هذا الصف والمسار بعد</strong>أرسل الكتاب ليُوزَّع منهجه.</div>'}
    </div></section>
    <dialog id="resDialog">
      <form id="resForm" method="dialog">
        <h2 style="font-size:1.3rem" id="resTitle">إضافة مادة</h2>
        <div class="field"><label for="rk">النوع</label><select id="rk">
          ${Object.keys(KIND).map((k) => `<option value="${k}">${KIND[k]}</option>`).join("")}</select></div>
        <div class="field"><label for="rp">الجزء</label><select id="rp"><option value="">الدرس كله</option><option value="1">الجزء الأول</option><option value="2">الجزء الثاني</option></select></div>
        <div class="field"><label for="rt">العنوان</label><input id="rt" required></div>
        <div class="field"><label for="ru">الرابط</label><input id="ru" type="url" dir="ltr" required placeholder="https://"></div>
        <label class="check" style="margin-bottom:16px"><input type="checkbox" id="rpub"> متاحة للزوار دون تسجيل دخول</label>
        <p class="form-error" id="rerr"></p>
        <div class="dialog-actions"><button class="btn btn-primary" id="rsave" value="save">حفظ المادة</button><button class="btn btn-ghost" value="cancel" formnovalidate>إلغاء</button></div>
      </form>
    </dialog>`);

    document.getElementById("filters").onsubmit = (e) => {
      e.preventDefault();
      location.hash = `#/admin?subject=${document.getElementById("fs").value}&year=${document.getElementById("fy").value}&track=${document.getElementById("ft").value}`;
    };
    main.querySelectorAll("[data-pub]").forEach((cb) => cb.addEventListener("change", async () => {
      const { error: e } = await sb.from("lessons").update({ is_published: cb.checked }).eq("id", cb.dataset.pub);
      if (e) { cb.checked = !cb.checked; toast("تعذّر الحفظ: " + e.message); } else toast(cb.checked ? "نُشر الدرس" : "أُخفي الدرس");
    }));
    main.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", async () => {
      if (!confirm("حذف هذه المادة من الدرس؟")) return;
      const { error: e } = await sb.from("lesson_resources").delete().eq("id", b.dataset.del);
      if (e) toast("تعذّر الحذف: " + e.message); else { toast("حُذفت المادة"); pageAdmin(params); }
    }));
    const dlg = document.getElementById("resDialog");
    let current = null;
    main.querySelectorAll("[data-add]").forEach((b) => b.addEventListener("click", () => {
      current = b.dataset.add;
      document.getElementById("resTitle").textContent = "إضافة مادة: " + b.dataset.title;
      document.getElementById("resForm").reset();
      document.getElementById("rerr").textContent = "";
      dlg.showModal();
    }));
    document.getElementById("rsave").addEventListener("click", async (e) => {
      e.preventDefault();
      const title = document.getElementById("rt").value.trim(), url = document.getElementById("ru").value.trim();
      if (!title || !/^https:\/\//.test(url)) { document.getElementById("rerr").textContent = "أدخل عنوانًا ورابطًا يبدأ بـ https://"; return; }
      const part = document.getElementById("rp").value;
      const { error: e2 } = await sb.from("lesson_resources").insert({
        lesson_id: current, kind: document.getElementById("rk").value, part: part ? Number(part) : null,
        title_ar: title, url, is_public: document.getElementById("rpub").checked
      });
      if (e2) { document.getElementById("rerr").textContent = "تعذّر الحفظ: " + e2.message; return; }
      dlg.close(); toast("حُفظت المادة"); pageAdmin(params);
    });
  }

  function pageAbout() {
    setNav("about");
    h(`<section class="page-head"><div class="wrap" style="padding-bottom:34px">
        <div class="crumbs"><a href="#/">الرئيسية</a></div><h1>عن حراء</h1></div></section>
      <section class="section"><div class="wrap prose">
        <p>في غار حراء نزلت أول كلمة من الوحي: «اقرأ». ومن هنا جاء اسم المنصة: مكان يبدأ منه الطالب القراءة والفهم، ثم يصعد درجة بعد درجة.</p>
        <h2>كيف تعمل</h2>
        <p>تضم حراء ثلاث مواد: التربية الإسلامية، واللغة العربية، والدراسات الاجتماعية. كل صف مقسّم على الفصول الدراسية الثلاثة كما في كتب وزارة التربية والتعليم، وكل درس مربوط بنواتج التعلم في الإطار الوطني لمعايير مادته بأرقامها.</p>
        <p>في بداية كل فصل يؤدي الطالب اختبارًا تشخيصيًا، كل سؤال فيه يقيس ناتجًا محددًا. فتظهر خريطة إتقانه: ما أتقنه، وما يقترب منه، وما يحتاج إلى علاج، مع الدرس الذي يعالجه. وفي نهاية الفصل يقاس التقدم بالمقارنة مع نتيجته الأولى.</p>
        <h2>مساران</h2>
        <p>في كل مادة مسار للناطقين بالعربية ومسار لغير الناطقين، بكتاب كل منهما. والمساران يقاسان على نواتج التعلم نفسها.</p>
        <h2>القرآن والسنة</h2>
        <p>الآيات والأحاديث المقررة تُعرض مع مصدرها. ولا يُوسم الحديث بأنه «موثّق» إلا بعد مراجعة لفظه وتخريجه في مصادره.</p>
      </div></section>`);
  }

  /* ---------- router ---------- */
  async function route() {
    const { parts, params } = parseHash();
    const p0 = parts[0] || "";
    try {
      if (p0 === "") return pageHome();
      if (p0 === "grades") return pageGrades(params);
      if (p0 === "year" && /^\d+$/.test(parts[1] || "")) {
        const y = Number(parts[1]);
        if (y >= 1 && y <= 13) return pageYear(y, params);
      }
      if (p0 === "lesson" && parts[1]) return pageLesson(decodeURIComponent(parts[1]));
      if (p0 === "login") return pageLogin();
      if (p0 === "admin") return pageAdmin(params);
      if (p0 === "about") return pageAbout();
      h('<div class="wrap loading">هذه الصفحة غير موجودة. <a href="#/">العودة إلى الرئيسية</a></div>');
    } catch (e) {
      console.error(e);
      h(`<div class="wrap loading">حدث خطأ أثناء التحميل. حدّث الصفحة وحاول مرة أخرى.</div>`);
    }
  }

  window.addEventListener("hashchange", route);
  sb.auth.onAuthStateChange((evt) => { if (evt === "SIGNED_IN" || evt === "SIGNED_OUT") loadProfile(); });
  loadProfile().finally(route);
})();

</script>
</body>
</html>
