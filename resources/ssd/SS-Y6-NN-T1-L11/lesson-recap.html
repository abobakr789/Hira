var SC=[{"h": "<p class=\"k\">Lesson recap · Year 6<\/p><h1>After the Fall of the Roman Empire<\/h1><p class=\"mid\">Unit 3: Perspectives of People through Time · Lesson 1<\/p>", "say": "Lesson recap. After the Fall of the Roman Empire.", "ms": 6000}, {"h": "<p class=\"k\">🎯 Learning goal<\/p><h2 class=\"rv\">I can explain the causes of the fall of the Western Roman Empire.<\/h2>", "say": "Our goal: I can explain the causes of the fall of the Western Roman Empire.", "ms": 7569}, {"h": "<p class=\"k\">📚 Key words<\/p><div class=\"g\"><div class=\"c rv\" style=\"animation-delay:0.4s\"><span style=\"font-size:4cqw\">📅<\/span><b>Common Era (CE)<\/b><span>the years counted from the start of the calendar used today<\/span><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><span style=\"font-size:4cqw\">🗡️<\/span><b>barbarian<\/b><span>the Roman word for people who were not Roman<\/span><\/div><div class=\"c rv\" style=\"animation-delay:2.2s\"><span style=\"font-size:4cqw\">💰<\/span><b>to benefit<\/b><span>to receive something good<\/span><\/div><div class=\"c rv\" style=\"animation-delay:3.1s\"><span style=\"font-size:4cqw\">💥<\/span><b>destruction<\/b><span>the act of destroying something<\/span><\/div><\/div>", "say": "Key words. Common Era (CE): the years counted from the start of the calendar used today. barbarian: the Roman word for people who were not Roman. to benefit: to receive something good. destruction: the act of destroying something.", "ms": 19492}, {"h": "<p class=\"k\">💡 The big idea<\/p><h2>The fall of the Roman Empire<\/h2><p class=\"big rv\">The book says the Roman Empire was the largest empire in the world in the early centuries CE. The <b>Pax Romana<\/b> kept the peace for over two hundred years, but it did not benefit everyone equally. The empire was attacked by the <b>Goths<\/b>, the <b>Huns<\/b> led by Attila, and others. The Goths stormed Rome in <b>410 CE<\/b>, and Attila died in <b>453 CE<\/b>. The Western Roman Empire began to decline.<\/p>", "say": "The fall of the Roman Empire. The book says the Roman Empire was the largest empire in the world in the early centuries CE. The Pax Romana kept the peace for over two hundred years, but it did not benefit everyone equally. The empire was attacked by the Goths, the Huns led by Attila, and others. The Goths stormed Rome in 410 CE, and Attila died in 453 CE. The Western Roman Empire began to decline.", "ms": 32569}, {"h": "<p class=\"k\">✅ Quick check 1<\/p><p class=\"big\">The book says the Roman Empire was the largest empire in the world in the early centuries CE.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True<\/span>", "say": "True or false? The book says the Roman Empire was the largest empire in the world in the early centuries CE.. The answer is true.", "ms": 11723}, {"h": "<p class=\"k\">✅ Quick check 2<\/p><p class=\"big\">The Pax Romana benefited everyone equally.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#B0582F\">False<\/span>", "say": "True or false? The Pax Romana benefited everyone equally.. The answer is false.", "ms": 7876}, {"h": "<p class=\"k\">💭 Think about it<\/p><p class=\"big\">“The Pax Romana did not benefit all of its people equally.”<\/p><p class=\"mid rv\" style=\"animation-delay:1.5s\">Discuss with your partner.<\/p>", "say": "“The Pax Romana did not benefit all of its people equally.” Discuss with your partner.", "ms": 8415}, {"h": "<p class=\"k\">🇦🇪 My national identity<\/p><h2>Learning from the past<\/h2><p class=\"mid rv\">How can this idea help me be a good member of the UAE community?<\/p>", "say": "Think about the UAE. Learning from the past. How can this idea help you be a good member of the community?", "ms": 9953}, {"h": "<p class=\"k\">⭐ I can<\/p><div class=\"g\" style=\"flex-direction:column\"><div class=\"c rv\" style=\"animation-delay:0.5s\"><b style=\"font-size:2.6cqw\">⭐ I can describe Roman rule.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><b style=\"font-size:2.6cqw\">⭐ I can name the attackers.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:2.1s\"><b style=\"font-size:2.6cqw\">⭐ I can link causes and effects.<\/b><\/div><\/div>", "say": "Now I can. I can describe Roman rule. I can name the attackers. I can link causes and effects.", "ms": 9030}, {"h": "<p class=\"k\">🌟 Well done<\/p><h1>Well done, Year 6!<\/h1><p class=\"mid\">The Western Roman Empire declined because of unfair rule, attacks from outside and unhappiness inside, as the book explains.<\/p>", "say": "Well done, Year 6. The Western Roman Empire declined because of unfair rule, attacks from outside and unhappiness inside, as the book explains.", "ms": 12800}];var i=0,tm=null,playing=false,nar=false,gen=0;
