<script>
var SC=[{"h": "<p class=\"k\">Lesson recap · Year 7<\/p><h1>Thinking About Crime<\/h1><p class=\"mid\">Unit 2: Making Good Decisions · Lesson 5<\/p>", "say": "Lesson recap. Thinking About Crime.", "ms": 6000}, {"h": "<p class=\"k\">🎯 Learning goal<\/p><h2 class=\"rv\">I can explain the consequences of crime for criminals and victims.<\/h2>", "say": "Our goal: I can explain the consequences of crime for criminals and victims.", "ms": 7646}, {"h": "<p class=\"k\">📚 Key words<\/p><div class=\"g\"><div class=\"c rv\" style=\"animation-delay:0.4s\"><span style=\"font-size:4cqw\">🚫<\/span><b>irresponsible<\/b><span>not careful about the results of your actions<\/span><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><span style=\"font-size:4cqw\">🕵️<\/span><b>criminal<\/b><span>a person who has committed a crime<\/span><\/div><div class=\"c rv\" style=\"animation-delay:2.2s\"><span style=\"font-size:4cqw\">⚖️<\/span><b>consequence<\/b><span>a result of an action<\/span><\/div><div class=\"c rv\" style=\"animation-delay:3.1s\"><span style=\"font-size:4cqw\">😔<\/span><b>victim<\/b><span>a person harmed by a crime<\/span><\/div><\/div>", "say": "Key words. irresponsible: not careful about the results of your actions. criminal: a person who has committed a crime. consequence: a result of an action. victim: a person harmed by a crime.", "ms": 16415}, {"h": "<p class=\"k\">💡 The big idea<\/p><h2>Thinking about crime<\/h2><p class=\"big rv\">People who commit <b>crimes<\/b> face <b>consequences<\/b> such as arrest, charges and <b>prison<\/b>, and <b>victims<\/b> can suffer for a long time, so support is important. The book also says irresponsible behaviour does not always have to be a crime, and that rules have consequences in school and in society.<\/p>", "say": "Thinking about crime. People who commit crimes face consequences such as arrest, charges and prison, and victims can suffer for a long time, so support is important. The book also says irresponsible behaviour does not always have to be a crime, and that rules have consequences in school and in society.", "ms": 25107}, {"h": "<p class=\"k\">✅ Quick check 1<\/p><p class=\"big\">The two men in the article were arrested for attempted theft, says the book.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True<\/span>", "say": "True or false? The two men in the article were arrested for attempted theft, says the book.. The answer is true.", "ms": 10415}, {"h": "<p class=\"k\">✅ Quick check 2<\/p><p class=\"big\">The book says Austin never wanted to be a painter.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#B0582F\">False<\/span>", "say": "True or false? The book says Austin never wanted to be a painter.. The answer is false.", "ms": 8492}, {"h": "<p class=\"k\">💭 Think about it<\/p><p class=\"big\">“Irresponsible behaviour doesn’t always have to be a crime.”<\/p><p class=\"mid rv\" style=\"animation-delay:1.5s\">Discuss with your partner.<\/p>", "say": "“Irresponsible behaviour doesn’t always have to be a crime.” Discuss with your partner.", "ms": 8492}, {"h": "<p class=\"k\">🇦🇪 My national identity<\/p><h2>Rules and police in the UAE<\/h2><p class=\"mid rv\">How can this idea help me be a good member of the UAE community?<\/p>", "say": "Think about the UAE. Rules and police in the UAE. How can this idea help you be a good member of the community?", "ms": 10338}, {"h": "<p class=\"k\">⭐ I can<\/p><div class=\"g\" style=\"flex-direction:column\"><div class=\"c rv\" style=\"animation-delay:0.5s\"><b style=\"font-size:2.6cqw\">⭐ I can explain consequences.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><b style=\"font-size:2.6cqw\">⭐ I can describe impact on victims.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:2.1s\"><b style=\"font-size:2.6cqw\">⭐ I can explain why we need rules.<\/b><\/div><\/div>", "say": "Now I can. I can explain consequences. I can describe impact on victims. I can explain why we need rules.", "ms": 9876}, {"h": "<p class=\"k\">🌟 Well done<\/p><h1>Well done, Year 7!<\/h1><p class=\"mid\">Crime has consequences for criminals and victims, and rules and support help keep a community safe.<\/p>", "say": "Well done, Year 7. Crime has consequences for criminals and victims, and rules and support help keep a community safe.", "ms": 10876}];var i=0,tm=null,playing=false,nar=false,gen=0;
var $=function(x){return document.getElementById(x)};
function stop(){clearTimeout(tm);try{speechSynthesis.cancel()}catch(e){}}
function show(k){stop();gen++;var g=gen;i=Math.max(0,Math.min(SC.length-1,k));var s=SC[i];$('sc').innerHTML=s.h;$('cap').textContent=s.say;
 $('bar').style.width=((i+1)/SC.length*100)+'%';$('ct').textContent=(i+1)+' / '+SC.length;if(!playing)return;
 var adv=function(){if(g!==gen)return;if(i<SC.length-1)show(i+1);else{playing=false;$('bt').innerHTML='&#9654; Replay';}};
 if(nar&&window.speechSynthesis){var u=new SpeechSynthesisUtterance(s.say);u.lang='en-GB';u.rate=.95;var d=false;
  u.onend=function(){if(d)return;d=true;tm=setTimeout(adv,900)};u.onerror=u.onend;speechSynthesis.speak(u);tm=setTimeout(function(){if(d)return;d=true;adv()},s.ms*2+4000);}
 else tm=setTimeout(adv,s.ms);}
