ent forms.", "ms": 18000}, {"h": "<p class=\"k\">✅ Quick check 1</p><p class=\"big\">The book says the family is the pillar of society.</p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True</span>", "say": "True or false? The book says the family is the pillar of society.. The answer is true.", "ms": 8415}, {"h": "<p class=\"k\">✅ Quick check 2</p><p class=\"big\">The UAE acceded to the UN Convention on the Rights of the Child.</p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True</span>", "say": "True or false? The UAE acceded to the UN Convention on the Rights of the Child.. The answer is true.", "ms": 9184}, {"h": "<p class=\"k\">💭 Think about it</p><p class=\"big\">“The family is the pillar of society.”</p><p class=\"mid rv\" style=\"animation-delay:1.5s\">Discuss with your partner.</p>", "say": "“The family is the pillar of society.” Discuss with your partner.", "ms": 6800}, {"h": "<p class=\"k\">🇦🇪 My national identity</p><h2>Protecting children in the UAE</h2><p class=\"mid rv\">How can this idea help me be a good member of the UAE community?</p>", "say": "Think about the UAE. Protecting children in the UAE. How can this idea help you be a good member of the community?", "ms": 10569}, {"h": "<p class=\"k\">⭐ I can</p><div class=\"g\" style=\"flex-direction:column\"><div class=\"c rv\" style=\"animation-delay:0.5s\"><b style=\"font-size:2.6cqw\">⭐ I can describe good parenting.</b></div><div class=\"c rv\" style=\"animation-delay:1.3s\"><b style=\"font-size:2.6cqw\">⭐ I can name child rights.</b></div><div class=\"c rv\" style=\"animation-delay:2.1s\"><b style=\"font-size:2.6cqw\">⭐ I can name family types.</b></div></div>", "say": "Now I can. I can describe good parenting. I can name child rights. I can name family types.", "ms": 8800}, {"h": "<p class=\"k\">🌟 Well done</p><h1>Well done, Year 7!</h1><p class=\"mid\">Parents have duties, children have rights, and the UAE protects children through law, as the book explains.</p>", "say": "Well done, Year 7. Parents have duties, children have rights, and the UAE protects children through law, as the book explains.", "ms": 11492}];var i=0,tm=null,playing=false,nar=false,gen=0;
