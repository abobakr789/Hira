<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson recap · We Are All Different</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#12202E;font-family:'Cairo','Thmanyah Text',Tahoma,sans-serif}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
#st{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;background:linear-gradient(180deg,#E8E0FA 0%,#F8F5FF 62%,#E6DDF5 100%);overflow:hidden;color:#1F2A3C;container-type:inline-size}

#st:after{content:"";position:absolute;right:-8%;bottom:-36%;width:62%;height:55%;border-radius:50%;background:#8F7BD0;opacity:.3}

.k{font-size:2.1cqw;font-weight:800;color:#5B3FA8;background:#fff;border:.2cqw solid #5B3FA8;border-radius:3cqw;padding:.3cqw 1.8cqw;align-self:flex-start}
h1{font-size:6.4cqw;line-height:1.1;margin:0;font-weight:800}h2{font-size:4.8cqw;margin:0;font-weight:800;line-height:1.15}
.big{font-size:3.4cqw;font-weight:700;line-height:1.35}.mid{font-size:2.6cqw;font-weight:600;line-height:1.4;color:#3E4A5C}
.em{font-size:9cqw;line-height:1}
.g{display:flex;gap:2cqw;flex-wrap:wrap}.c{background:#fff;border:.25cqw solid #5B3FA8;border-radius:2cqw;padding:1.6cqw 2cqw;box-shadow:0 .8cqw 2cqw rgba(31,42,60,.1)}
.c b{display:block;font-size:3cqw;color:#8A5A00}.c span{font-size:2.1cqw;color:#3E4A5C;font-weight:600}
.rv{opacity:0;transform:translateY(2cqw);animation:in .7s ease forwards}

.ans{display:inline-block;font-size:3.6cqw;font-weight:800;border-radius:3cqw;padding:.6cqw 2.6cqw;color:#fff}

</style></head><body><div id="app"><div id="st"><img id="logo" src="../../../art/brand/hiraa-lockup-light.svg" alt="Hiraa"><div id="sc"></div><div id="cap"></div><div id="bar"></div>
<div id="ov"><button id="go">&#9654; Play lesson recap</button></div></div>
<div id="ctl"><button id="bp">&#9198;</button><button id="bt">&#9208; Pause</button><button id="bn">&#9197;</button><button id="bv">&#128266; Narration: off</button><span id="ct"></span></div></div>
<script>
var SC=[{"h": "<p class=\"k\">Lesson recap · Year 2<\/p><h1>We Are All Different<\/h1><p class=\"mid\">Unit 1: Respect for Difference · Lesson 1<\/p>", "say": "Lesson recap. We Are All Different.", "ms": 6000}, {"h": "<p class=\"k\">🎯 Learning goal<\/p><h2 class=\"rv\">I can say how we are similar and different, and why we welcome everyone.<\/h2>", "say": "Our goal: I can say how we are similar and different, and why we welcome everyone.", "ms": 8107}, {"h": "<p class=\"k\">📚 Key words<\/p><div class=\"g\"><div class=\"c rv\" style=\"animation-delay:0.4s\"><span style=\"font-size:4cqw\">🤝<\/span><b>similar<\/b><span>almost the same<\/span><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><span style=\"font-size:4cqw\">🌈<\/span><b>different<\/b><span>not the same<\/span><\/div><div class=\"c rv\" style=\"animation-delay:2.2s\"><span style=\"font-size:4cqw\">👋<\/span><b>welcome<\/b><span>to be kind to someone who comes to join us<\/span><\/div><div class=\"c rv\" style=\"animation-delay:3.1s\"><span style=\"font-size:4cqw\">🐕<\/span><b>strange<\/b><span>new and not like what we know<\/span><\/div><\/div>", "say": "Key words. similar: almost the same. different: not the same. welcome: to be kind to someone who comes to join us. strange: new and not like what we know.", "ms": 13646}, {"h": "<p class=\"k\">💡 The big idea<\/p><h2>Similar and different<\/h2><p class=\"big rv\"><b>Similar<\/b> means almost the same. <b>Different<\/b> means not the same. People are similar in some ways and different in other ways. We <b>welcome<\/b> everyone, because our place is for everyone.<\/p>", "say": "Similar and different. Similar means almost the same. Different means not the same. People are similar in some ways and different in other ways. We welcome everyone, because our place is for everyone.", "ms": 17184}, {"h": "<p class=\"k\">✅ Quick check 1<\/p><p class=\"big\">There are lots of different animals on Salem’s farm.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True<\/span>", "say": "True or false? There are lots of different animals on Salem’s farm.. The answer is true.", "ms": 8569}, {"h": "<p class=\"k\">✅ Quick check 2<\/p><p class=\"big\">The sheep say, “You are welcome here!” to the dog.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#B0582F\">False<\/span>", "say": "True or false? The sheep say, “You are welcome here!” to the dog.. The answer is false.", "ms": 8492}, {"h": "<p class=\"k\">💭 Think about it<\/p><p class=\"big\">Why is it good to be different?<\/p><p class=\"mid rv\" style=\"animation-delay:1.5s\">Talk to your classmates.<\/p>", "say": "Why is it good to be different? Talk to your classmates.", "ms": 6107}, {"h": "<p class=\"k\">🇦🇪 My national identity<\/p><h2>Everyone is welcome in the UAE<\/h2><p class=\"mid rv\">How can this idea help me be a good member of the UAE community?<\/p>", "say": "Think about the UAE. Everyone is welcome in the UAE. How can this idea help you be a good member of the community?", "ms": 10569}, {"h": "<p class=\"k\">⭐ I can<\/p><div class=\"g\" style=\"flex-direction:column\"><div class=\"c rv\" style=\"animation-delay:0.5s\"><b style=\"font-size:2.6cqw\">⭐ I can say how we are similar.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><b style=\"font-size:2.6cqw\">⭐ I can say how we are different.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:2.1s\"><b style=\"font-size:2.6cqw\">⭐ I can welcome everyone.<\/b><\/div><\/div>", "say": "Now I can. I can say how we are similar. I can say how we are different. I can welcome everyone.", "ms": 9184}, {"h": "<p class=\"k\">🌟 Well done<\/p><h1>Well done, Year 2!<\/h1><p class=\"mid\">We are similar and different. We welcome everyone.<\/p>", "say": "Well done, Year 2. We are similar and different. We welcome everyone.", "ms": 7107}];var i=0,tm=null,playing=false,nar=false,gen=0;
var $=function(x){return document.getElementById(x)};
function stop(){clearTimeout(tm);try{speechSynthesis.cancel()}catch(e){}}
function show(k){stop();gen++;var g=gen;i=Math.max(0,Math.min(SC.length-1,k));var s=SC[i];$('sc').innerHTML=s.h;$('cap').textContent=s.say;
 $('bar').style.width=((i+1)/SC.length*100)+'%';$('ct').textContent=(i+1)+' / '+SC.length;if(!playing)return;
 var adv=function(){if(g!==gen)return;if(i<SC.length-1)show(i+1);else{playing=false;$('bt').innerHTML='&#9654; Replay';}};
 if(nar&&window.speechSynthesis){var u=new SpeechSynthesisUtterance(s.say);u.lang='en-GB';u.rate=.95;var d=false;
  u.onend=function(){if(d)return;d=true;tm=setTimeout(adv,900)};u.onerror=u.onend;speechSynthesis.speak(u);tm=setTimeout(function(){if(d)return;d=true;adv()},s.ms*2+4000);}
 else tm=setTimeout(adv,s.ms);}
$('go').onclick=function(){$('ov').style.display='none';playing=true;$('bt').innerHTML='&#9208; Pause';show(0)};
$('bt').onclick=function(){if(!playing){playing=true;$('bt').innerHTML='&#9208; Pause';show(i>=SC.length-1&&$('bt').textContent.indexOf('Replay')>-1?0:i)}else{playing=false;stop();$('bt').innerHTML='&#9654; Play'}};
$('bn').onclick=function(){show(i+1)};$('bp').onclick=function(){show(i-1)};
$('bv').onclick=function(){nar=!nar;this.classList.toggle('on',nar);this.innerHTML=nar?'&#128266; Narration: on':'&#128266; Narration: off';if(playing)show(i)};
show(0);
</script></body></html>
