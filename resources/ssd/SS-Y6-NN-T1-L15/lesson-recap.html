what helps today.<\/b><\/div><\/div>", "say": "Now I can. I can explain the famine. I can explain the plague. I can explain what helps today.", "ms": 9030}, {"h": "<p class=\"k\">🌟 Well done<\/p><h1>Well done, Year 6!<\/h1><p class=\"mid\">Famine and plague were crises of the Late Middle Ages, and the book shows how climate, hygiene and living conditions mattered.<\/p>", "say": "Well done, Year 6. Famine and plague were crises of the Late Middle Ages, and the book shows how climate, hygiene and living conditions mattered.", "ms": 12953}];var i=0,tm=null,playing=false,nar=false,gen=0;
