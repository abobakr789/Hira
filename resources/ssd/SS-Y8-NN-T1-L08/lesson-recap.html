<script>
var SC=[{"h": "<p class=\"k\">Lesson recap · Year 8<\/p><h1>Can I See Beyond Appearances?<\/h1><p class=\"mid\">Unit 2: Valuing Diversity · Lesson 3<\/p>", "say": "Lesson recap. Can I See Beyond Appearances?.", "ms": 6000}, {"h": "<p class=\"k\">🎯 Learning goal<\/p><h2 class=\"rv\">I can explain bias and discrimination and how to see beyond appearances.<\/h2>", "say": "Our goal: I can explain bias and discrimination and how to see beyond appearances.", "ms": 8107}, {"h": "<p class=\"k\">📚 Key words<\/p><div class=\"g\"><div class=\"c rv\" style=\"animation-delay:0.4s\"><span style=\"font-size:4cqw\">🏷️<\/span><b>stereotype<\/b><span>a fixed idea about a group of people<\/span><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><span style=\"font-size:4cqw\">⚠️<\/span><b>bias<\/b><span>liking or disliking people unfairly<\/span><\/div><div class=\"c rv\" style=\"animation-delay:2.2s\"><span style=\"font-size:4cqw\">🚫<\/span><b>prejudice<\/b><span>judging people unfairly before knowing them<\/span><\/div><div class=\"c rv\" style=\"animation-delay:3.1s\"><span style=\"font-size:4cqw\">⚖️<\/span><b>discrimination<\/b><span>treating people unfairly because of who they are<\/span><\/div><\/div>", "say": "Key words. stereotype: a fixed idea about a group of people. bias: liking or disliking people unfairly. prejudice: judging people unfairly before knowing them. discrimination: treating people unfairly because of who they are.", "ms": 19107}, {"h": "<p class=\"k\">💡 The big idea<\/p><h2>Can I see beyond appearances?<\/h2><p class=\"big rv\">The book explains <b>bias<\/b>, <b>prejudice<\/b> and <b>discrimination<\/b>, shows how travel can help us tell prejudice from reality, and asks the class to write a <b>charter<\/b> of tolerant actions. Quotes from H.H. Sheikh Mohammed bin Rashid and Nelson Mandela call for tolerance in practice.<\/p>", "say": "Can I see beyond appearances?. The book explains bias, prejudice and discrimination, shows how travel can help us tell prejudice from reality, and asks the class to write a charter of tolerant actions. Quotes from H.H. Sheikh Mohammed bin Rashid and Nelson Mandela call for tolerance in practice.", "ms": 24569}, {"h": "<p class=\"k\">✅ Quick check 1<\/p><p class=\"big\">The book says bias, discrimination and prejudice can be destructive.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True<\/span>", "say": "True or false? The book says bias, discrimination and prejudice can be destructive.. The answer is true.", "ms": 9800}, {"h": "<p class=\"k\">✅ Quick check 2<\/p><p class=\"big\">The book says travel never changes our views.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#B0582F\">False<\/span>", "say": "True or false? The book says travel never changes our views.. The answer is false.", "ms": 8107}, {"h": "<p class=\"k\">💭 Think about it<\/p><p class=\"big\">“Don’t judge until you know them!”<\/p><p class=\"mid rv\" style=\"animation-delay:1.5s\">Discuss with your partner.<\/p>", "say": "“Don’t judge until you know them!” Discuss with your partner.", "ms": 6492}, {"h": "<p class=\"k\">🇦🇪 My national identity<\/p><h2>Tolerance in the UAE<\/h2><p class=\"mid rv\">How can this idea help me be a good member of the UAE community?<\/p>", "say": "Think about the UAE. Tolerance in the UAE. How can this idea help you be a good member of the community?", "ms": 9800}, {"h": "<p class=\"k\">⭐ I can<\/p><div class=\"g\" style=\"flex-direction:column\"><div class=\"c rv\" style=\"animation-delay:0.5s\"><b style=\"font-size:2.6cqw\">⭐ I can explain bias and stereotype.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><b style=\"font-size:2.6cqw\">⭐ I can explain overcoming prejudice.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:2.1s\"><b style=\"font-size:2.6cqw\">⭐ I can suggest tolerant actions.<\/b><\/div><\/div>", "say": "Now I can. I can explain bias and stereotype. I can explain overcoming prejudice. I can suggest tolerant actions.", "ms": 10492}, {"h": "<p class=\"k\">🌟 Well done<\/p><h1>Well done, Year 8!<\/h1><p class=\"mid\">We can learn to see beyond appearances and build a class where everyone is respected.<\/p>", "say": "Well done, Year 8. We can learn to see beyond appearances and build a class where everyone is respected.", "ms": 9800}];var i=0,tm=null,playing=false,nar=false,gen=0;
