d family meetings help families feel they belong. Students need to feel safe and to have trusted adults at school. Clubs and teams can increase a sense of belonging.", "ms": 26492}, {"h": "<p class=\"k\">✅ Quick check 1<\/p><p class=\"big\">Mohammed asked his friend to help him.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True<\/span>", "say": "True or false? Mohammed asked his friend to help him.. The answer is true.", "ms": 7492}, {"h": "<p class=\"k\">✅ Quick check 2<\/p><p class=\"big\">Colin plays with everyone at break.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#B0582F\">False<\/span>", "say": "True or false? Colin plays with everyone at break.. The answer is false.", "ms": 7338}, {"h": "<p class=\"k\">💭 Think about it<\/p><p class=\"big\">How can we help each other grow and develop positively?<\/p><p class=\"mid rv\" style=\"animation-delay:1.5s\">Discuss with your partner.<\/p>", "say": "How can we help each other grow and develop positively? Discuss with your partner.", "ms": 8107}, {"h": "<p class=\"k\">🇦🇪 My national identity<\/p><h2>Family and community in the UAE<\/h2><p class=\"mid rv\">How can this idea help me be a good member of the UAE community?<\/p>", "say": "Think about the UAE. Family and community in the UAE. How can this idea help you be a good member of the community?", "ms": 10646}, {"h": "<p class=\"k\">⭐ I can<\/p><div class=\"g\" style=\"flex-direction:column\"><div class=\"c rv\" style=\"animation-delay:0.5s\"><b style=\"font-size:2.6cqw\">⭐ I can say what positive relationships are.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><b style=\"font-size:2.6cqw\">⭐ I can help a friend with a problem.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:2.1s\"><b style=\"font-size:2.6cqw\">⭐ I can explain why family matters.<\/b><\/div><\/div>", "say": "Now I can. I can say what positive relationships are. I can help a friend with a problem. I can explain why family matters.", "ms": 11261}, {"h": "<p class=\"k\">🌟 Well done<\/p><h1>Well done, Year 4!<\/h1><p class=\"mid\">Helping each other makes everyone happier and stronger.<\/p>", "say": "Well done, Year 4. Helping each other makes everyone happier and stronger.", "ms": 7492}];var i=0,tm=null,playing=false,nar=false,gen=0;

 if(nar&&window.speechSynthesis){var u=new SpeechSynthesisUtterance(s.say);u.lang='en-GB';u.rate=.95;var d=false;
  u.onend=function(){if(d)return;d=true;tm=setTimeout(adv,900)};u.onerror=u.onend;speechSynthesis.speak(u);tm=setTimeout(function(){if(d)return;d=true;adv()},s.ms*2+4000);}
 else tm=setTimeout(adv,s.ms);}
