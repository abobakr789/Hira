ar lasted from 1159 to 1259 CE, mainly between England and France. The Plantagenets ruled most of England and the Capets ruled France. In 1215 King John signed the Magna Carta, a document that protected the rights of wealthy landowners. The Treaty of Paris ended the war on December 4, 1259.", "ms": 29569}, {"h": "<p class=\"k\">✅ Quick check 1<\/p><p class=\"big\">The book says the First Hundred Years’ War began in 1159 CE.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True<\/span>", "say": "True or false? The book says the First Hundred Years’ War began in 1159 CE.. The answer is true.", "ms": 9184}, {"h": "<p class=\"k\">✅ Quick check 2<\/p><p class=\"big\">Richard’s nickname was Richard the Lionheart.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True<\/span>", "say": "True or false? Richard’s nickname was Richard the Lionheart.. The answer is true.", "ms": 8030}, {"h": "<p class=\"k\">💭 Think about it<\/p><p class=\"big\">“What can we learn from the past?”<\/p><p class=\"mid rv\" style=\"animation-delay:1.5s\">Discuss with your partner.<\/p>", "say": "“What can we learn from the past?” Discuss with your partner.", "ms": 6492}, {"h": "<p class=\"k\">🇦🇪 My national identity<\/p><h2>Learning from the past<\/h2><p class=\"mid rv\">How can this idea help me be a good member of the UAE community?<\/p>", "say": "Think about the UAE. Learning from the past. How can this idea help you be a good member of the community?", "ms": 9953}, {"h": "<p class=\"k\">⭐ I can<\/p><div class=\"g\" style=\"flex-direction:column\"><div class=\"c rv\" style=\"animation-delay:0.5s\"><b style=\"font-size:2.6cqw\">⭐ I can name the kings.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><b style=\"font-size:2.6cqw\">⭐ I can explain the Magna Carta.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:2.1s\"><b style=\"font-size:2.6cqw\">⭐ I can give the dates.<\/b><\/div><\/div>", "say": "Now I can. I can name the kings. I can explain the Magna Carta. I can give the dates.", "ms": 8338}, {"h": "<p class=\"k\">🌟 Well done<\/p><h1>Well done, Year 6!<\/h1><p class=\"mid\">The First Hundred Years’ War and the Magna Carta show how power, land and agreements shaped history, as the book explains.<\/p>", "say": "Well done, Year 6. The First Hundred Years’ War and the Magna Carta show how power, land and agreements shaped history, as the book explains.", "ms": 12646}];var i=0,tm=null,playing=false,nar=false,gen=0;
