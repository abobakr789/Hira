<script>
var SC=[{"h": "<p class=\"k\">Lesson recap · Year 4<\/p><h1>Growth and Development in Suitable Conditions<\/h1><p class=\"mid\">Unit 2: Growing up and Well-being · Lesson 2<\/p>", "say": "Lesson recap. Growth and Development in Suitable Conditions.", "ms": 6415}, {"h": "<p class=\"k\">🎯 Learning goal<\/p><h2 class=\"rv\">I can explain why everyone needs suitable conditions to grow and learn.<\/h2>", "say": "Our goal: I can explain why everyone needs suitable conditions to grow and learn.", "ms": 8030}, {"h": "<p class=\"k\">📚 Key words<\/p><div class=\"g\"><div class=\"c rv\" style=\"animation-delay:0.4s\"><span style=\"font-size:4cqw\">🏠<\/span><b>right to housing<\/b><span>the right of everyone to a suitable home<\/span><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><span style=\"font-size:4cqw\">🤝<\/span><b>social care<\/b><span>help given to people who need support<\/span><\/div><div class=\"c rv\" style=\"animation-delay:2.2s\"><span style=\"font-size:4cqw\">📚<\/span><b>right to education<\/b><span>the right of everyone to go to school and learn<\/span><\/div><div class=\"c rv\" style=\"animation-delay:3.1s\"><span style=\"font-size:4cqw\">💪<\/span><b>welfare<\/b><span>being healthy, safe and well<\/span><\/div><\/div>", "say": "Key words. right to housing: the right of everyone to a suitable home. social care: help given to people who need support. right to education: the right of everyone to go to school and learn. welfare: being healthy, safe and well.", "ms": 19492}, {"h": "<p class=\"k\">💡 The big idea<\/p><h2>Growth and development in suitable conditions<\/h2><p class=\"big rv\">Everyone has the <b>right to housing<\/b> and the <b>right to education<\/b>. <b>Social care<\/b> is help for people who need support. In the UAE, the Ministry of Social Affairs is developing social welfare and rehabilitation programmes, and public places and buses are being designed with people of determination in mind.<\/p>", "say": "Growth and development in suitable conditions. Everyone has the right to housing and the right to education. Social care is help for people who need support. In the UAE, the Ministry of Social Affairs is developing social welfare and rehabilitation programmes, and public places and buses are being designed with people of determination in mind.", "ms": 28338}, {"h": "<p class=\"k\">✅ Quick check 1<\/p><p class=\"big\">Mona’s family left their home because they could not pay the rent.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True<\/span>", "say": "True or false? Mona’s family left their home because they could not pay the rent.. The answer is true.", "ms": 9646}, {"h": "<p class=\"k\">✅ Quick check 2<\/p><p class=\"big\">The municipality workers visit homes of people of determination.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True<\/span>", "say": "True or false? The municipality workers visit homes of people of determination.. The answer is true.", "ms": 9492}, {"h": "<p class=\"k\">💭 Think about it<\/p><p class=\"big\">What do all children need to grow and learn well?<\/p><p class=\"mid rv\" style=\"animation-delay:1.5s\">Discuss with your partner.<\/p>", "say": "What do all children need to grow and learn well? Discuss with your partner.", "ms": 7646}, {"h": "<p class=\"k\">🇦🇪 My national identity<\/p><h2>Care in the UAE<\/h2><p class=\"mid rv\">How can this idea help me be a good member of the UAE community?<\/p>", "say": "Think about the UAE. Care in the UAE. How can this idea help you be a good member of the community?", "ms": 9415}, {"h": "<p class=\"k\">⭐ I can<\/p><div class=\"g\" style=\"flex-direction:column\"><div class=\"c rv\" style=\"animation-delay:0.5s\"><b style=\"font-size:2.6cqw\">⭐ I can say why home and school matter.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><b style=\"font-size:2.6cqw\">⭐ I can describe UAE services.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:2.1s\"><b style=\"font-size:2.6cqw\">⭐ I can explain bus safety.<\/b><\/div><\/div>", "say": "Now I can. I can say why home and school matter. I can describe UAE services. I can explain bus safety.", "ms": 9723}, {"h": "<p class=\"k\">🌟 Well done<\/p><h1>Well done, Year 4!<\/h1><p class=\"mid\">Everyone deserves suitable conditions to grow and learn.<\/p>", "say": "Well done, Year 4. Everyone deserves suitable conditions to grow and learn.", "ms": 7569}];var i=0,tm=null,playing=false,nar=false,gen=0;

function show(k){stop();gen++;var g=gen;i=Math.max(0,Math.min(SC.length-1,k));var s=SC[i];$('sc').innerHTML=s.h;$('cap').textContent=s.say;

 else tm=setTimeout(adv,s.ms);}
