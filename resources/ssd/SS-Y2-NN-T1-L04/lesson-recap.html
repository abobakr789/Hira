<style>

<script>
var SC=[{"h": "<p class=\"k\">Lesson recap · Year 2<\/p><h1>Helping Others Feel Good<\/h1><p class=\"mid\">Unit 1: Respect for Difference · Lesson 4<\/p>", "say": "Lesson recap. Helping Others Feel Good.", "ms": 6000}, {"h": "<p class=\"k\">🎯 Learning goal<\/p><h2 class=\"rv\">I can notice how others feel and help them feel good.<\/h2>", "say": "Our goal: I can notice how others feel and help them feel good.", "ms": 6646}, {"h": "<p class=\"k\">📚 Key words<\/p><div class=\"g\"><div class=\"c rv\" style=\"animation-delay:0.4s\"><span style=\"font-size:4cqw\">😠<\/span><b>angry<\/b><span>feeling very upset<\/span><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><span style=\"font-size:4cqw\">😨<\/span><b>scared<\/b><span>feeling afraid<\/span><\/div><div class=\"c rv\" style=\"animation-delay:2.2s\"><span style=\"font-size:4cqw\">😳<\/span><b>shy<\/b><span>feeling nervous with other people<\/span><\/div><div class=\"c rv\" style=\"animation-delay:3.1s\"><span style=\"font-size:4cqw\">😞<\/span><b>sad<\/b><span>feeling unhappy<\/span><\/div><\/div>", "say": "Key words. angry: feeling very upset. scared: feeling afraid. shy: feeling nervous with other people. sad: feeling unhappy.", "ms": 11261}, {"h": "<p class=\"k\">💡 The big idea<\/p><h2>Helping others feel good<\/h2><p class=\"big rv\">People can feel <b>angry<\/b>, <b>sad<\/b>, <b>scared<\/b>, <b>shy<\/b>, <b>bored<\/b>, <b>happy<\/b>, <b>confused<\/b> or <b>surprised<\/b>. We can notice how others feel. A simple kind act, like inviting a friend to play, can help someone feel good.<\/p>", "say": "Helping others feel good. People can feel angry, sad, scared, shy, bored, happy, confused or surprised. We can notice how others feel. A simple kind act, like inviting a friend to play, can help someone feel good.", "ms": 18184}, {"h": "<p class=\"k\">✅ Quick check 1<\/p><p class=\"big\">Nour looks angry, worried and sad when she comes home.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True<\/span>", "say": "True or false? Nour looks angry, worried and sad when she comes home.. The answer is true.", "ms": 8723}, {"h": "<p class=\"k\">✅ Quick check 2<\/p><p class=\"big\">Nour’s friends say yes when she asks to start the game again.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#B0582F\">False<\/span>", "say": "True or false? Nour’s friends say yes when she asks to start the game again.. The answer is false.", "ms": 9338}, {"h": "<p class=\"k\">💭 Think about it<\/p><p class=\"big\">How can I help someone feel good?<\/p><p class=\"mid rv\" style=\"animation-delay:1.5s\">Talk to your classmates.<\/p>", "say": "How can I help someone feel good? Talk to your classmates.", "ms": 6261}, {"h": "<p class=\"k\">🇦🇪 My national identity<\/p><h2>Caring in the UAE<\/h2><p class=\"mid rv\">How can this idea help me be a good member of the UAE community?<\/p>", "say": "Think about the UAE. Caring in the UAE. How can this idea help you be a good member of the community?", "ms": 9569}, {"h": "<p class=\"k\">⭐ I can<\/p><div class=\"g\" style=\"flex-direction:column\"><div class=\"c rv\" style=\"animation-delay:0.5s\"><b style=\"font-size:2.6cqw\">⭐ I can name feelings.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><b style=\"font-size:2.6cqw\">⭐ I can say why people feel this way.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:2.1s\"><b style=\"font-size:2.6cqw\">⭐ I can help a friend feel good.<\/b><\/div><\/div>", "say": "Now I can. I can name feelings. I can say why people feel this way. I can help a friend feel good.", "ms": 9338}, {"h": "<p class=\"k\">🌟 Well done<\/p><h1>Well done, Year 2!<\/h1><p class=\"mid\">I can notice how others feel and help them feel good with a simple kind act.<\/p>", "say": "Well done, Year 2. I can notice how others feel and help them feel good with a simple kind act.", "ms": 9107}];var i=0,tm=null,playing=false,nar=false,gen=0;
var $=function(x){return document.getElementById(x)};
function stop(){clearTimeout(tm);try{speechSynthesis.cancel()}catch(e){}}
function show(k){stop();gen++;var g=gen;i=Math.max(0,Math.min(SC.length-1,k));var s=SC[i];$('sc').innerHTML=s.h;$('cap').textContent=s.say;
 $('bar').style.width=((i+1)/SC.length*100)+'%';$('ct').textContent=(i+1)+' / '+SC.length;if(!playing)return;
 var adv=function(){if(g!==gen)return;if(i<SC.length-1)show(i+1);else{playing=false;$('bt').innerHTML='&#9654; Replay';}};
 if(nar&&window.speechSynthesis){var u=new SpeechSynthesisUtterance(s.say);u.lang='en-GB';u.rate=.95;var d=false;
  u.onend=function(){if(d)return;d=true;tm=setTimeout(adv,900)};u.onerror=u.onend;speechSynthesis.speak(u);tm=setTimeout(function(){if(d)return;d=true;adv()},s.ms*2+4000);}
 else tm=setTimeout(adv,s.ms);}
$('go').onclick=function(){$('ov').style.display='none';playing=true;$('bt').innerHTML='&#9208; Pause';show(0)};
$('bt').onclick=function(){if(!playing){playing=true;$('bt').innerHTML='&#9208; Pause';show(i>=SC.length-1&&$('bt').textContent.indexOf('Replay')>-1?0:i)}else{playing=false;stop();$('bt').innerHTML='&#9654; Play'}};
$('bn').onclick=function(){show(i+1)};$('bp').onclick=function(){show(i-1)};
$('bv').onclick=function(){nar=!nar;this.classList.toggle('on',nar);this.innerHTML=nar?'&#128266; Narration: on':'&#128266; Narration: off';if(playing)show(i)};
show(0);
</script></body></html>
