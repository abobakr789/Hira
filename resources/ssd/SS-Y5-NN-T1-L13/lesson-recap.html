s. Mesopotamia means “the land between rivers”. The Sumerians are believed to be the first farmers. Domestication of animals gave food and help with farming. The Indus Valley civilization also grew up around a river.", "ms": 24492}, {"h": "<p class=\"k\">✅ Quick check 1<\/p><p class=\"big\">Mesopotamia means “the land between rivers”.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True<\/span>", "say": "True or false? Mesopotamia means “the land between rivers”.. The answer is true.", "ms": 7953}, {"h": "<p class=\"k\">✅ Quick check 2<\/p><p class=\"big\">The first animals to be domesticated were most likely goats.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True<\/span>", "say": "True or false? The first animals to be domesticated were most likely goats.. The answer is true.", "ms": 9184}, {"h": "<p class=\"k\">💭 Think about it<\/p><p class=\"big\">How did farming change people’s lives?<\/p><p class=\"mid rv\" style=\"animation-delay:1.5s\">Discuss with your partner.<\/p>", "say": "How did farming change people’s lives? Discuss with your partner.", "ms": 6800}, {"h": "<p class=\"k\">🇦🇪 My national identity<\/p><h2>Farming and settling<\/h2><p class=\"mid rv\">How can this idea help me be a good member of the UAE community?<\/p>", "say": "Think about the UAE. Farming and settling. How can this idea help you be a good member of the community?", "ms": 9800}, {"h": "<p class=\"k\">⭐ I can<\/p><div class=\"g\" style=\"flex-direction:column\"><div class=\"c rv\" style=\"animation-delay:0.5s\"><b style=\"font-size:2.6cqw\">⭐ I can say what the key words mean.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><b style=\"font-size:2.6cqw\">⭐ I can say how farming helped.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:2.1s\"><b style=\"font-size:2.6cqw\">⭐ I can say why rivers mattered.<\/b><\/div><\/div>", "say": "Now I can. I can say what the key words mean. I can say how farming helped. I can say why rivers mattered.", "ms": 9953}, {"h": "<p class=\"k\">🌟 Well done<\/p><h1>Well done, Year 5!<\/h1><p class=\"mid\">Farming helped people settle and build villages.<\/p>", "say": "Well done, Year 5. Farming helped people settle and build villages.", "ms": 6953}];var i=0,tm=null,playing=false,nar=false,gen=0;
