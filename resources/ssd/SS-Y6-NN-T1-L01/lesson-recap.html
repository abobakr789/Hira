<script>
var SC=[{"h": "<p class=\"k\">Lesson recap · Year 6<\/p><h1>Aspects of Equality Among People<\/h1><p class=\"mid\">Unit 1: Equality and Justice as Fairness · Lesson 1<\/p>", "say": "Lesson recap. Aspects of Equality Among People.", "ms": 6000}, {"h": "<p class=\"k\">🎯 Learning goal<\/p><h2 class=\"rv\">I can explain what equality means and how it is created in a community.<\/h2>", "say": "Our goal: I can explain what equality means and how it is created in a community.", "ms": 8030}, {"h": "<p class=\"k\">📚 Key words<\/p><div class=\"g\"><div class=\"c rv\" style=\"animation-delay:0.4s\"><span style=\"font-size:4cqw\">⚖️<\/span><b>equality<\/b><span>people having the same rights and respect<\/span><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><span style=\"font-size:4cqw\">🤝<\/span><b>fairness<\/b><span>treating people in a way that is right and reasonable<\/span><\/div><div class=\"c rv\" style=\"animation-delay:2.2s\"><span style=\"font-size:4cqw\">🏛️<\/span><b>justice<\/b><span>fair treatment under the rules<\/span><\/div><div class=\"c rv\" style=\"animation-delay:3.1s\"><span style=\"font-size:4cqw\">🕊️<\/span><b>tolerance<\/b><span>respecting people who are different from us<\/span><\/div><\/div>", "say": "Key words. equality: people having the same rights and respect. fairness: treating people in a way that is right and reasonable. justice: fair treatment under the rules. tolerance: respecting people who are different from us.", "ms": 19107}, {"h": "<p class=\"k\">💡 The big idea<\/p><h2>Aspects of equality among people<\/h2><p class=\"big rv\"><b>Equality<\/b> means people have the same rights and respect. In the story, the cats’ <b>dispute<\/b> left them with nothing. In his <b>Message of Tolerance<\/b>, Sheikh Mohammed says Sheikh Rashid’s and Sheikh Zayed’s majlis welcomed everyone regardless of origin, tribe, sect or religion. The <b>Declaration of Human Rights<\/b> says all people have the same rights and the right to education.<\/p>", "say": "Aspects of equality among people. Equality means people have the same rights and respect. In the story, the cats’ dispute left them with nothing. In his Message of Tolerance, Sheikh Mohammed says Sheikh Rashid’s and Sheikh Zayed’s majlis welcomed everyone regardless of origin, tribe, sect or religion. The Declaration of Human Rights says all people have the same rights and the right to education.", "ms": 32492}, {"h": "<p class=\"k\">✅ Quick check 1<\/p><p class=\"big\">The cats asked the monkey to help solve their dispute.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True<\/span>", "say": "True or false? The cats asked the monkey to help solve their dispute.. The answer is true.", "ms": 8723}, {"h": "<p class=\"k\">✅ Quick check 2<\/p><p class=\"big\">The monkey made the two pieces exactly even and gave one to each cat.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#B0582F\">False<\/span>", "say": "True or false? The monkey made the two pieces exactly even and gave one to each cat.. The answer is false.", "ms": 9953}, {"h": "<p class=\"k\">💭 Think about it<\/p><p class=\"big\">“Tolerance is the key to a diverse and fair community.”<\/p><p class=\"mid rv\" style=\"animation-delay:1.5s\">Discuss with your partner.<\/p>", "say": "“Tolerance is the key to a diverse and fair community.” Discuss with your partner.", "ms": 8107}, {"h": "<p class=\"k\">🇦🇪 My national identity<\/p><h2>Equality in the UAE<\/h2><p class=\"mid rv\">How can this idea help me be a good member of the UAE community?<\/p>", "say": "Think about the UAE. Equality in the UAE. How can this idea help you be a good member of the community?", "ms": 9723}, {"h": "<p class=\"k\">⭐ I can<\/p><div class=\"g\" style=\"flex-direction:column\"><div class=\"c rv\" style=\"animation-delay:0.5s\"><b style=\"font-size:2.6cqw\">⭐ I can define equality, fairness and justice.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><b style=\"font-size:2.6cqw\">⭐ I can solve a dispute fairly.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:2.1s\"><b style=\"font-size:2.6cqw\">⭐ I can explain the Message of Tolerance.<\/b><\/div><\/div>", "say": "Now I can. I can define equality, fairness and justice. I can solve a dispute fairly. I can explain the Message of Tolerance.", "ms": 11415}, {"h": "<p class=\"k\">🌟 Well done<\/p><h1>Well done, Year 6!<\/h1><p class=\"mid\">Equality means treating everyone with the same respect and rights, and tolerance helps a community stay fair.<\/p>", "say": "Well done, Year 6. Equality means treating everyone with the same respect and rights, and tolerance helps a community stay fair.", "ms": 11646}];var i=0,tm=null,playing=false,nar=false,gen=0;
