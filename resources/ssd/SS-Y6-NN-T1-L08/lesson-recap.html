var SC=[{"h": "<p class=\"k\">Lesson recap · Year 6<\/p><h1>Challenges to Health and Getting Help<\/h1><p class=\"mid\">Unit 2: Physical Health and Diet · Lesson 3<\/p>", "say": "Lesson recap. Challenges to Health and Getting Help.", "ms": 6000}, {"h": "<p class=\"k\">🎯 Learning goal<\/p><h2 class=\"rv\">I can explain challenges to health and say where to get help.<\/h2>", "say": "Our goal: I can explain challenges to health and say where to get help.", "ms": 7261}, {"h": "<p class=\"k\">📚 Key words<\/p><div class=\"g\"><div class=\"c rv\" style=\"animation-delay:0.4s\"><span style=\"font-size:4cqw\">🚧<\/span><b>challenge<\/b><span>something difficult that needs effort<\/span><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><span style=\"font-size:4cqw\">➡️<\/span><b>consequence<\/b><span>what happens as a result of something<\/span><\/div><div class=\"c rv\" style=\"animation-delay:2.2s\"><span style=\"font-size:4cqw\">🤒<\/span><b>disease<\/b><span>an illness that harms the body<\/span><\/div><div class=\"c rv\" style=\"animation-delay:3.1s\"><span style=\"font-size:4cqw\">🪑<\/span><b>sedentary<\/b><span>sitting down for most of the day<\/span><\/div><\/div>", "say": "Key words. challenge: something difficult that needs effort. consequence: what happens as a result of something. disease: an illness that harms the body. sedentary: sitting down for most of the day.", "ms": 17030}, {"h": "<p class=\"k\">💡 The big idea<\/p><h2>Challenges to health and getting help<\/h2><p class=\"big rv\">Health has <b>challenges<\/b> such as a <b>sedentary<\/b> lifestyle and fizzy drinks. Some UAE colleges serve only healthy meals and have banned soft drinks. Obstacles like access to knowledge and to <b>health care services<\/b> lead to <b>consequences<\/b>. We give kind <b>advice<\/b> and ask for help.<\/p>", "say": "Challenges to health and getting help. Health has challenges such as a sedentary lifestyle and fizzy drinks. Some UAE colleges serve only healthy meals and have banned soft drinks. Obstacles like access to knowledge and to health care services lead to consequences. We give kind advice and ask for help.", "ms": 25107}, {"h": "<p class=\"k\">✅ Quick check 1<\/p><p class=\"big\">Some UAE colleges have banned soft drinks on campus.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True<\/span>", "say": "True or false? Some UAE colleges have banned soft drinks on campus.. The answer is true.", "ms": 8569}, {"h": "<p class=\"k\">✅ Quick check 2<\/p><p class=\"big\">The article says a sedentary lifestyle has been blamed for rising obesity.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True<\/span>", "say": "True or false? The article says a sedentary lifestyle has been blamed for rising obesity.. The answer is true.", "ms": 10261}, {"h": "<p class=\"k\">💭 Think about it<\/p><p class=\"big\">“Obesity has been referred to as a global health problem.”<\/p><p class=\"mid rv\" style=\"animation-delay:1.5s\">Discuss with your partner.<\/p>", "say": "“Obesity has been referred to as a global health problem.” Discuss with your partner.", "ms": 8338}, {"h": "<p class=\"k\">🇦🇪 My national identity<\/p><h2>Healthy colleges<\/h2><p class=\"mid rv\">How can this idea help me be a good member of the UAE community?<\/p>", "say": "Think about the UAE. Healthy colleges. How can this idea help you be a good member of the community?", "ms": 9492}, {"h": "<p class=\"k\">⭐ I can<\/p><div class=\"g\" style=\"flex-direction:column\"><div class=\"c rv\" style=\"animation-delay:0.5s\"><b style=\"font-size:2.6cqw\">⭐ I can name causes of obesity.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><b style=\"font-size:2.6cqw\">⭐ I can link obstacles to consequences.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:2.1s\"><b style=\"font-size:2.6cqw\">⭐ I can give kind advice.<\/b><\/div><\/div>", "say": "Now I can. I can name causes of obesity. I can link obstacles to consequences. I can give kind advice.", "ms": 9646}, {"h": "<p class=\"k\">🌟 Well done<\/p><h1>Well done, Year 6!<\/h1><p class=\"mid\">Knowing the challenges to health and asking for help early can protect our wellbeing.<\/p>", "say": "Well done, Year 6. Knowing the challenges to health and asking for help early can protect our wellbeing.", "ms": 9800}];var i=0,tm=null,playing=false,nar=false,gen=0;
