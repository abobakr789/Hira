<script>
var SC=[{"h": "<p class=\"k\">Lesson recap · Year 10<\/p><h1>The Effects of Addiction<\/h1><p class=\"mid\">Unit 2: Living a Moderate Lifestyle · Lesson 5<\/p>", "say": "Lesson recap. The Effects of Addiction.", "ms": 6000}, {"h": "<p class=\"k\">🎯 Learning goal<\/p><h2 class=\"rv\">I can explain the effects of addiction on the individual, family and society.<\/h2>", "say": "Our goal: I can explain the effects of addiction on the individual, family and society.", "ms": 8492}, {"h": "<p class=\"k\">📚 Key words<\/p><div class=\"g\"><div class=\"c rv\" style=\"animation-delay:0.4s\"><span style=\"font-size:4cqw\">😴<\/span><b>insomnia<\/b><span>an inability to sleep<\/span><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><span style=\"font-size:4cqw\">🌀<\/span><b>psychosis<\/b><span>seeing or perceiving reality in a different way from what is classed as normal<\/span><\/div><div class=\"c rv\" style=\"animation-delay:2.2s\"><span style=\"font-size:4cqw\">🏥<\/span><b>rehabilitation clinic<\/b><span>a place that treats and supports people recovering from addiction<\/span><\/div><div class=\"c rv\" style=\"animation-delay:3.1s\"><span style=\"font-size:4cqw\">😨<\/span><b>paranoia<\/b><span>feeling you are in danger even though it is highly unlikely<\/span><\/div><\/div>", "say": "Key words. insomnia: an inability to sleep. psychosis: seeing or perceiving reality in a different way from what is classed as normal. rehabilitation clinic: a place that treats and supports people recovering from addiction. paranoia: feeling you are in danger even though it is highly unlikely.", "ms": 24492}, {"h": "<p class=\"k\">💡 The big idea<\/p><h2>Effects of addiction<\/h2><p class=\"big rv\">Addiction can harm <b>physical and mental health<\/b> (for example <b>insomnia<\/b>, anxiety and <b>psychosis<\/b>), family trust, friendships, school and work, and personal finances. Societies pay through <b>rehabilitation clinics<\/b>, helplines, policing and health care. Treatment with respect and care helps recovery.<\/p>", "say": "Effects of addiction. Addiction can harm physical and mental health (for example insomnia, anxiety and psychosis), family trust, friendships, school and work, and personal finances. Societies pay through rehabilitation clinics, helplines, policing and health care. Treatment with respect and care helps recovery.", "ms": 25800}, {"h": "<p class=\"k\">✅ Quick check 1<\/p><p class=\"big\">Addiction can affect physical and mental health.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True<\/span>", "say": "True or false? Addiction can affect physical and mental health.. The answer is true.", "ms": 8261}, {"h": "<p class=\"k\">✅ Quick check 2<\/p><p class=\"big\">Addiction only harms the person themselves.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#B0582F\">False<\/span>", "say": "True or false? Addiction only harms the person themselves.. The answer is false.", "ms": 7953}, {"h": "<p class=\"k\">💭 Think about it<\/p><p class=\"big\">Why is early help important?<\/p><p class=\"mid rv\" style=\"animation-delay:1.5s\">Discuss with your partner.<\/p>", "say": "Why is early help important? Discuss with your partner.", "ms": 6030}, {"h": "<p class=\"k\">🇦🇪 My national identity<\/p><h2>Help and recovery in the UAE<\/h2><p class=\"mid rv\">How can this idea help me be a good member of the UAE community?<\/p>", "say": "Think about the UAE. Help and recovery in the UAE. How can this idea help you be a good member of the community?", "ms": 10415}, {"h": "<p class=\"k\">⭐ I can<\/p><div class=\"g\" style=\"flex-direction:column\"><div class=\"c rv\" style=\"animation-delay:0.5s\"><b style=\"font-size:2.6cqw\">⭐ I can explain physical and mental effects.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><b style=\"font-size:2.6cqw\">⭐ I can explain effects on family and friends.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:2.1s\"><b style=\"font-size:2.6cqw\">⭐ I can explain costs to society.<\/b><\/div><\/div>", "say": "Now I can. I can explain physical and mental effects. I can explain effects on family and friends. I can explain costs to society.", "ms": 11800}, {"h": "<p class=\"k\">🌟 Well done<\/p><h1>Well done, Year 10!<\/h1><p class=\"mid\">Addiction affects individuals, families and society, and treatment with care helps recovery.<\/p>", "say": "Well done, Year 10. Addiction affects individuals, families and society, and treatment with care helps recovery.", "ms": 10415}];var i=0,tm=null,playing=false,nar=false,gen=0;
var $=function(x){return document.getElementById(x)};
function stop(){clearTimeout(tm);try{speechSynthesis.cancel()}catch(e){}}
function show(k){stop();gen++;var g=gen;i=Math.max(0,Math.min(SC.length-1,k));var s=SC[i];$('sc').innerHTML=s.h;$('cap').textContent=s.say;

 if(nar&&window.speechSynthesis){var u=new SpeechSynthesisUtterance(s.say);u.lang='en-GB';u.rate=.95;var d=false;

 else tm=setTimeout(adv,s.ms);}

$('bn').onclick=function(){show(i+1)};$('bp').onclick=function(){show(i-1)};
