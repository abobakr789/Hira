<script>
var SC=[{"h": "<p class=\"k\">Lesson recap · Year 10</p><h1>Inequality</h1><p class=\"mid\">Unit 1: Ethics and the Global Economy · Lesson 3</p>", "say": "Lesson recap. Inequality.", "ms": 6000}, {"h": "<p class=\"k\">🎯 Learning goal</p><h2 class=\"rv\">I can explain what inequality is, how it is measured, and how globalisation affects it.</h2>", "say": "Our goal: I can explain what inequality is, how it is measured, and how globalisation affects it.", "ms": 9261}, {"h": "<p class=\"k\">📚 Key words</p><div class=\"g\"><div class=\"c rv\" style=\"animation-delay:0.4s\"><span style=\"font-size:1.2cqw;letter-spacing:.12em;color:#986c27\">WORD</span><b>income</b><span>the amount of money an individual or organisation earns in a time period</span></div><div class=\"c rv\" style=\"animation-delay:1.3s\"><span style=\"font-size:1.2cqw;letter-spacing:.12em;color:#986c27\">WORD</span><b>wealth</b><span>the value of all the assets a person owns at one point in time</span></div><div class=\"c rv\" style=\"animation-delay:2.2s\"><span style=\"font-size:1.2cqw;letter-spacing:.12em;color:#986c27\">WORD</span><b>gross domestic product (GDP)</b><span>the value of all the goods and services produced in an economy in a year</span></div><div class=\"c rv\" style=\"animation-delay:3.1s\"><span style=\"font-size:1.2cqw;letter-spacing:.12em;color:#986c27\">WORD</span><b>GDP per capita</b><span>GDP divided by population: average output per person, not each person’s income</span></div></div>", "say": "Key words. income: the amount of money an individual or organisation earns in a time period. wealth: the value of all the assets a person owns at one point in time. gross domestic product (GDP): the value of all the goods and services produced in an economy in a year. GDP per capita: GDP divided by population: average output per person, not each person’s income.", "ms": 28261}, {"h": "<p class=\"k\">💡 The big idea</p><h2>Inequality</h2><p class=\"big rv\"><b>Inequality</b> means different amounts of <b>income</b>, <b>wealth</b> or assets. It can be individual, regional or international. We measure it with <b>GDP</b>, <b>GDP per capita</b>, <b>income distribution</b> and the <b>Gini coefficient</b> (0 = perfect equality, 1 = perfect inequality). Whether globalisation increases inequality depends on how we measure it.</p>", "say": "Inequality. Inequality means different amounts of income, wealth or assets. It can be individual, regional or international. We measure it with GDP, GDP per capita, income distribution and the Gini coefficient (0 = perfect equality, 1 = perfect inequality). Whether globalisation increases inequality depends on how we measure it.", "ms": 27184}, {"h": "<p class=\"k\">✅ Quick check 1</p><p class=\"big\">Wealth is a stock of assets at a point in time.</p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True</span>", "say": "True or false? Wealth is a stock of assets at a point in time.. The answer is true.", "ms": 8184}, {"h": "<p class=\"k\">✅ Quick check 2</p><p class=\"big\">GDP per capita is GDP multiplied by the population.</p><span class=\"ans rv\" style=\"animation-delay:4s;background:#B0582F\">False</span>", "say": "True or false? GDP per capita is GDP multiplied by the population.. The answer is false.", "ms": 8569}, {"h": "<p class=\"k\">💭 Think about it</p><p class=\"big\">Does globalisation reduce or increase inequality?</p><p class=\"mid rv\" style=\"animation-delay:1.5s\">Discuss with your partner.</p>", "say": "Does globalisation reduce or increase inequality? Discuss with your partner.", "ms": 7646}, {"h": "<p class=\"k\">🇦🇪 My national identity</p><h2>Equality and the UAE</h2><p class=\"mid rv\">How can this idea help me be a good member of the UAE community?</p>", "say": "Think about the UAE. Equality and the UAE. How can this idea help you be a good member of the community?", "ms": 9800}, {"h": "<p class=\"k\">⭐ I can</p><div class=\"g\" style=\"flex-direction:column\"><div class=\"c rv\" style=\"animation-delay:0.5s\"><b style=\"font-size:2.6cqw\">⭐ I can define the key words.</b></div><div class=\"c rv\" style=\"animation-delay:1.3s\"><b style=\"font-size:2.6cqw\">⭐ I can explain how inequality is measured.</b></div><div class=\"c rv\" style=\"animation-delay:2.1s\"><b style=\"font-size:2.6cqw\">⭐ I can judge the effect of globalisation.</b></div></div>", "say": "Now I can. I can define the key words. I can explain how inequality is measured. I can judge the effect of globalisation.", "ms": 11107}, {"h": "<p class=\"k\">🌟 Well done</p><h1>Well done, Year 10!</h1><p class=\"mid\">Inequality can be measured in several ways, and the effect of globalisation depends on how we measure it.</p>", "say": "Well done, Year 10. Inequality can be measured in several ways, and the effect of globalisation depends on how we measure it.", "ms": 11415}];var i=0,tm=null,playing=false,nar=false,gen=0;
var $=function(x){return document.getElementById(x)};
function stop(){clearTimeout(tm);try{speechSynthesis.cancel()}catch(e){}}
function show(k){stop();gen++;var g=gen;i=Math.max(0,Math.min(SC.length-1,k));var s=SC[i];$('sc').innerHTML=s.h;$('cap').textContent=s.say;
 $('bar').style.width=((i+1)/SC.length*100)+'%';$('ct').textContent=(i+1)+' / '+SC.length;if(!playing)return;
 var adv=function(){if(g!==gen)return;if(i<SC.length-1)show(i+1);else{playing=false;$('bt').innerHTML='&#9654; Replay';}};
 if(nar&&window.speechSynthesis){var u=new SpeechSynthesisUtterance(s.say);u.lang='en-GB';u.rate=.95;var d=false;
  u.onend=function(){if(d)return;d=true;tm=setTimeout(adv,900)};u.onerror=u.onend;speechSynthesis.speak(u);tm=setTimeout(function(){if(d)return;d=true;adv()},s.ms*2+4000);}
 else tm=setTimeout(adv,s.ms);}

$('bt').onclick=function(){if(!playing){playing=true;$('bt').innerHTML='&#9208; Pause';show(i>=SC.length-1&&$('bt').textContent.indexOf('Replay')>-1?0:i)}else{playing=false;stop();$('bt').innerHTML='&#9654; Play'}};
$('bn').onclick=function(){show(i+1)};$('bp').onclick=function(){show(i-1)};
$('bv').onclick=function(){nar=!nar;this.classList.toggle('on',nar);this.innerHTML=nar?'&#128266; Narration: on':'&#128266; Narration: off';if(playing)show(i)};
