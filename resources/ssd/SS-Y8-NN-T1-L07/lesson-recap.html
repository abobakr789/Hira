<script>
var SC=[{"h": "<p class=\"k\">Lesson recap · Year 8<\/p><h1>How Tolerant Are You?<\/h1><p class=\"mid\">Unit 2: Valuing Diversity · Lesson 2<\/p>", "say": "Lesson recap. How Tolerant Are You?.", "ms": 6000}, {"h": "<p class=\"k\">🎯 Learning goal<\/p><h2 class=\"rv\">I can explain tolerance, prejudice and discrimination and how to include others.<\/h2>", "say": "Our goal: I can explain tolerance, prejudice and discrimination and how to include others.", "ms": 8723}, {"h": "<p class=\"k\">📚 Key words<\/p><div class=\"g\"><div class=\"c rv\" style=\"animation-delay:0.4s\"><span style=\"font-size:4cqw\">🕊️<\/span><b>tolerance<\/b><span>accepting people who are different<\/span><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><span style=\"font-size:4cqw\">🚫<\/span><b>prejudice<\/b><span>judging people unfairly before knowing them<\/span><\/div><div class=\"c rv\" style=\"animation-delay:2.2s\"><span style=\"font-size:4cqw\">⚠️<\/span><b>discrimination<\/b><span>treating people unfairly because of who they are<\/span><\/div><div class=\"c rv\" style=\"animation-delay:3.1s\"><span style=\"font-size:4cqw\">🌍<\/span><b>diversity<\/b><span>differences among people<\/span><\/div><\/div>", "say": "Key words. tolerance: accepting people who are different. prejudice: judging people unfairly before knowing them. discrimination: treating people unfairly because of who they are. diversity: differences among people.", "ms": 18415}, {"h": "<p class=\"k\">💡 The big idea<\/p><h2>How tolerant are you?<\/h2><p class=\"big rv\">The book uses a garden to show that unique people can grow in <b>unison<\/b>. It explains <b>prejudice<\/b>, <b>discrimination<\/b> and <b>stereotypes<\/b>, shows how it feels to be an <b>outsider<\/b>, and asks how we can include everyone.<\/p>", "say": "How tolerant are you?. The book uses a garden to show that unique people can grow in unison. It explains prejudice, discrimination and stereotypes, shows how it feels to be an outsider, and asks how we can include everyone.", "ms": 18953}, {"h": "<p class=\"k\">✅ Quick check 1<\/p><p class=\"big\">The book says the flowers in the garden are all very different.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True<\/span>", "say": "True or false? The book says the flowers in the garden are all very different.. The answer is true.", "ms": 9415}, {"h": "<p class=\"k\">✅ Quick check 2<\/p><p class=\"big\">The book says only some groups can feel excluded.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#B0582F\">False<\/span>", "say": "True or false? The book says only some groups can feel excluded.. The answer is false.", "ms": 8415}, {"h": "<p class=\"k\">💭 Think about it<\/p><p class=\"big\">“Being different should not mean a person feels isolated from society.”<\/p><p class=\"mid rv\" style=\"animation-delay:1.5s\">Discuss with your partner.<\/p>", "say": "“Being different should not mean a person feels isolated from society.” Discuss with your partner.", "ms": 9338}, {"h": "<p class=\"k\">🇦🇪 My national identity<\/p><h2>Tolerance in the UAE<\/h2><p class=\"mid rv\">How can this idea help me be a good member of the UAE community?<\/p>", "say": "Think about the UAE. Tolerance in the UAE. How can this idea help you be a good member of the community?", "ms": 9800}, {"h": "<p class=\"k\">⭐ I can<\/p><div class=\"g\" style=\"flex-direction:column\"><div class=\"c rv\" style=\"animation-delay:0.5s\"><b style=\"font-size:2.6cqw\">⭐ I can define the key words.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><b style=\"font-size:2.6cqw\">⭐ I can explain feeling like an outsider.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:2.1s\"><b style=\"font-size:2.6cqw\">⭐ I can say how to include others.<\/b><\/div><\/div>", "say": "Now I can. I can define the key words. I can explain feeling like an outsider. I can say how to include others.", "ms": 10338}, {"h": "<p class=\"k\">🌟 Well done<\/p><h1>Well done, Year 8!<\/h1><p class=\"mid\">Tolerance means including people who are different, like flowers that grow together in one garden.<\/p>", "say": "Well done, Year 8. Tolerance means including people who are different, like flowers that grow together in one garden.", "ms": 10800}];var i=0,tm=null,playing=false,nar=false,gen=0;
var $=function(x){return document.getElementById(x)};
function stop(){clearTimeout(tm);try{speechSynthesis.cancel()}catch(e){}}
function show(k){stop();gen++;var g=gen;i=Math.max(0,Math.min(SC.length-1,k));var s=SC[i];$('sc').innerHTML=s.h;$('cap').textContent=s.say;
 $('bar').style.width=((i+1)/SC.length*100)+'%';$('ct').textContent=(i+1)+' / '+SC.length;if(!playing)return;
 var adv=function(){if(g!==gen)return;if(i<SC.length-1)show(i+1);else{playing=false;$('bt').innerHTML='&#9654; Replay';}};
 if(nar&&window.speechSynthesis){var u=new SpeechSynthesisUtterance(s.say);u.lang='en-GB';u.rate=.95;var d=false;
  u.onend=function(){if(d)return;d=true;tm=setTimeout(adv,900)};u.onerror=u.onend;speechSynthesis.speak(u);tm=setTimeout(function(){if(d)return;d=true;adv()},s.ms*2+4000);}
 else tm=setTimeout(adv,s.ms);}
