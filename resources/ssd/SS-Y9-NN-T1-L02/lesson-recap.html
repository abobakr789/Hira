ates with the University of Tokyo, that the European Union speaks with one voice on world issues, and that customs agreements protect trade and the community.", "ms": 26492}, {"h": "<p class=\"k\">✅ Quick check 1</p><p class=\"big\">The book says the UAE’s foreign policy rests on equality, justice and mutual respect.</p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True</span>", "say": "True or false? The book says the UAE’s foreign policy rests on equality, justice and mutual respect.. The answer is true.", "ms": 11107}, {"h": "<p class=\"k\">✅ Quick check 2</p><p class=\"big\">The book says Masdar Institute hosted students from the University of Tokyo in 2014.</p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True</span>", "say": "True or false? The book says Masdar Institute hosted students from the University of Tokyo in 2014.. The answer is true.", "ms": 11030}, {"h": "<p class=\"k\">💭 Think about it</p><p class=\"big\">“Friendly relations benefit everyone.”</p><p class=\"mid rv\" style=\"animation-delay:1.5s\">Discuss with your partner.</p>", "say": "“Friendly relations benefit everyone.” Discuss with your partner.", "ms": 6800}, {"h": "<p class=\"k\">🇦🇪 My national identity</p><h2>The UAE and the world</h2><p class=\"mid rv\">How can this idea help me be a good member of the UAE community?</p>", "say": "Think about the UAE. The UAE and the world. How can this idea help you be a good member of the community?", "ms": 9876}, {"h": "<p class=\"k\">⭐ I can</p><div class=\"g\" style=\"flex-direction:column\"><div class=\"c rv\" style=\"animation-delay:0.5s\"><b style=\"font-size:2.6cqw\">⭐ I can describe the policy.</b></div><div class=\"c rv\" style=\"animation-delay:1.3s\"><b style=\"font-size:2.6cqw\">⭐ I can describe cooperation.</b></div><div class=\"c rv\" style=\"animation-delay:2.1s\"><b style=\"font-size:2.6cqw\">⭐ I can explain customs.</b></div></div>", "say": "Now I can. I can describe the policy. I can describe cooperation. I can explain customs.", "ms": 8569}, {"h": "<p class=\"k\">🌟 Well done</p><h1>Well done, Year 9!</h1><p class=\"mid\">Countries that respect each other and work together can build a better world.</p>", "say": "Well done, Year 9. Countries that respect each other and work together can build a better world.", "ms": 9184}];var i=0,tm=null,playing=false,nar=false,gen=0;
