ft tools at Jebel Faya, that the climate turned dry and then wetter around 10,000 BCE, and that people of the Neolithic Age at Jebel Buhais hunted, kept herds and lived in a changing land.", "ms": 25646}, {"h": "<p class=\"k\">✅ Quick check 1<\/p><p class=\"big\">The book says Jebel Faya is in present-day Sharjah.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True<\/span>", "say": "True or false? The book says Jebel Faya is in present-day Sharjah.. The answer is true.", "ms": 8492}, {"h": "<p class=\"k\">✅ Quick check 2<\/p><p class=\"big\">The book says the Red Sea was higher 130,000 years ago.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#B0582F\">False<\/span>", "say": "True or false? The book says the Red Sea was higher 130,000 years ago.. The answer is false.", "ms": 8876}, {"h": "<p class=\"k\">💭 Think about it<\/p><p class=\"big\">“Keeping animals has always been important in the UAE.”<\/p><p class=\"mid rv\" style=\"animation-delay:1.5s\">Discuss with your partner.<\/p>", "say": "“Keeping animals has always been important in the UAE.” Discuss with your partner.", "ms": 8107}, {"h": "<p class=\"k\">🇦🇪 My national identity<\/p><h2>Early life in the UAE<\/h2><p class=\"mid rv\">How can this idea help me be a good member of the UAE community?<\/p>", "say": "Think about the UAE. Early life in the UAE. How can this idea help you be a good member of the community?", "ms": 9876}, {"h": "<p class=\"k\">⭐ I can<\/p><div class=\"g\" style=\"flex-direction:column\"><div class=\"c rv\" style=\"animation-delay:0.5s\"><b style=\"font-size:2.6cqw\">⭐ I can describe the movement.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><b style=\"font-size:2.6cqw\">⭐ I can explain climate change.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:2.1s\"><b style=\"font-size:2.6cqw\">⭐ I can describe Jebel Buhais.<\/b><\/div><\/div>", "say": "Now I can. I can describe the movement. I can explain climate change. I can describe Jebel Buhais.", "ms": 9338}, {"h": "<p class=\"k\">🌟 Well done<\/p><h1>Well done, Year 9!<\/h1><p class=\"mid\">The land and climate shaped how people lived in the early UAE.<\/p>", "say": "Well done, Year 9. The land and climate shaped how people lived in the early UAE.", "ms": 8030}];var i=0,tm=null,playing=false,nar=false,gen=0;
