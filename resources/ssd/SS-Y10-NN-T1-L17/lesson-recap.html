<script>
var SC=[{"h": "<p class=\"k\">Lesson recap · Year 10<\/p><h1>Ancient Civilisations – Mesopotamia<\/h1><p class=\"mid\">Unit 3: The Beginning of History – Ancient Civilisations · Lesson 5<\/p>", "say": "Lesson recap. Ancient Civilisations – Mesopotamia.", "ms": 6000}, {"h": "<p class=\"k\">🎯 Learning goal<\/p><h2 class=\"rv\">I can describe the main civilisations of ancient Mesopotamia.<\/h2>", "say": "Our goal: I can describe the main civilisations of ancient Mesopotamia.", "ms": 7261}, {"h": "<p class=\"k\">📚 Key words<\/p><div class=\"g\"><div class=\"c rv\" style=\"animation-delay:0.4s\"><span style=\"font-size:4cqw\">👑<\/span><b>empire<\/b><span>a large area of land and peoples ruled by one ruler<\/span><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><span style=\"font-size:4cqw\">📏<\/span><b>standard measurement system<\/b><span>agreed units of measuring that help trade<\/span><\/div><div class=\"c rv\" style=\"animation-delay:2.2s\"><span style=\"font-size:4cqw\">✍️<\/span><b>inscribe<\/b><span>to write or carve on a surface<\/span><\/div><div class=\"c rv\" style=\"animation-delay:3.1s\"><span style=\"font-size:4cqw\">🌙<\/span><b>Fertile Crescent<\/b><span>a broad arc of fertile lands including Mesopotamia and the Levant<\/span><\/div><\/div>", "say": "Key words. empire: a large area of land and peoples ruled by one ruler. standard measurement system: agreed units of measuring that help trade. inscribe: to write or carve on a surface. Fertile Crescent: a broad arc of fertile lands including Mesopotamia and the Levant.", "ms": 22107}, {"h": "<p class=\"k\">💡 The big idea<\/p><h2>Ancient Mesopotamia<\/h2><p class=\"big rv\"><b>Mesopotamia<\/b> lay between the Tigris and the Euphrates, in the <b>Fertile Crescent<\/b>. The Sumerians, Akkadians (<b>Sargon<\/b>), Babylon (<b>Hammurabi<\/b>), Assyrians and Neo-Babylonians (<b>Nebuchadnezzar II<\/b>) ruled in turn until Cyrus II and Alexander the Great.<\/p>", "say": "Ancient Mesopotamia. Mesopotamia lay between the Tigris and the Euphrates, in the Fertile Crescent. The Sumerians, Akkadians (Sargon), Babylon (Hammurabi), Assyrians and Neo-Babylonians (Nebuchadnezzar II) ruled in turn until Cyrus II and Alexander the Great.", "ms": 21723}, {"h": "<p class=\"k\">✅ Quick check 1<\/p><p class=\"big\">The Fertile Crescent was bordered by the Tigris and the Euphrates.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True<\/span>", "say": "True or false? The Fertile Crescent was bordered by the Tigris and the Euphrates.. The answer is true.", "ms": 9646}, {"h": "<p class=\"k\">✅ Quick check 2<\/p><p class=\"big\">The Sumerians were conquered by the Akkadians around 2300 BCE.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True<\/span>", "say": "True or false? The Sumerians were conquered by the Akkadians around 2300 BCE.. The answer is true.", "ms": 9338}, {"h": "<p class=\"k\">💭 Think about it<\/p><p class=\"big\">Why were rivers so important?<\/p><p class=\"mid rv\" style=\"animation-delay:1.5s\">Discuss with your partner.<\/p>", "say": "Why were rivers so important? Discuss with your partner.", "ms": 6107}, {"h": "<p class=\"k\">🇦🇪 My national identity<\/p><h2>A region with a long history<\/h2><p class=\"mid rv\">How can this idea help me be a good member of the UAE community?<\/p>", "say": "Think about the UAE. A region with a long history. How can this idea help you be a good member of the community?", "ms": 10415}, {"h": "<p class=\"k\">⭐ I can<\/p><div class=\"g\" style=\"flex-direction:column\"><div class=\"c rv\" style=\"animation-delay:0.5s\"><b style=\"font-size:2.6cqw\">⭐ I can describe the Fertile Crescent.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><b style=\"font-size:2.6cqw\">⭐ I can explain Sargon and Hammurabi.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:2.1s\"><b style=\"font-size:2.6cqw\">⭐ I can describe Babylon’s story.<\/b><\/div><\/div>", "say": "Now I can. I can describe the Fertile Crescent. I can explain Sargon and Hammurabi. I can describe Babylon’s story.", "ms": 10646}, {"h": "<p class=\"k\">🌟 Well done<\/p><h1>Well done, Year 10!<\/h1><p class=\"mid\">Mesopotamia was the home of early cities, writing, laws and empires.<\/p>", "say": "Well done, Year 10. Mesopotamia was the home of early cities, writing, laws and empires.", "ms": 8569}];var i=0,tm=null,playing=false,nar=false,gen=0;
var $=function(x){return document.getElementById(x)};
function stop(){clearTimeout(tm);try{speechSynthesis.cancel()}catch(e){}}
function show(k){stop();gen++;var g=gen;i=Math.max(0,Math.min(SC.length-1,k));var s=SC[i];$('sc').innerHTML=s.h;$('cap').textContent=s.say;
 $('bar').style.width=((i+1)/SC.length*100)+'%';$('ct').textContent=(i+1)+' / '+SC.length;if(!playing)return;
 var adv=function(){if(g!==gen)return;if(i<SC.length-1)show(i+1);else{playing=false;$('bt').innerHTML='&#9654; Replay';}};
 if(nar&&window.speechSynthesis){var u=new SpeechSynthesisUtterance(s.say);u.lang='en-GB';u.rate=.95;var d=false;
  u.onend=function(){if(d)return;d=true;tm=setTimeout(adv,900)};u.onerror=u.onend;speechSynthesis.speak(u);tm=setTimeout(function(){if(d)return;d=true;adv()},s.ms*2+4000);}
 else tm=setTimeout(adv,s.ms);}
$('go').onclick=function(){$('ov').style.display='none';playing=true;$('bt').innerHTML='&#9208; Pause';show(0)};
$('bt').onclick=function(){if(!playing){playing=true;$('bt').innerHTML='&#9208; Pause';show(i>=SC.length-1&&$('bt').textContent.indexOf('Replay')>-1?0:i)}else{playing=false;stop();$('bt').innerHTML='&#9654; Play'}};
$('bn').onclick=function(){show(i+1)};$('bp').onclick=function(){show(i-1)};
