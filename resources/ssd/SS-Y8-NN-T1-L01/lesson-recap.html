var SC=[{"h": "<p class=\"k\">Lesson recap · Year 8<\/p><h1>Definition of Community<\/h1><p class=\"mid\">Unit 1: Ethics in the Context of Communities · Lesson 1<\/p>", "say": "Lesson recap. Definition of Community.", "ms": 6000}, {"h": "<p class=\"k\">🎯 Learning goal<\/p><h2 class=\"rv\">I can define community and explain why people belong to groups.<\/h2>", "say": "Our goal: I can define community and explain why people belong to groups.", "ms": 7415}, {"h": "<p class=\"k\">📚 Key words<\/p><div class=\"g\"><div class=\"c rv\" style=\"animation-delay:0.4s\"><span style=\"font-size:4cqw\">🏘️<\/span><b>community<\/b><span>people living in one area who share things like culture or faith<\/span><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><span style=\"font-size:4cqw\">👥<\/span><b>society<\/b><span>a large group of people who live together under shared rules<\/span><\/div><div class=\"c rv\" style=\"animation-delay:2.2s\"><span style=\"font-size:4cqw\">🤝<\/span><b>belonging<\/b><span>feeling you are part of a group<\/span><\/div><div class=\"c rv\" style=\"animation-delay:3.1s\"><span style=\"font-size:4cqw\">👪<\/span><b>primary group<\/b><span>a group you belong to automatically, such as family<\/span><\/div><\/div>", "say": "Key words. community: people living in one area who share things like culture or faith. society: a large group of people who live together under shared rules. belonging: feeling you are part of a group. primary group: a group you belong to automatically, such as family.", "ms": 22569}, {"h": "<p class=\"k\">💡 The big idea<\/p><h2>What is a community?<\/h2><p class=\"big rv\">A <b>community<\/b> has three elements: individuals, an area and relationships, says the book. <b>Primary groups<\/b> such as family are joined automatically, and <b>secondary groups<\/b> such as school are joined by choice. People belong to groups for support and security, and communities change, for example after the discovery of oil in the UAE, says the book.<\/p>", "say": "What is a community?. A community has three elements: individuals, an area and relationships, says the book. Primary groups such as family are joined automatically, and secondary groups such as school are joined by choice. People belong to groups for support and security, and communities change, for example after the discovery of oil in the UAE, says the book.", "ms": 29646}, {"h": "<p class=\"k\">✅ Quick check 1<\/p><p class=\"big\">The book says a community has three elements: individuals, area and relationships.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True<\/span>", "say": "True or false? The book says a community has three elements: individuals, area and relationships.. The answer is true.", "ms": 10876}, {"h": "<p class=\"k\">✅ Quick check 2<\/p><p class=\"big\">The book says only humans live in communities.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#B0582F\">False<\/span>", "say": "True or false? The book says only humans live in communities.. The answer is false.", "ms": 8184}, {"h": "<p class=\"k\">💭 Think about it<\/p><p class=\"big\">“Humans are social beings who live together and depend on one another.”<\/p><p class=\"mid rv\" style=\"animation-delay:1.5s\">Discuss with your partner.<\/p>", "say": "“Humans are social beings who live together and depend on one another.” Discuss with your partner.", "ms": 9338}, {"h": "<p class=\"k\">🇦🇪 My national identity<\/p><h2>Community in the UAE<\/h2><p class=\"mid rv\">How can this idea help me be a good member of the UAE community?<\/p>", "say": "Think about the UAE. Community in the UAE. How can this idea help you be a good member of the community?", "ms": 9800}, {"h": "<p class=\"k\">⭐ I can<\/p><div class=\"g\" style=\"flex-direction:column\"><div class=\"c rv\" style=\"animation-delay:0.5s\"><b style=\"font-size:2.6cqw\">⭐ I can define community.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><b style=\"font-size:2.6cqw\">⭐ I can tell groups apart.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:2.1s\"><b style=\"font-size:2.6cqw\">⭐ I can explain belonging.<\/b><\/div><\/div>", "say": "Now I can. I can define community. I can tell groups apart. I can explain belonging.", "ms": 8261}, {"h": "<p class=\"k\">🌟 Well done<\/p><h1>Well done, Year 8!<\/h1><p class=\"mid\">Communities are made of individuals, an area and relationships, and they change over time.<\/p>", "say": "Well done, Year 8. Communities are made of individuals, an area and relationships, and they change over time.", "ms": 10184}];var i=0,tm=null,playing=false,nar=false,gen=0;
