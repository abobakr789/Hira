var SC=[{"h": "<p class=\"k\">Lesson recap · Year 6<\/p><h1>The Republic of Venice<\/h1><p class=\"mid\">Unit 3: Perspectives of People through Time · Lesson 3<\/p>", "say": "Lesson recap. The Republic of Venice.", "ms": 6000}, {"h": "<p class=\"k\">🎯 Learning goal<\/p><h2 class=\"rv\">I can explain how Venice became wealthy and powerful.<\/h2>", "say": "Our goal: I can explain how Venice became wealthy and powerful.", "ms": 6646}, {"h": "<p class=\"k\">📚 Key words<\/p><div class=\"g\"><div class=\"c rv\" style=\"animation-delay:0.4s\"><span style=\"font-size:4cqw\">💪<\/span><b>influential<\/b><span>having a lot of power over others<\/span><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><span style=\"font-size:4cqw\">⚓<\/span><b>maritime<\/b><span>connected with the sea<\/span><\/div><div class=\"c rv\" style=\"animation-delay:2.2s\"><span style=\"font-size:4cqw\">⛵<\/span><b>fleet<\/b><span>a group of ships<\/span><\/div><div class=\"c rv\" style=\"animation-delay:3.1s\"><span style=\"font-size:4cqw\">🚢<\/span><b>navy<\/b><span>the ships and sailors of a country<\/span><\/div><\/div>", "say": "Key words. influential: having a lot of power over others. maritime: connected with the sea. fleet: a group of ships. navy: the ships and sailors of a country.", "ms": 14030}, {"h": "<p class=\"k\">💡 The big idea<\/p><h2>The Republic of Venice<\/h2><p class=\"big rv\">Venice is a city of over one hundred small islands. In the 12th century CE it controlled much of the <b>Adriatic and Aegean Seas<\/b>. Its large ships, called <b>galleys<\/b>, helped Alexios I in <b>1082<\/b> in exchange for free trade without tariffs. Venice became <b>Egypt’s exclusive European trading partner<\/b> for spices and other goods.<\/p>", "say": "The Republic of Venice. Venice is a city of over one hundred small islands. In the 12th century CE it controlled much of the Adriatic and Aegean Seas. Its large ships, called galleys, helped Alexios I in 1082 in exchange for free trade without tariffs. Venice became Egypt’s exclusive European trading partner for spices and other goods.", "ms": 27723}, {"h": "<p class=\"k\">✅ Quick check 1<\/p><p class=\"big\">Venice is made up of over one hundred small islands.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True<\/span>", "say": "True or false? Venice is made up of over one hundred small islands.. The answer is true.", "ms": 8569}, {"h": "<p class=\"k\">✅ Quick check 2<\/p><p class=\"big\">The galleys had more than one hundred oarsmen, says the book.<\/p><span class=\"ans rv\" style=\"animation-delay:4s;background:#2A8C82\">True<\/span>", "say": "True or false? The galleys had more than one hundred oarsmen, says the book.. The answer is true.", "ms": 9261}, {"h": "<p class=\"k\">💭 Think about it<\/p><p class=\"big\">“Venice promised to help but did not keep their promise.”<\/p><p class=\"mid rv\" style=\"animation-delay:1.5s\">Is it fair? Discuss with your partner.<\/p>", "say": "“Venice promised to help but did not keep their promise.” Is it fair? Discuss with your partner.", "ms": 9184}, {"h": "<p class=\"k\">🇦🇪 My national identity<\/p><h2>Learning from the past<\/h2><p class=\"mid rv\">How can this idea help me be a good member of the UAE community?<\/p>", "say": "Think about the UAE. Learning from the past. How can this idea help you be a good member of the community?", "ms": 9953}, {"h": "<p class=\"k\">⭐ I can<\/p><div class=\"g\" style=\"flex-direction:column\"><div class=\"c rv\" style=\"animation-delay:0.5s\"><b style=\"font-size:2.6cqw\">⭐ I can describe Venice.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:1.3s\"><b style=\"font-size:2.6cqw\">⭐ I can explain trade and ships.<\/b><\/div><div class=\"c rv\" style=\"animation-delay:2.1s\"><b style=\"font-size:2.6cqw\">⭐ I can discuss promises.<\/b><\/div><\/div>", "say": "Now I can. I can describe Venice. I can explain trade and ships. I can discuss promises.", "ms": 8569}, {"h": "<p class=\"k\">🌟 Well done<\/p><h1>Well done, Year 6!<\/h1><p class=\"mid\">Venice grew wealthy through ships and trade, and its story makes us think about promises and fairness.<\/p>", "say": "Well done, Year 6. Venice grew wealthy through ships and trade, and its story makes us think about promises and fairness.", "ms": 11107}];var i=0,tm=null,playing=false,nar=false,gen=0;
