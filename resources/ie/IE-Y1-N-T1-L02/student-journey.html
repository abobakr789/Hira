<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>رحلة القنديل · سورة الفاتحة · حراء</title>
<style>
@font-face{font-family:"Thmanyah Display";src:url("../../../art/fonts/thmanyahserifdisplay-Bold.woff2") format("woff2");font-weight:700}
@font-face{font-family:"Thmanyah Display";src:url("../../../art/fonts/thmanyahserifdisplay-Black.woff2") format("woff2");font-weight:900}
@font-face{font-family:"Thmanyah Text";src:url("../../../art/fonts/thmanyahseriftext-Medium.woff2") format("woff2");font-weight:500}
@font-face{font-family:"Thmanyah Text";src:url("../../../art/fonts/thmanyahseriftext-Bold.woff2") format("woff2");font-weight:700}
@font-face{font-family:"Thmanyah Sans";src:url("../../../art/fonts/thmanyahsans-Medium.woff2") format("woff2");font-weight:500}
@font-face{font-family:"Thmanyah Sans";src:url("../../../art/fonts/thmanyahsans-Bold.woff2") format("woff2");font-weight:700}
:root{
  --navy:#102A4C;--gold:#C4943A;--gold2:#E9C77B;--cream:#FBF8F1;--sand:#F4E7CC;--ink:#1d2b3f;
  --bronze:#B06A34;--silver:#7A8797;--goldm:#C99A1E;--chal:#7B4FC0;
  --green:#1F9D6B;--red:#D9534F;--sky:#EAF4FB;--rose:#FCEDEA;--mint:#E7F6EF;--lav:#F1ECFA;--peach:#FFF1E2;
  --r:26px;--shadow:0 14px 34px -16px rgba(16,42,76,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Thmanyah Text",system-ui,sans-serif;color:var(--ink);background:var(--cream);overflow:hidden;font-size:22px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
h1,h2,h3,.disp{font-family:"Thmanyah Display",serif;font-weight:700;margin:0}
.ui{font-family:"Thmanyah Sans",system-ui,sans-serif}

/* ===== المشهد العام ===== */
#world{position:fixed;inset:0;background:
 radial-gradient(120% 70% at 85% 0%,#FFF6DF 0%,transparent 60%),
 radial-gradient(90% 60% at 0% 10%,#EAF3FB 0%,transparent 55%),
 linear-gradient(#FDFBF6,#F8F0E0 70%,#F2E1BF);}
.dune{position:absolute;left:-10%;right:-10%;bottom:0;pointer-events:none}
.hanglant{position:absolute;top:0;transform-origin:50% 0;animation:swing 4.5s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.twinkle{position:absolute;color:var(--gold2);animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}

/* ===== الشريط العلوي ===== */
#top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 18px;
 background:rgba(251,248,241,.82);backdrop-filter:blur(10px);border-bottom:1px solid #EFE4CD}
#top .logo{height:46px;flex:none}
#top .ttl{flex:1;min-width:0}
#top .ttl small{display:block;font-family:"Thmanyah Sans";font-size:14px;color:#8a7a5a}
#top .ttl b{font-family:"Thmanyah Display";font-size:24px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.medals{display:flex;gap:6px}
.medal{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#EEE7D8;position:relative;transition:.4s}
.medal svg{width:26px;height:26px;opacity:.35;transition:.4s}
.medal.on{box-shadow:0 0 0 3px #fff,0 6px 16px -4px var(--c)}
.medal.on svg{opacity:1}
.medal.pop{animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.topbtn{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:#fff;box-shadow:0 4px 14px -6px rgba(16,42,76,.4);font-family:"Thmanyah Sans";font-size:16px;font-weight:700;color:var(--navy);white-space:nowrap}
.topbtn .cnt{background:var(--red);color:#fff;border-radius:999px;padding:0 8px;font-size:14px;min-width:24px;text-align:center}
.topbtn .cnt.zero{background:var(--green)}

/* ===== الخريطة ===== */
#map{position:fixed;inset:74px 0 0 0;overflow:auto;z-index:5}
#mapInner{position:relative;width:100%;max-width:1100px;margin:0 auto;height:1180px}
#path{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:170px}
.node .lamp{width:96px;height:110px;position:relative;transition:transform .3s}
.node:not(.locked):hover .lamp{transform:translateY(-6px) rotate(-3deg)}
.node .glow{position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(circle,rgba(255,206,92,.75),rgba(255,206,92,0) 65%);opacity:0;transition:.6s}
.node.done .glow{opacity:1;animation:breath 2.6s ease-in-out infinite}
.node.current .lamp{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes breath{0%,100%{opacity:.7;transform:scale(.95)}50%{opacity:1;transform:scale(1.08)}}
.node .lbl{background:#fff;border-radius:16px;padding:6px 14px;font-family:"Thmanyah Display";font-size:20px;color:var(--navy);box-shadow:var(--shadow);text-align:center;line-height:1.35}
.node .lbl small{display:block;font-family:"Thmanyah Sans";font-size:13px;color:#8a7a5a;font-weight:500}
.node.locked{filter:grayscale(.85);opacity:.6}
.node.locked .lbl::before{content:"🔒 ";font-size:14px}
.node .num{position:absolute;top:-6px;right:-4px;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:"Thmanyah Sans";font-weight:700;font-size:17px;box-shadow:0 0 0 3px #fff;z-index:2}
.node.done .num{background:var(--green)}
.node .tag{font-family:"Thmanyah Sans";font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;color:#fff}

/* ===== المحطة (طبقة كاملة) ===== */
#stage{position:fixed;inset:0;z-index:40;display:none;overflow:auto;background:var(--bg,#fff);
 clip-path:circle(0 at var(--x,50%) var(--y,50%));transition:clip-path .75s cubic-bezier(.7,0,.2,1)}
#stage.open{clip-path:circle(150% at var(--x,50%) var(--y,50%))}
#stage .bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(255,255,255,.75);backdrop-filter:blur(8px)}
#stage .bar h2{flex:1;font-size:28px;color:var(--navy)}
#stage .bar .crit{font-family:"Thmanyah Sans";font-size:15px;font-weight:700;color:#fff;padding:5px 12px;border-radius:999px}
.back{width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:24px;color:var(--navy)}
.wrap{max-width:1000px;margin:0 auto;padding:18px 22px 220px}
.inst{display:flex;align-items:center;gap:12px;font-family:"Thmanyah Display";font-size:26px;color:var(--navy);margin:8px 0 18px}
.inst .ic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:#fff;box-shadow:var(--shadow);font-size:26px;flex:none}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 30px;border-radius:999px;background:var(--navy);color:#fff;font-family:"Thmanyah Display";font-size:22px;box-shadow:0 10px 22px -10px var(--navy);transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.gold{background:linear-gradient(135deg,#D8A94A,#B9832B);box-shadow:0 10px 22px -10px #B9832B}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:var(--shadow)}
.btn[disabled]{opacity:.35;pointer-events:none}
.center{text-align:center}
.reveal{opacity:0;transform:translateY(24px);animation:rv .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rv{to{opacity:1;transform:none}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

/* خيارات */
.opts{display:grid;gap:12px;margin-top:14px}
.opt{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:20px;background:#F7F4EC;border:3px solid transparent;font-size:24px;text-align:right;transition:.2s}
.opt:hover{background:#F1EBDC}
.opt .dot{width:30px;height:30px;border-radius:50%;border:3px solid #CDBF9F;flex:none;display:grid;place-items:center;font-size:16px;color:#fff}
.opt.ok{border-color:var(--green);background:var(--mint)}.opt.ok .dot{background:var(--green);border-color:var(--green)}
.opt.no{border-color:var(--red);background:var(--rose)}.opt.no .dot{background:var(--red);border-color:var(--red)}

/* ===== سالم ===== */
#salem{position:fixed;bottom:0;left:14px;z-index:60;display:flex;direction:ltr;align-items:flex-end;gap:6px;pointer-events:none}
#salem img.body{width:118px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18));transform-origin:50% 100%;animation:sBob 3.2s ease-in-out infinite}
#salem.talk img.body{animation:sTalk .5s ease-in-out 4}
@keyframes sBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sTalk{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg) translateY(-6px)}}
#bubble{direction:rtl;pointer-events:none;max-width:min(380px,62vw);margin-bottom:120px;background:#fff;border-radius:24px 24px 24px 6px;padding:14px 18px;box-shadow:0 14px 30px -12px rgba(16,42,76,.45);font-size:21px;line-height:1.6;display:flex;gap:10px;align-items:flex-start;opacity:0;transform:translateY(16px) scale(.9);transition:.35s cubic-bezier(.3,1.5,.6,1);border:2px solid #F0E4C8}
#bubble.show{opacity:1;transform:none}
#bubble img{width:52px;height:52px;border-radius:50%;flex:none;background:#EAF3FB}
#bubble .x{pointer-events:auto;margin-inline-start:auto;font-size:16px;color:#999;padding:0 4px}

/* ===== محطة 1: أتهيأ ===== */
.rate{display:grid;gap:14px}
.rrow{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);border-inline-start:8px solid var(--c)}
.rrow p{flex:1;margin:0;font-size:23px;line-height:1.6}
.faces{display:flex;gap:8px}
.face{width:58px;height:58px;border-radius:50%;background:#F5F1E6;font-size:32px;display:grid;place-items:center;transition:.2s;border:3px solid transparent}
.face.sel{background:#FFF4D6;border-color:var(--gold);transform:scale(1.12)}

/* ===== محطة 2: أقرأ ===== */
.story{display:grid;gap:22px}
.scene{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:center;background:#fff;border-radius:30px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.scene::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:var(--tint);opacity:.6;z-index:0}
.scene .pic{width:240px;height:200px;border-radius:22px;overflow:hidden;background:var(--tint);display:grid;place-items:center;position:relative;z-index:1}
.scene .pic img{width:100%;height:100%;object-fit:cover}
.scene>div{position:relative;z-index:1}
.scene .txt{font-size:31px;line-height:2.05;position:relative;z-index:1}
.scene .n{position:absolute;top:12px;left:14px;font-family:"Thmanyah Sans";font-weight:700;color:var(--gold);font-size:18px;z-index:1}
.kw{background:linear-gradient(transparent 52%,#FFE08A 52%);border-radius:4px;cursor:pointer;padding:0 3px;font-weight:700;color:var(--navy);transition:.2s;position:relative}
.kw:hover{background:#FFE08A}
.kw::after{content:"؟";font-size:14px;position:absolute;top:-10px;left:-6px;background:var(--gold);color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center;font-family:"Thmanyah Sans"}
.kw.seen::after{content:"✓";background:var(--green)}
.kw.nk{cursor:default}.kw.nk::after{display:none}
.scene.verse .txt{line-height:2.3;font-family:"Thmanyah Display",serif}
.think{margin-top:6px;background:var(--peach);border-radius:22px;padding:14px 18px;border:2px dashed #F0C48F}
.think h4{margin:0 0 4px;font-family:"Thmanyah Display";font-size:20px;color:#B76A12}
.think .opts{grid-template-columns:repeat(3,1fr)}
.think .opt{font-size:21px;padding:10px 12px}
.locked-scene{filter:blur(6px);pointer-events:none;opacity:.5}

/* بطاقة المعنى */
#wordPop{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(16,42,76,.25);backdrop-filter:blur(3px)}
#wordPop.show{display:grid}
#wordPop .wcard{width:min(440px,90vw);background:#fff;border-radius:32px;padding:24px;text-align:center;box-shadow:0 30px 60px -20px rgba(16,42,76,.5);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
#wordPop .wpic{height:190px;border-radius:22px;background:var(--sky);display:grid;place-items:center;overflow:hidden;margin-bottom:14px}
#wordPop .wpic img{height:100%;width:100%;object-fit:cover}
#wordPop .w{font-family:"Thmanyah Display";font-size:44px;color:var(--navy)}
#wordPop .m{font-size:28px;color:#6b5a35;margin:6px 0 16px}

/* ===== محطة 3: كلماتي ===== */
.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;perspective:1200px}
.mc{height:170px;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,1.4,.5,1)}
.mc.flip,.mc.matched{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;display:grid;place-items:center;box-shadow:var(--shadow)}
.mc .f{background:linear-gradient(145deg,#1B3C69,#102A4C);}
.mc .f svg{width:58px;opacity:.95}
.mc .b{transform:rotateY(180deg);background:#fff;padding:10px;text-align:center;font-size:24px;line-height:1.5;border:4px solid #fff}
.mc .b.word{font-family:"Thmanyah Display";font-size:30px;color:var(--navy);background:#FFF8E5}
.mc .b img{height:70px;border-radius:12px;margin-bottom:4px}
.mc.matched .b{border-color:var(--green);animation:glowok 1s}
@keyframes glowok{0%{box-shadow:0 0 0 0 rgba(31,157,107,.7)}100%{box-shadow:0 0 0 22px rgba(31,157,107,0)}}

/* ===== محطة 4: من يحب ماذا ===== */
.match{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
.col{display:grid;gap:14px}
.who{display:flex;align-items:center;gap:14px;background:#fff;border-radius:24px;padding:10px;box-shadow:var(--shadow);border:4px solid transparent;transition:.2s;text-align:right}
.who img{width:96px;height:96px;border-radius:18px;object-fit:cover;flex:none}
.who b{font-family:"Thmanyah Display";font-size:26px;color:var(--navy)}
.who.sel{border-color:var(--gold);transform:scale(1.03)}
.who.ok{border-color:var(--green);opacity:.75}
.love{padding:18px;border-radius:24px;background:#fff;box-shadow:var(--shadow);font-size:23px;line-height:1.6;border:4px dashed #E6D8B8;text-align:right;transition:.2s;min-height:96px;display:flex;align-items:center;gap:12px}
.love .ic{font-size:34px}
.love.ok{border:4px solid var(--green);background:var(--mint)}
.love .who-chip{white-space:nowrap;margin-inline-start:auto;font-family:"Thmanyah Display";font-size:18px;color:#fff;background:var(--green);padding:4px 12px;border-radius:999px}

/* ===== محطة 5: خريطة القصة ===== */
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:70px;padding:12px;border-radius:24px;background:#fff;box-shadow:var(--shadow)}
.chip{padding:10px 20px;border-radius:999px;background:#FFF4DA;border:3px solid #F1D79C;font-family:"Thmanyah Display";font-size:23px;color:var(--navy);transition:.2s}
.chip.sel{background:var(--navy);color:#fff;border-color:var(--navy);transform:translateY(-4px) scale(1.06)}
.baskets{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
.basket{border-radius:28px;padding:16px;min-height:220px;background:var(--bk);border:4px dashed rgba(16,42,76,.15);transition:.25s;text-align:center}
.basket.hot{border-style:solid;border-color:var(--navy);transform:translateY(-4px)}
.basket h3{font-size:26px;color:var(--navy);display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.basket .in{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.basket .in span{background:#fff;border-radius:999px;padding:6px 14px;font-size:20px;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}

/* ===== محطة 6: رتب ===== */
.sky{position:relative;height:340px;border-radius:32px;overflow:hidden;background:linear-gradient(var(--skyc,#FDEBD3),#FFF9EF);transition:background 1.2s;box-shadow:var(--shadow)}
.sky svg{position:absolute;inset:0;width:100%;height:100%}
.sun{position:absolute;width:64px;height:64px;border-radius:50%;background:#F7B731;box-shadow:0 0 0 14px rgba(247,183,49,.25),0 0 40px 10px rgba(247,183,49,.45);transform:translate(-50%,-50%);transition:left 1.4s cubic-bezier(.5,0,.3,1),top 1.4s cubic-bezier(.5,0,.3,1)}
.slot{position:absolute;bottom:18px;width:30%;transform:translateX(50%);text-align:center;font-family:"Thmanyah Display";font-size:20px;color:var(--navy)}
.slot .s{height:96px;border-radius:20px;border:3px dashed rgba(16,42,76,.25);background:rgba(255,255,255,.6);display:grid;place-items:center;margin-top:6px;overflow:hidden}
.slot .s img{width:100%;height:100%;object-fit:contain;background:#fff;animation:pop .5s}
.events{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
.ev{background:#fff;border-radius:24px;overflow:hidden;box-shadow:var(--shadow);text-align:right;transition:.25s;border:4px solid transparent}
.ev img{width:100%;height:140px;object-fit:cover;display:block}
.ev p{margin:0;padding:12px 14px;font-size:21px;line-height:1.65}
.ev.used{opacity:.25;transform:scale(.94);pointer-events:none}
.rec{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.micbtn{width:96px;height:96px;border-radius:50%;background:linear-gradient(145deg,#E25D5D,#C23B3B);color:#fff;font-size:40px;display:grid;place-items:center;box-shadow:0 14px 26px -10px #C23B3B;position:relative}
.micbtn.on::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid #E25D5D;animation:ring 1.2s infinite}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
.timer{font-family:"Thmanyah Sans";font-weight:700;font-size:26px;color:var(--red);min-width:70px}

/* ===== محطة 7: رسالتي ===== */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.tile{background:#fff;border-radius:22px;padding:14px 8px;box-shadow:var(--shadow);text-align:center;border:4px solid transparent;transition:.2s;font-size:19px;line-height:1.5}
.tile .e{font-size:44px;display:block;margin-bottom:6px}
.tile.sel{border-color:var(--gold);background:#FFF8E5;transform:translateY(-6px)}
.mycard{margin:26px auto 0;max-width:620px;border-radius:34px;padding:30px 28px 26px;text-align:center;position:relative;overflow:hidden;
 background:radial-gradient(circle at 80% 0%,#FFF4D6,transparent 55%),linear-gradient(160deg,#fff,#FFF9EC);border:3px solid var(--gold2);box-shadow:0 26px 50px -24px rgba(196,148,58,.7)}
.mycard .top{font-family:"Thmanyah Sans";font-size:16px;color:var(--gold);letter-spacing:.5px}
.mycard h3{font-size:34px;color:var(--navy);margin:6px 0 14px}
.mycard .big{font-size:64px}
.mycard p{font-size:28px;line-height:1.9;margin:8px 0}
.mycard .sig{margin-top:12px;font-family:"Thmanyah Sans";font-size:15px;color:#8a7a5a}

/* ===== محطة 8: مع أسرتي ===== */
.fam{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.fm{background:#fff;border-radius:20px;padding:12px 6px;text-align:center;box-shadow:var(--shadow);border:4px solid transparent;font-family:"Thmanyah Display";font-size:20px;color:var(--navy);transition:.2s}
.fm .e{font-size:40px;display:block}
.fm.sel{border-color:var(--green);background:var(--mint)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:10px}
.day{background:#fff;border-radius:20px;padding:10px 4px 12px;text-align:center;box-shadow:var(--shadow);font-family:"Thmanyah Sans";font-size:15px;font-weight:700;color:var(--navy)}
.day svg{width:44px;height:56px;display:block;margin:4px auto}
.day .act{font-family:"Thmanyah Text";font-weight:500;font-size:13px;color:#7b6a44;min-height:20px}
.day.lit svg .fl{fill:#F7B731}
.day.lit{background:#FFF8E1}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}

/* ===== محطة 9: أتحقق ===== */
.qbox{max-width:760px;margin:0 auto}
.qprog{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.qprog i{width:44px;height:10px;border-radius:999px;background:#E9E1CF}

  fin.querySelector("#famDone").onclick=()=>{if(!S.fam.asked.length){say("الْمِسْ صورَةَ مَنْ شارَكَكَ مِنْ أُسْرَتِكَ.","think",4000);fam.classList.add("shake");setTimeout(()=>fam.classList.remove("shake"),500);return}fin.remove();complete("family","أَنْجَزْتَ مُهِمَّةَ الْبَيْتِ. قَناديلُ الْأُسْبوعِ تَبْقى مَفْتوحَةً كُلَّ يَوْمٍ.")};
  say("أَضِئْ قِنْديلًا كُلَّ يَوْمٍ تَلْتَزِمُ فيهِ ما تَعَلَّمْتَهُ.","wink",5000);
 }
};
Object.keys(RENDER).forEach(k=>{if(!["ready","check"].includes(k))delete RENDER[k]});
Object.assign(RENDER,IE,{read(el){const st=STATIONS.find(s=>s.id==="read");
 if(st&&(st.parts||st.crit!=null)){const box=h(`<div></div>`);window.__afterRead=()=>{box.innerHTML="";el.appendChild(box);runParts(box,st)}}readBook(el)}});
STATIONS.forEach(s=>{if(s.parts&&s.id!=="read")RENDER[s.id]=el=>runParts(el,s)});

/* ================= الخاتمة ================= */
function showFinale(){const f=$("#finale");
 const rows=CRIT.map(c=>{const b=S.pre[c.k]??0,a=S.post[c.k]??0;return `<div class="bar2"><div class="t"><span class="med" style="background:${S.medals[c.k]?c.c:"#ddd"}"><svg width="18" height="18" style="color:#fff"><use href="#medal"/></svg></span>${c.t}</div><div class="ba"><span>قَبْلَ</span><div class="track"><i data-w="${(b+1)/3*100}" style="background:#CDBF9F"></i></div><span>بَعْدَ</span><div class="track"><i data-w="${(a+1)/3*100}" style="background:${c.c}"></i></div></div></div>`}).join("");
 f.innerHTML=`<div class="cert"><svg class="bigLamp" viewBox="0 0 100 120"><circle cx="50" cy="8" r="5" fill="none" stroke="#102A4C" stroke-width="3.5"/><path d="M32 34 Q32 20 50 14 Q68 20 68 34Z" fill="#102A4C"/><rect x="26" y="34" width="48" height="7" rx="3.5" fill="#102A4C"/><path d="M29 44 L71 44 L78 100 Q50 114 22 100Z" fill="#FFF1C9" stroke="#102A4C" stroke-width="5"/><path d="M50 56 L62 80 Q65 88 58 94 L42 94 Q35 88 38 80Z" fill="#F7B731"/><line x1="36" y1="112" x2="64" y2="112" stroke="#102A4C" stroke-width="5" stroke-linecap="round"/></svg>
 <h1>أَضَأْتَ قَناديلَ الرِّحْلَةِ كُلَّها!</h1><div class="sub">${NAME?esc(NAME)+" · ":""}«${D.title}» · ${Object.values(S.medals).filter(Boolean).length} أَوْسِمَةٍ مِنْ 4</div>
 <div class="bars">${rows}</div>
 <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><button class="btn gold" id="fRep">👪 أُري أَهْلي تَقْريري</button><button class="btn ghost" id="fMist">📒 دَفْتَرُ أَخْطائي (${S.mist.length})</button><button class="btn ghost" id="fMap">إِلى الْخَريطَةِ</button></div></div>`;
 f.classList.add("show");burst(innerWidth/2,innerHeight/3,160);tone(true);setTimeout(()=>burst(innerWidth*.25,innerHeight/2,80),500);setTimeout(()=>burst(innerWidth*.75,innerHeight/2,80),900);
 setTimeout(()=>f.querySelectorAll(".track i").forEach(i=>i.style.width=i.dataset.w+"%"),300);
 say("مَبْروكٌ يا بَطَلَ حِراءٍ! أَرِ أَهْلَكَ تَقْريرَكَ، فَهُمْ فَخورونَ بِكَ.","great",7000);
 $("#fRep").onclick=openReport;$("#fMist").onclick=openMist;$("#fMap").onclick=()=>{f.classList.remove("show");drawMap()};
}

/* ================= دفتر الأخطاء ================= */
function openMist(){const p=$("#mistPanel");
 p.innerHTML=`<h2><button class="back" id="mX">✕</button> 📒 دَفْتَرُ أَخْطائي</h2><p style="font-size:20px;color:#6b5a35">كُلُّ خَطَإٍ هُنا فُرْصَةٌ لِأَتَعَلَّمَ. أُجيبُ مِنْ جَديدٍ، فَإِذا أَصَبْتُ خَرَجَ السُّؤالُ مِنَ الدَّفْتَرِ.</p><div id="ml"></div>`;
 const ml=p.querySelector("#ml");
 if(!S.mist.length)ml.innerHTML=`<div class="empty">🌟<br>دَفْتَرُكَ نَظيفٌ! لا أَخْطاءَ لِلْمُراجَعَةِ.</div>`;
 S.mist.slice().forEach(m=>{const c=h(`<div class="mist"><div class="q">${m.q}</div><div class="o"></div></div>`);ml.appendChild(c);
  mcq(c.querySelector(".o"),{id:"m-"+m.q,q:m.q,o:m.opts,a:m.ans,st:m.st,onDone:()=>{S.mist=S.mist.filter(x=>x.q!==m.q);save();updMist();setTimeout(()=>{c.style.transition=".5s";c.style.opacity=0;c.style.transform="translateX(-40px)";setTimeout(()=>{c.remove();if(!S.mist.length)ml.innerHTML=`<div class="empty">🌟<br>راجَعْتَ أَخْطاءَكَ كُلَّها! أَحْسَنْتَ.</div>`},500)},900)}})});
 $("#mistDrawer").classList.add("show");p.querySelector("#mX").onclick=()=>$("#mistDrawer").classList.remove("show");
}
$("#mistBtn").onclick=openMist;$("#mistDrawer").onclick=e=>{if(e.target.id==="mistDrawer")e.target.classList.remove("show")};

/* ================= تقرير ولي الأمر ================= */
const LV=["يحتاج إلى مساعدة","يستطيع قليلًا","يستطيع جيدًا"];
function openReport(){const p=$("#repPanel");
 const stLabel={who:"الشخصيات",map:"عناصر القصة",order:"ترتيب الأحداث",message:"الرسالة",check:"التحقق النهائي",read:"القراءة",words:"المفردات"};
 const doneN=STATIONS.filter(s=>S.done[s.id]).length;const mins=Math.max(1,Math.round(S.secs/60));
 const firstIds=Object.keys(S.first);const firstOk=firstIds.filter(k=>S.first[k]).length;
 const critRows=CRIT.map((c,i)=>{const st=STATIONS.find(s=>s.crit===i);const got=!!S.medals[c.k];const b=S.pre[c.k],a=S.post[c.k];
  return `<tr><td><span class="pill" style="background:${c.c}">${c.name.replace(/[ًٌٍَُِّْ]/g,"")}</span></td><td>${plain(c.t).replace(/[ًٌٍَُِّْ]/g,"")}</td><td>${got?"✅ تحقق":"⏳ لم يكتمل"}${st&&st.id in S.first?(S.first[st.id]?" · من أول محاولة":" · بعد محاولات"):""}</td><td style="font-size:14px;color:#7b6a44">${b!=null?LV[b]:"—"} ← ${a!=null?LV[a]:"—"}</td></tr>`}).join("");
 const F=["الأب","الأم","الجد","الجدة","الأخ","الأخت"];
 const mistTxt=S.mist.length?`<ul>${S.mist.map(m=>`<li>${m.q.replace(/[ًٌٍَُِّْ]/g,"")} — <b style="color:var(--green)">${m.opts[m.ans].replace(/[ًٌٍَُِّْ]/g,"")}</b></li>`).join("")}</ul>`:"<p>لا توجد أخطاء معلّقة؛ راجع طفلكم كل ما أخطأ فيه. 🌟</p>";
 p.innerHTML=`<div style="display:flex;align-items:center;gap:12px"><button class="back" id="rX">✕</button><svg viewBox="0 0 653 260" height="52"><use href="#lockup"/></svg></div>
 <h2 style="font-size:28px;color:var(--navy);margin-top:12px">تقرير وليّ الأمر · رحلة «${esc(D.titlePlain)}»</h2>
 <p style="margin:2px 0 0;color:#7b6a44">التربية الإسلامية · الصف الأول · ${new Date().toLocaleDateString("ar-AE-u-nu-latn",{day:"numeric",month:"long",year:"numeric"})}</p>
 <div class="sec"><div class="stat"><div><b>${doneN}/${STATIONS.length}</b>محطات أُنجزت</div><div><b>${Object.values(S.medals).filter(Boolean).length}/4</b>أوسمة</div><div><b>${mins}</b>دقيقة تعلّم</div></div></div>
 <div class="sec"><h3>🎯 معايير النجاح</h3><table>${critRows}</table><p style="font-size:14px;color:#7b6a44;margin:6px 0 0">العمود الأخير: تقييم طفلكم لنفسه قبل الرحلة ← بعدها.</p></div>
 <div class="sec"><h3>📊 الدقة</h3><p>أجاب طفلكم <b>${firstOk}</b> من <b>${firstIds.length}</b> مهمة صحيحًا من المحاولة الأولى${S.quiz?`، وحصل في التحقق النهائي على <b>${S.quiz.score} من ${S.quiz.of}</b>`:""}.</p></div>
 <div class="sec"><h3>📚 كلمات جديدة تعلّمها</h3><p>${S.words.length?S.words.map(w=>w.replace(/[ًٌٍَُِّْ]/g,"")).join("، "):"—"}</p></div>
 <div class="sec"><h3>📒 ما يحتاج إلى مراجعة</h3>${mistTxt}</div>
 ${S.card?`<div class="sec" style="background:#FFF9EC"><h3>💛 ${S.card.head.replace(/[ًٌٍَُِّْ]/g,"")}</h3><p style="font-size:19px">وعد طفلكم: <b>${S.card.pledge.replace(/[ًٌٍَُِّْ]/g,"")}</b></p></div>`:""}
 ${window.__retell?`<div class="sec"><h3>🎙️ صوت طفلكم</h3><audio controls src="${window.__retell}" style="width:100%"></audio></div>`:S.retold?`<div class="sec"><h3>🎙️ بصوت طفلكم</h3><p>عبّر طفلكم بصوته عن حبه لربه وشكره؛ اطلبوا منه أن يقولها لكم.</p></div>`:""}
 <div class="sec"><h3>🏠 مهمة البيت</h3><p>${S.fam.asked.length?`سأل طفلكم: ${S.fam.asked.map(i=>F[i]).join("، ")}.`:"لم تُنجز بعد."} أسبوع السلوك: أضاء <b>${Object.keys(S.fam.week).length}</b> من 7 قناديل.</p></div>
 <div class="sec" style="background:#EFF7F1"><h3>💬 حاوروا طفلكم الليلة</h3><ul>${D.talk.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>
 <p style="font-size:14px;color:#8a7a5a;margin-top:14px">${ROLE==="student"?"تصل هذه النتائج إلى معلّم طفلكم على منصة حراء ليبني عليها في الحصة القادمة.":"تُحفظ هذه النتائج على هذا الجهاز؛ وعند الدخول بحساب الطالب على منصة حراء تصل إلى معلّمه."}</p>`;
 $("#repDrawer").classList.add("show");p.querySelector("#rX").onclick=()=>$("#repDrawer").classList.remove("show");
}
$("#repBtn").onclick=openReport;$("#repDrawer").onclick=e=>{if(e.target.id==="repDrawer")e.target.classList.remove("show")};

/* ================= البدء ================= */
function fitTop(){$("#map").style.top=$("#top").offsetHeight+"px"}fitTop();addEventListener("resize",fitTop);
let booted=false;
function boot(){if(booted)return;booted=true;
drawMedals();updMist();drawMap();addEventListener("resize",()=>drawMap());
if(ROLE==="staff"){const b=h(`<div class="ui" style="position:fixed;bottom:12px;right:12px;z-index:65;background:#102A4C;color:#fff;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:700">👁️ معاينة المعلم: لا تُحفظ النتائج</div>`);document.body.appendChild(b)}
setTimeout(()=>{const n=STATIONS.findIndex((s,i)=>unlocked(i)&&!S.done[s.id]);
 say(n===0?"أَهْلًا بِكَ في رِحْلَةِ الْقِنْديلِ! الْمِسِ الْقِنْديلَ الْأَوَّلَ لِنَبْدَأَ. 🏮":n<0?"أَكْمَلْتَ الرِّحْلَةَ! راجِعْ دَفْتَرَ أَخْطائِكَ، أَوْ أَضِئْ قَناديلَ أُسْبوعِ الْعَطاءِ.":`أَهْلًا بِعَوْدَتِكَ! الْقِنْديلُ التّالي: «${STATIONS[n].t}».`,"cheer",6000);
 const cur=document.querySelector(".node.current");if(cur)cur.scrollIntoView({behavior:"smooth",block:"center"})},700);
}
if(EMBED){
 const cl=h(`<button class="topbtn" id="jrClose" title="إغلاق" aria-label="إغلاق">✕</button>`);$("#top").appendChild(cl);
 cl.onclick=()=>{save();window.parent.postMessage({type:"hiraa-journey-close"},location.origin)};
 addEventListener("message",e=>{if(e.origin!==location.origin||e.source!==window.parent||!e.data||e.data.type!=="hiraa-journey-init")return;
  const d=e.data;ROLE=d.role||"guest";NAME=d.name||"";if(d.book&&d.book.body&&!window.__ownBook)BOOK=d.book;
  if(ROLE==="student"&&d.uid){KEY+="-"+d.uid;const loc=load(KEY),srv=d.state?Object.assign(fresh(),d.state):null;
   S=[loc,srv].filter(Boolean).sort((a,b)=>doneN(b)-doneN(a)||(b.secs||0)-(a.secs||0))[0]||fresh();}
  else if(ROLE!=="staff"){S=load(KEY)||fresh()}
  boot()});
 window.parent.postMessage({type:"hiraa-journey-ready",code:LESSON.code},location.origin);
 setTimeout(()=>{if(!booted){S=load(KEY)||fresh();boot()}},3000);
}else boot();
</script>
