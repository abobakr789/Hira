#hira-root{--ink:#1F2A3C;--teal:#17566B;--deep:#0F3D4E;--gold:#C99A2E;--cream:#FBF7EF;--green:#5B9A7E;--orange:#E58E6B;--blue:#6AA0CF;--purple:#8B6BB5}
*{box-sizing:border-box;margin:0;padding:0}

#viewport{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{width:1920px;height:1080px;position:relative;flex:none;transform-origin:center center;direction:rtl}
.slide{position:absolute;inset:0;display:none;overflow:hidden;direction:rtl}
.slide.on{display:block}
.logo{position:absolute;left:56px;top:34px;height:62px;z-index:3}
.titlebar{position:absolute;right:96px;top:44px;display:flex;align-items:center;gap:22px;z-index:3}
.titlebar h1{font-family:"ThD";font-size:66px;line-height:1.15;color:var(--deep);padding-bottom:6px;border-bottom:6px solid var(--gold);font-weight:700}
.chip{font-size:28px;padding:6px 22px;border-radius:40px;background:#F3E3B8;color:#7A5A12;white-space:nowrap}
.chip.pair{background:#CFE5F5;color:#1D4F77}.chip.group{background:#DCEFD9;color:#2C6A3C}.chip.solo{background:#F6DCCB;color:#8A4A22}.chip.home{background:#E4D9F3;color:#573A8A}.chip.cl{background:#F3E3B8;color:#7A5A12}
.foot{position:absolute;left:0;right:0;bottom:0;height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 64px 6px;font-size:26px;color:#6C6A63;z-index:3}
.dots{display:flex;gap:12px}.dots i{width:16px;height:16px;border-radius:50%;display:block}
.body{position:absolute;left:96px;right:96px;top:150px;bottom:170px;display:flex;flex-direction:column;gap:26px}
.card{background:#fff;border-radius:28px;box-shadow:0 8px 28px rgba(31,42,60,.10);padding:30px 40px;border-inline-end:10px solid var(--teal);position:relative}
.card.gold{border-inline-end-color:var(--gold)}
.t-big{font-size:58px;line-height:1.65;font-weight:600}
.t-mid{font-size:44px;line-height:1.7;font-weight:500}
.t-sm{font-size:36px;line-height:1.6}
.lead{font-size:40px;color:var(--teal);font-weight:700}
.row{display:flex;gap:28px}.col{display:flex;flex-direction:column;gap:22px}.grow{flex:1}
.lines{display:flex;flex-direction:column;gap:46px;margin-top:26px}.lines i{display:block;border-bottom:3px dotted #B9B2A0;height:2px}
.ill{flex:none;display:flex;align-items:center;justify-content:center}
.ill svg{width:100%;height:100%}
/* answer button + panel */
.ansbtn{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);z-index:20;border:0;cursor:pointer;font-family:"ThD";font-size:36px;font-weight:700;color:#fff;background:linear-gradient(180deg,#1E6A82,#0F3D4E);padding:16px 54px;border-radius:60px;box-shadow:0 8px 22px rgba(15,61,78,.35);display:flex;align-items:center;gap:14px;transition:transform .15s}
.ansbtn:hover{transform:translateX(-50%) scale(1.04)}
.ansbtn.pinned{background:linear-gradient(180deg,#D8A93A,#B07F14)}
.ansbtn svg{width:40px;height:40px}
.ansp{position:absolute;left:96px;right:96px;bottom:170px;z-index:19;background:#FFFDF6;border:5px solid var(--gold);border-radius:34px;box-shadow:0 20px 60px rgba(15,61,78,.35);padding:30px 46px 34px;opacity:0;transform:translateY(40px);pointer-events:none;transition:opacity .18s,transform .18s;max-height:760px;overflow:hidden}
.ansp.show{opacity:1;transform:none}
.ansp h3{font-family:"ThD";font-size:36px;color:#8A6410;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.ansp .a{font-size:40px;line-height:1.7}
.ansp .a b{color:var(--deep)}
.ansp ol,.ansp ul{padding-inline-start:44px}.ansp li{margin:4px 0}
.note{font-size:26px;color:#8A6410;margin-top:10px}
/* hadith */
.hadith{background:#FFFBEA;border:4px solid #E3C679;border-radius:30px;padding:28px 44px;position:relative}
.hadith .tag{position:absolute;top:-24px;right:40px;background:#C99A2E;color:#fff;font-family:"ThD";font-size:30px;padding:4px 26px;border-radius:30px}
.hadith p{font-family:"ThT","Amiri Q";font-size:40px;line-height:1.95;font-weight:500}
.hadith .src{font-size:28px;color:#7A5A12;margin-top:6px}
.hl{background:linear-gradient(transparent 55%,#F6D47A 55%)}
/* boxes */
.gbox{background:#fff;border:3px dashed #9DB8AE;border-radius:26px;padding:18px 26px;flex:1;display:flex;flex-direction:column;position:relative}
.gbox .n{position:absolute;top:-22px;right:22px;width:48px;height:48px;border-radius:50%;background:var(--teal);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;font-family:"ThD"}
.sticky{background:#FFEFA0;border-radius:6px;padding:26px 34px;box-shadow:0 10px 24px rgba(0,0,0,.14);flex:1;position:relative}
.sticky:before{content:"";position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:140px;height:40px;background:#E8C25A;border-radius:4px}
.sticky h4{font-family:"ThD";font-size:42px;color:var(--deep)}
.pill{display:inline-flex;align-items:center;gap:10px;border-radius:40px;padding:6px 24px;font-size:30px}
.grpbadge{position:absolute;top:150px;left:96px;display:flex;gap:14px;z-index:4}
.gb{font-family:"ThD";font-size:30px;color:#fff;padding:6px 26px;border-radius:30px}
.chipx{font-size:34px;padding:10px 22px;border-radius:18px;border:3px solid #C8D3CF;background:#fff;cursor:pointer;user-select:none;transition:all .12s}
.chipx.a{background:#D9F0E0;border-color:#5B9A7E;color:#1F5A3A}.chipx.b{background:#FBDCCD;border-color:#E58E6B;color:#8A3A1A}
table.t{border-collapse:separate;border-spacing:0 10px;width:100%}
table.t th{background:#7FAE5F;color:#fff;font-size:34px;padding:12px;font-family:"ThD"}
table.t td{background:#fff;font-size:34px;padding:12px 22px;line-height:1.5}
.rate{display:flex;gap:10px}.rate b{width:64px;height:64px;border-radius:50%;border:3px solid #9DB4C4;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer;background:#fff;color:#35566B;transition:all .12s}
.rate b.on{background:var(--teal);color:#fff;border-color:var(--teal);transform:scale(1.08)}
.tick{width:46px;height:46px;border:3px solid #C9A24A;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:34px;color:#1F6A3A;background:#fff;cursor:pointer;flex:none}
.opt{display:flex;align-items:center;gap:14px;font-size:32px;padding:8px 20px;border-radius:16px;border:3px solid #D6DDD7;background:#fff;cursor:pointer;transition:all .12s}
.opt.ok{background:#D9F0E0;border-color:#4F9A6C}.opt.no{background:#FBDDD3;border-color:#D9784E}
.opt .l{width:42px;height:42px;border-radius:50%;background:#EAF1EE;display:flex;align-items:center;justify-content:center;font-family:"ThD";font-size:28px;flex:none}
/* ui chrome */
.tnote{margin-top:6px;font-size:24px;color:#6B5313;background:#FFF8E3;border:2px dashed #D9B860;border-radius:16px;padding:8px 18px;max-height:230px;overflow:auto}.tnote summary{cursor:pointer;font-weight:700}.tnote div{font-size:22px;line-height:1.6;margin-top:6px}
#ui{position:absolute;left:12px;bottom:10px;display:flex;gap:8px;z-index:50;opacity:0;transition:opacity .2s;direction:ltr}:hover>#ui,#ui:hover,#ui:focus-within{opacity:.95}@media (pointer:coarse),(max-width:900px){#ui{top:6px;bottom:auto;opacity:.75;gap:5px}#ui button{font-size:13px;padding:5px 10px}}
#ui button{background:rgba(15,40,56,.85);color:#fff;border:0;border-radius:12px;font-family:"ThT";font-size:18px;padding:8px 16px;cursor:pointer;direction:rtl}
#ui button:hover{background:#17566B}
#idx{position:absolute;inset:0;background:rgba(10,18,28,.96);z-index:60;display:none;overflow:auto;padding:30px;direction:rtl}
#idx.on{display:block}
#idx .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
#idx a{background:#1B2A3A;color:#fff;border-radius:12px;padding:12px 16px;font-size:20px;cursor:pointer;border:2px solid transparent;line-height:1.5}
#idx a:hover{border-color:var(--gold)}#idx a small{display:block;color:#B9C6D2;font-size:15px}
#prog{position:absolute;top:0;left:0;height:5px;background:var(--gold);z-index:70;width:0;transition:width .2s}
.hint{position:absolute;right:50%;top:50%}

#hira-root{position:relative;width:100%;aspect-ratio:16/9;overflow:clip;background:#0E1621;font-family:"ThT","Cairo",Tahoma,sans-serif;color:var(--ink);border-radius:12px}#hira-root:fullscreen{aspect-ratio:auto;border-radius:0}

#hira-root,#hira-root *{-webkit-text-size-adjust:100%;text-size-adjust:100%}@media (max-width:900px){#hira-root #ui{top:3px;left:3px;gap:3px}#hira-root #ui button{font-size:10px!important;padding:2px 6px!important;border-radius:7px!important;line-height:1.2}#hira-root #ui span{font-size:10px!important}}

@media (max-width:900px){#hira-root{aspect-ratio:57/40!important;background:#0E1621}#hira-root #ui{top:auto!important;bottom:4px!important;left:0!important;right:0!important;justify-content:center;opacity:1!important;gap:4px!important}#hira-root #ui button{font-size:11px!important;padding:3px 8px!important}}
</style>

function gTask(num,gi,title,x,y){const body=typeof x==='string'?x:y;const opts=typeof x==='object'?x:(y||{});const desc=opts.d?`<div style="display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border-radius:20px;padding:6px 24px;box-shadow:0 4px 12px rgba(0,0,0,.07)"><span style="font:700 26px ThD;color:#17566B;white-space:nowrap">الناتج المطلوب:</span><span style="font:600 26px ThT;color:#33414E">${opts.d}</span></div>`:'';const strip=opts.d?`<div style="position:absolute;left:64px;right:64px;bottom:80px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(255,255,255,.96);border-radius:24px;padding:8px 20px;box-shadow:0 6px 16px rgba(0,0,0,.10)"><div style="display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;gap:6px;max-width:100%"><span style="font:700 20px ThD;color:#17566B;white-space:nowrap">معايير نجاح العمل:</span>${[['دليل صحيح','أستند إلى نص الدرس أو دليله'],['موقف واقعي','أعطي مثالًا من الحياة'],['لغة سليمة','أعرض فكرتي بوضوح واحترام'],['هوية وطنية','أربط الفكرة بسلوك يحافظ على مساجدنا']].map(c=>`<span style="background:#fff;border:2px solid #DCE5DF;color:#2C6A3C;font:600 19px ThT;border-radius:30px;padding:3px 12px;white-space:nowrap">✓ <b>${c[0]}:</b> ${c[1]}</span>`).join('')}</div><span class="pill" style="background:#F3E8F7;color:#6A4A86;font-size:20px;padding:3px 16px"><b style="font-family:ThD">تعلّم عالي الأداء (HPL)</b> · ${opts.h}</span></div>`:'';return `${titlebar(title,'المجموعة '+['1','2','3','4'][gi]+' · العمل '+num,'group')}
